        <button class="pg-grip" aria-label="Move block: drag, or use arrow keys" onPointerDown=${e => ds.start(e, i)} onKeyDown=${e => ds.key(e, i, blocks.length)}>${GRIP}</button>
        <div class="pg-body">${body(b)}</div></div>
      ${b.type === "toggle" && b.open && html`<div class="pg-togbody"><${AutoText} value=${b.body} placeholder="Details inside the toggle" label="Toggle details" onChange=${v => setB(b.id, { body: v })} /></div>`}
      ${m && html`<div class="card pg-menu" role="listbox" aria-label="Add a block">
        <div class="k">${m.length ? "ADD A BLOCK" : "NO MATCH"}</div>
        ${m.map((x, k) => html`<button key=${x[0]} role="option" aria-selected=${k === hi} class=${"pg-mi" + (k === hi ? " hi" : "")} onMouseDown=${e => e.preventDefault()} onClick=${() => choose(b, x[0])}>
          <i aria-hidden="true">${x[3]}</i><span>${x[1]}<small>${x[2]}</small></span></button>`)}</div>`}
    </div>`; })}</div>
    <button class="pg-add" onClick=${() => { const nb = B("p", "/"); setBlocks(bs => [...bs, nb]); setActive(nb.id); focusOn(nb.id); }}>＋ Add a block</button>
    <p class="small muted" style=${{ margin: "18px 0 28px" }}>Tip: type / in any line to change it into a heading, checklist, toggle and more.</p>
    <div class="grow"></div>
    <div class="foot"><${Tabs} tab="journal" go=${go} /></div>
  </main>`;
}

const Brand = () => html`<div class="brandbar"><div class="logo" role="img" aria-label="QalamStorys"><span class="lq" aria-hidden="true">Qalam</span><span class="ls" aria-hidden="true">Storys</span></div></div>`;
function Tabs({ tab, go }) {
  const T = [["today", "Today", I.sun], ["journal", "Journal", I.book], ["blogs", "Blogs", I.cards], ["community", "Community", I.people], ["progress", "Progress", I.chart]];
  return html`<nav class="tabbar" aria-label="Tabs">${T.map(([id, label, icon]) => html`
    <button key=${id} aria-current=${tab === id ? "page" : null} onClick=${() => go(id)}>${icon}${label}</button>`)}</nav>`;
}

/* ---------- App ---------- */
function App() {
  const [profile, setProfile] = useStored("profile", null);
  const [view, setView] = useState(() => store.get(P + "profile", null) ? (/[?&]circle=/.test(location.search) ? "circle" : store.get(P + "tab", "today")) : "onboarding");
  const [log, setLog] = useStored("log", {});
  const [rest] = useStored("rest", []);
  const [journal, setJournal] = useStored("journal", []);
  const [doneMap, setDoneMap] = useStored("done", {});
  const [focus, setFocus] = useState(null);
  const [doneInfo, setDoneInfo] = useState(null);
  const [editing, setEditing] = useState(null);
  const [blogId, setBlogId] = useState(null);
  const [draft, setDraft] = useState(null);
  const [pages, setPagesRaw] = useStored("pages", []);
  const [pageSync, pagesChanged] = usePageSync(setPagesRaw);
  const setPages = f => { setPagesRaw(f); pagesChanged(); };
  const [pageId, setPageId] = useState(() => store.get(P + "page", null));
  const [jseg, setJseg] = useStored("jseg", "entries");
  const [tplOpen, setTplOpen] = useState(false);
  const [trashView, setTrashView] = useState(false);
  const [toastMsg, setToastMsg] = useState(null);
  const toastT = useRef(null);
  const toast = (text, undo) => { clearTimeout(toastT.current); setToastMsg({ text, undo }); toastT.current = setTimeout(() => setToastMsg(null), 5000); };
  const openPage = id => { setPageId(id); store.set(P + "page", id); setView("page"); window.scrollTo(0, 0); };
  const trashPage = id => { setPages(all => all.map(x => x.id === id ? { ...x, trashed: true, at: Date.now() } : x)); setJseg("pages"); go("journal");
    toast("Moved to trash", () => setPages(all => all.map(x => x.id === id ? { ...x, trashed: false, at: Date.now() } : x))); };
  const blogPage = id => pages.find(p => p.blog && p.blog.id === id && !p.deleted && !p.trashed);
  const [dark, setDark] = useState(() => { const t = store.get(P + "theme", null); if (t) document.documentElement.dataset.theme = t; return t ? t === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); });
  const toggleTheme = () => { const t = dark ? "light" : "dark"; document.documentElement.dataset.theme = t; store.set(P + "theme", t); setDark(!dark); };
  const today = dayKey();
  const light = store.get(P + "light", "") === today;
  const wins = light ? winsFor(profile && profile.goals, profile && profile.wins).slice(0, 1).map(w => ({ ...w, mins: 1, meta: w.goal + " · 1 min" })) : winsFor(profile && profile.goals, profile && profile.wins);
  const done = doneMap[today] || [];
  const setDone = v => { setDoneMap(m => ({ [today]: v })); setLog(l => ({ ...l, [today]: { ...(l[today] || {}), w: v.length } })); };
  const toggle = id => setDone(done.includes(id) ? done.filter(x => x !== id) : [...done, id]);
  const go = v => { if (["today", "journal", "blogs", "community", "progress"].includes(v)) store.set(P + "tab", v); if (v === "journalWrite") { setEditing(null); setDraft(null); } setView(v); window.scrollTo(0, 0); };
  // comeback: 2+ quiet days and nothing done today
  let gap = 0; while (gap < 30 && !(((log[keyOf(gap + 1)] || {}).w || 0) > 0) && !rest.includes(keyOf(gap + 1))) gap++;
  const comeback = Object.values(log).some(v => v.w > 0) && !done.length && gap >= 2 && store.get(P + "comeback", "") !== today && !rest.includes(today) ? gap : 0;
  useEffect(() => { document.body.style.background = focus !== null ? "#1E1B4B" : ""; }, [focus]);

  const toastEl = toastMsg && html`<div class="pg-toast" role="status">${toastMsg.text}${toastMsg.undo && html`<button onClick=${() => { toastMsg.undo(); setToastMsg(null); }}>Undo</button>`}</div>`;
  if (view === "page" && pageId) return html`<${React.Fragment}><${PageView} go=${go} key=${pageId} id=${pageId} pages=${pages} setPages=${setPages} openPage=${openPage} trash=${trashPage}
    back=${() => { const p = pages.find(x => x.id === pageId); const up = p && p.parent && pages.find(x => x.id === p.parent && !x.trashed && !x.deleted); if (up) openPage(up.id); else { setJseg("pages"); go("journal"); } }}
    openBlog=${bid => { if (BLOGS.some(b => b.id === bid)) { setBlogId(bid); setView("blog"); window.scrollTo(0, 0); } }} />${toastEl}</${React.Fragment}>`;
  if (view === "onboarding") return html`<${Onboarding} profile=${profile} done=${p => { setProfile(p); go("today"); }} />`;
  if (focus !== null) return html`<${Focus} win=${wins[focus] || wins[0]} idx=${focus} total=${wins.length} close=${() => setFocus(null)}
    did=${(mins, secs) => { const w = wins[focus] || wins[0]; if (!done.includes(w.id)) setDone([...done, w.id]); setLog(l => ({ ...l, [today]: { ...(l[today] || {}), w: Math.max(((l[today] || {}).w || 0), done.includes(w.id) ? done.length : done.length + 1), m: ((l[today] || {}).m || 0) + mins } })); setDoneInfo({ idx: focus, secs }); setFocus(null); setView("done"); }} />`;
  if (view === "done" && doneInfo) return html`<${Done} idx=${doneInfo.idx} total=${wins.length} secs=${doneInfo.secs} go=${go} />`;
  if (view === "journalWrite") return html`<${JournalWrite} go=${go} entry=${editing ? journal.find(e => e.at === editing) : null} draft=${editing ? null : draft}
    close=${() => { if (!editing && draft && draft.blog) { setDraft(null); setView("blog"); window.scrollTo(0, 0); } else go(editing ? "journal" : store.get(P + "tab", "today")); }}
    save=${e => { setJournal(j => [e, ...j.filter(x => x.at !== e.at)].sort((a, b) => b.at - a.at)); setEditing(null); setDraft(null); go("journal"); }} />`;
  if (view === "journal") return html`<${React.Fragment}><${Journal} go=${go} journal=${journal} log=${log} open=${at => { setEditing(at); setView("journalWrite"); window.scrollTo(0, 0); }}
    seg=${jseg} setSeg=${s => { setJseg(s); setTrashView(false); }}
    pagesUI=${html`<${PagesHome} pages=${pages} setPages=${setPages} openPage=${openPage} sync=${pageSync} trashView=${trashView} setTrashView=${setTrashView} toast=${toast} />`}
    newPageCta=${html`<button class="cta" onClick=${() => setTplOpen(true)}>＋ New page</button>`} />
    ${tplOpen && html`<${TemplateSheet} close=${() => setTplOpen(false)} pick=${t => { const np = newPage(null, t); setPages(all => [...all, np]); setTplOpen(false); openPage(np.id); }} />`}${toastEl}</${React.Fragment}>`;
  if (view === "blog" && blogId) return html`<${BlogPost} go=${go} id=${blogId} back=${() => go("blogs")} hasPage=${id => !!blogPage(id)}
    toPages=${b => { const ex = blogPage(b.id); if (ex) return openPage(ex.id); const np = newPage(null, { make: () => pageFromBlog(b) }); setPages(all => [...all, np]); openPage(np.id); }}
    toJournal=${(b, step) => { setEditing(null); setDraft({ text: step, tags: step ? ["Idea"] : [], blog: { id: b.id, title: b.title } }); setView("journalWrite"); window.scrollTo(0, 0); }} />`;
  if (view === "blogs") return html`<${Blogs} go=${go} open=${id => { setBlogId(id); setView("blog"); window.scrollTo(0, 0); }} />`;
  if (view === "editWins") return html`<${EditWins} go=${go} profile=${profile} back=${() => go("today")} save=${w => { setProfile({ ...profile, wins: w }); go("today"); }} />`;
  if (view === "community") return html`<${Community} go=${go} profile=${profile} />`;
  if (view === "circle") return html`<${Circle} go=${go} profile=${profile} log=${log} />`;
  if (view === "progress") return html`<${Progress} go=${go} log=${log} journal=${journal} dark=${dark} setTheme=${toggleTheme} />`;
  return html`<${Today} profile=${profile} wins=${wins} done=${done} toggle=${toggle} go=${go} startFocus=${i => { setFocus(i); window.scrollTo(0, 0); }} log=${log} rest=${rest} comeback=${comeback} />`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>

</body></html>
