<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QalamStorys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Kaushan+Script&family=Outfit:wght@300&display=swap">
<style>
/* QalamStorys v22 — "Onward" UI: tiny daily steps, one clear action per screen. Content removed on purpose (to be published later). */
:root {
  --bg: #F7F7F8; --surface: #FFFFFF; --border: #E6E6EA; --hair: #F0F0F2; --chip: #F0F0F2;
  --ink: #1C1C1E; --ink-2: #6E6E73; --ink-3: #8E8E93; --off: #A1A1A6; --track: #EFEFF2;
  --accent: #FF7A1A; --on-accent: #1C1C1E; --cta-ink: #111111; --on-cta-ink: #FFFFFF;
  --navy: #1E1B4B; --navy-ink: #C7C4EE; --violet: #7C3AED; --rest: #DCE6FB;
  --logo: #2B8A7E; --logo-ar: #B4D8D1;
  --shadow: 0 8px 24px rgba(20,20,30,.05);
  --sans: "Inter", system-ui, -apple-system, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E0E10; --surface: #1A1A1D; --border: #2A2A2E; --hair: #232327; --chip: #26262A;
  --ink: #F2F2F4; --ink-2: #A1A1A6; --ink-3: #8E8E93; --off: #6E6E73; --track: #2A2A2E;
  --accent: #FF8A3D; --cta-ink: #F2F2F4; --on-cta-ink: #111111; --rest: #1E2A44;
  --logo: #5CC2B3; --logo-ar: #1D3A4C; --shadow: 0 8px 24px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E0E10; --surface: #1A1A1D; --border: #2A2A2E; --hair: #232327; --chip: #26262A;
  --ink: #F2F2F4; --ink-2: #A1A1A6; --ink-3: #8E8E93; --off: #6E6E73; --track: #2A2A2E;
  --accent: #FF8A3D; --cta-ink: #F2F2F4; --on-cta-ink: #111111; --rest: #1E2A44;
  --logo: #5CC2B3; --logo-ar: #1D3A4C; --shadow: 0 8px 24px rgba(0,0,0,.4); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); }
body { color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid #0A4FD6; outline-offset: 2px; }
.screen { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  padding: max(28px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); }
.grow { flex: 1 1 auto; min-height: 16px; }
.eyebrow { margin: 0; font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
h1 { margin: 6px 0 0; font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -0.04em; text-wrap: balance; }
h1.xl { font-size: clamp(38px, 11.5vw, 46px); line-height: .98; letter-spacing: -0.05em; }
h2 { margin: 0; font-size: 17px; font-weight: 700; }
.lede { margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: var(--ink-2); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
/* buttons */
.cta { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 56px; border-radius: 28px; border: 0; background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 700; text-decoration: none; }
.cta.ink { background: var(--cta-ink); color: var(--on-cta-ink); }
.cta.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--border); height: 52px; font-size: 16px; font-weight: 600; }
.cta:disabled { background: var(--chip); color: var(--ink-2); cursor: default; }
.round { width: 44px; height: 44px; border-radius: 22px; border: 0; display: grid; place-items: center; flex-shrink: 0; }
.avatar { background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 800; }
.iconbtn { background: var(--surface); border: 1px solid var(--border); color: var(--ink); }
.link { border: 0; background: none; color: var(--ink-2); font-size: 15px; font-weight: 500; padding: 12px 0 12px 12px; }
/* footer + tabbar */
.foot { position: sticky; bottom: 0; margin: 0 calc(-1 * max(20px, env(safe-area-inset-left, 0px))) 0; padding-top: 12px; background: linear-gradient(to bottom, transparent, var(--bg) 14px); z-index: 5; }
.foot .cta-wrap { padding: 0 20px 12px; }
.foot.plain { padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); }
.foot.plain .cta-wrap { display: flex; flex-direction: column; gap: 10px; }
.tabbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid var(--border); padding: 6px 8px max(14px, env(safe-area-inset-bottom, 0px)); }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 500; color: var(--ink-2); }
.tabbar button[aria-current="page"] { color: var(--ink); font-weight: 700; }
.tabbar svg { width: 22px; height: 22px; }
/* onboarding */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 96px; }
.steps span { height: 4px; border-radius: 2px; background: #DCDCE0; }
:root[data-theme="dark"] .steps span { background: var(--border); }
.steps span.on { background: var(--ink); }
.list-card { margin-top: 20px; overflow: hidden; }
.pick { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; border: 0; border-bottom: 1px solid var(--hair); background: var(--surface); text-align: left; }
.pick:last-child { border-bottom: 0; }
.pick b { display: block; font-size: 16px; font-weight: 600; }
.pick small { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.box { width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; display: grid; place-items: center; border: 2px solid var(--off); background: var(--surface); color: var(--bg); }
.on > .box, .box.on { background: var(--ink); border-color: var(--ink); }
.field { width: 100%; margin-top: 20px; padding: 16px 18px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); font-size: 18px; font-weight: 600; }
/* logo: brush "Qalam" + clean "Storys" (M3) */
.logo { display: inline-flex; align-items: baseline; white-space: nowrap; line-height: 1.15; margin: 8px 0 0; color: var(--ink); }
.logo .lq { font-family: "Kaushan Script", cursive; font-size: 40px; }
.logo .ls { font-family: "Outfit", var(--sans); font-weight: 300; font-size: 35px; letter-spacing: -0.03em; color: var(--logo); margin-left: .06em; }
.brandbar { display: flex; justify-content: center; margin: 0 0 16px; }
.brandbar .logo { margin: 0; }
.brandbar .lq { font-size: 30px; } .brandbar .ls { font-size: 26px; }
/* today */
.ring-card { margin-top: 18px; padding: 18px; border-radius: 28px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 18px; }
.ring { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
.ring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .c b { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
.ring .c span { font-size: 11px; color: var(--ink-2); }
.empty-line { margin: 6px 0 0; font-size: 15px; line-height: 1.4; color: var(--ink-2); }
.tasks { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.task { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 12px 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); text-align: left; width: 100%; }
.task .t { display: flex; flex-direction: column; flex-grow: 1; }
.task .t b { font-size: 16px; font-weight: 600; }
.task .t small { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.task.on .t b { color: var(--ink-2); text-decoration: line-through; }
.strip { margin-top: 12px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); text-decoration: none; width: 100%; text-align: left; }
.strip .txt { flex-grow: 1; font-size: 14px; line-height: 1.35; }
.ico { width: 44px; height: 44px; border-radius: 14px; background: var(--chip); display: grid; place-items: center; flex-shrink: 0; }
/* focus */
.focus { background: var(--navy); color: #F2F2F4; }
.focus-wrap { background: var(--navy); min-height: 100vh; min-height: 100dvh; }
.focus .eyebrow { color: var(--navy-ink); }
.focus h1 { color: #FFFFFF; }
.glass { background: rgba(255,255,255,.08); color: #F2F2F4; }
.timer { margin: 0; font-size: clamp(76px, 25vw, 96px); line-height: 1; font-weight: 700; letter-spacing: -0.05em; color: #FFFFFF; font-variant-numeric: tabular-nums; text-align: center; }
.tbar { margin-top: 22px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; }
.tbar i { display: block; height: 6px; background: #FFFFFF; transition: width 1s linear; }
.focus .note { margin-top: 36px; padding: 16px; border-radius: 20px; background: rgba(255,255,255,.06); display: flex; gap: 12px; align-items: center; font-size: 14px; color: #E0DEF7; }
.pair { display: flex; gap: 10px; }
.pair .pause { flex: 1 1 0; height: 56px; border-radius: 28px; border: 1px solid rgba(255,255,255,.28); background: transparent; color: #F2F2F4; font-size: 16px; font-weight: 600; }
.pair .cta { flex: 2 1 0; width: auto; }
.focus .foot { background: linear-gradient(to bottom, transparent, var(--navy) 14px); }
/* done */
.mark { width: 88px; height: 88px; border-radius: 44px; background: var(--violet); display: grid; place-items: center; box-shadow: 0 14px 32px rgba(124,58,237,.28); animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
.navlist { margin-top: 32px; display: flex; flex-direction: column; gap: 10px; }
.navrow { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; background: var(--surface); border: 1px solid var(--border); text-align: left; width: 100%; }
.navrow .t { flex-grow: 1; display: flex; flex-direction: column; }
.navrow .t b { font-size: 16px; font-weight: 600; }
.navrow .t small { font-size: 13px; color: var(--ink-2); }
/* comeback + progress */
.days { margin-top: 14px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.days span { height: 36px; border-radius: 10px; background: var(--ink); }
.days span.rest { background: var(--rest); } .days span.miss { background: transparent; border: 1.5px dashed var(--off); }
.days span.today { background: transparent; border: 2px dashed var(--ink); } .days span.today.on { background: var(--ink); border-style: solid; }
.dlabels { margin-top: 6px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 11px; color: var(--ink-2); text-align: center; }
.grid2 { margin-top: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.span2 { grid-column: span 2; }
.stat { padding: 16px; }
.stat b { display: block; font-size: 34px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.stat b small { font-size: 16px; color: var(--ink-2); font-weight: 600; letter-spacing: 0; }
.stat p { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
.stat.navy { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
.stat.navy p, .stat.navy b small { color: var(--navy-ink); }
.bars { margin-top: 12px; height: 80px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: end; }
.bars span { border-radius: 8px; background: var(--ink); }
.bars span.zero { height: 6px !important; border-radius: 3px; background: #DCDCE0; }
:root[data-theme="dark"] .bars span.zero { background: var(--border); }
/* journal */
.mini3 { margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mini3 .card { padding: 12px 14px; border-radius: 18px; }
.mini3 b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
.mini3 small { font-size: 12px; color: var(--ink-2); }
.entry { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); text-align: left; width: 100%; }
.entry .d { width: 40px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
.entry .d small { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--ink-2); }
.entry .d b { font-size: 22px; font-weight: 800; }
.entry .t { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.entry .t span:first-child { font-size: 15px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.moods { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.chipb { height: 40px; padding: 0 14px; border-radius: 20px; font-size: 14px; font-weight: 600; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
.moods .chipb { height: 48px; border-radius: 14px; padding: 0; }
.chipb[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
textarea.area { width: 100%; margin-top: 10px; min-height: 150px; padding: 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); font-size: 16px; line-height: 1.5; resize: vertical; }
.label-q { display: block; margin: 22px 0 0; font-size: 20px; line-height: 1.25; font-weight: 800; letter-spacing: -0.02em; }
.switch { width: 52px; height: 32px; flex-shrink: 0; border-radius: 16px; border: 0; padding: 3px; display: flex; background: #C7C7CC; justify-content: flex-start; }
.switch[aria-checked="true"] { background: var(--ink); justify-content: flex-end; }
.switch span { width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
/* community */
.circle-hero { margin-top: 16px; padding: 18px; border-radius: 24px; background: var(--ink); color: var(--bg); text-align: left; width: 100%; border: 0; display: flex; flex-direction: column; gap: 6px; }
.circle-hero .eyebrow { color: var(--off); font-size: 11px; }
.circle-hero b { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.empty { margin-top: 10px; padding: 22px 18px; text-align: center; color: var(--ink-2); border-style: dashed; }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
.members { margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.member { padding: 12px 6px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.member i { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; background: var(--ink); color: var(--bg); }
.member i.add { background: transparent; border: 1.5px dashed var(--off); color: var(--ink-2); }
.acct { margin-top: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-radius: 20px; }
.acct > div { display: flex; flex-direction: column; gap: 2px; }
.acct i { flex: none; width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 800; background: var(--ink); color: var(--bg); }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.chat { margin-top: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; max-height: 360px; overflow-y: auto; border-radius: 20px; }
.msg { max-width: 86%; align-self: flex-start; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 8px 12px; }
.msg.mine { align-self: flex-end; }
.msg .meta { display: flex; gap: 8px; font-size: 12px; color: var(--ink-3); } .msg .meta b { color: var(--ink-2); font-weight: 600; }
.msg p { margin: 2px 0 0; font-size: 15px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.vnote { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; } .vnote audio { width: 230px; max-width: 100%; height: 36px; }
.composer { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
.chatin { flex: 1; min-width: 0; height: 48px; padding: 0 16px; border-radius: 24px; border: 1px solid var(--border); background: var(--surface); font-size: 16px; }
.voice { margin-top: 10px; padding: 14px 16px; border-radius: 20px; }
.vrow { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.pillbtn { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; font-weight: 600; cursor: pointer; }
.pillbtn.ink { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pillbtn:disabled { opacity: .5; }
.recdot { width: 10px; height: 10px; border-radius: 5px; background: #E5372B; animation: recp 1s infinite alternate; } @keyframes recp { to { opacity: .3; } }
.mono { font-family: "JetBrains Mono", monospace; }
.member span { font-size: 13px; font-weight: 600; } .member small { font-size: 12px; color: var(--ink-2); }
.gbar { margin-top: 10px; height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
.gbar i { display: block; height: 10px; border-radius: 5px; background: var(--ink); }
/* blogs */
.deck-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 22px; border: 0; display: grid; place-items: center; background: rgba(255,255,255,.92); color: #1C1C1E; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.deck-arrow.prev { left: 10px; } .deck-arrow.next { right: 10px; }
.deck-arrow.next svg { transform: rotate(180deg); }
.deck-dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
.deck-dots span { width: 7px; height: 7px; border-radius: 4px; background: var(--off); opacity: .5; transition: width .2s; }
.deck-dots span.on { width: 18px; background: var(--ink); opacity: 1; }
.selectwrap { position: relative; display: inline-flex; }
.wined { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.winopt { padding: 14px 16px; border-radius: 20px; }
.amt { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.amt input { width: 84px; height: 44px; text-align: center; border-radius: 22px; border: 1px solid var(--border); background: var(--surface); font-size: 16px; font-weight: 700; }
.amt .iconbtn { font-size: 20px; font-weight: 600; }
.selectwrap select { appearance: none; -webkit-appearance: none; height: 44px; padding: 0 40px 0 16px; border-radius: 22px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 600; max-width: 62vw; }
.selectwrap::after { content: ""; position: absolute; right: 16px; top: 50%; width: 8px; height: 8px; border-right: 2px solid var(--ink-2); border-bottom: 2px solid var(--ink-2); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.topics { display: flex; gap: 8px; overflow-x: auto; margin: 16px calc(-1 * max(20px, env(safe-area-inset-left, 0px))) 0; padding: 0 20px 4px; scrollbar-width: none; }
.topics::-webkit-scrollbar { display: none; }
.topics .chipb { flex: none; }
.blog { display: flex; gap: 14px; align-items: center; padding: 10px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); text-align: left; width: 100%; }
.blog img { width: 72px; height: 90px; object-fit: cover; border-radius: 12px; flex-shrink: 0; background: var(--chip); }
.blog .t { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex-grow: 1; }
.blog .t b { font-size: 16px; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }
.blog .t small { font-size: 13px; color: var(--ink-2); }
.blog .t .eyebrow { font-size: 10px; }
.deck { margin-top: 16px; border-radius: 20px; overflow: hidden; background: #000; position: relative; }
.deck-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.deck-track::-webkit-scrollbar { display: none; }
.deck-track img { flex: none; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; scroll-snap-align: center; display: block; }

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
const { useState, useEffect, useRef } = React;
const html = htm.bind(React.createElement);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const P = "qs2-"; // fresh storage keys for the new UI
const dayKey = (d = new Date()) => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
const keyOf = off => dayKey(new Date(Date.now() - off * 864e5));
const dayNum = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / 864e5);

/* Content slots. Empty for now: content will be published later. */
const CONTENT = { thought: null, prompts: [], circlePosts: [] };

/* The six goals and their tiny wins are part of the app's flow, not published content. */
const GOALS = [
  { id: "energy", label: "Energy", hint: "Wake up ready for the day", win: ["Drink a glass of water", "10 sec", 1] },
  { id: "focus", label: "Focus", hint: "Start the hard thing first", win: ["2 minutes of focused work", "2 min", 2] },
  { id: "calm", label: "Calm", hint: "Less stress, more breath", win: ["Five slow breaths", "1 min", 1] },
  { id: "confidence", label: "Confidence", hint: "Notice what you got right", win: ["Write one line you're proud of", "1 min", 1] },
  { id: "movement", label: "Movement", hint: "Move a little, every day", win: ["Walk for two minutes", "2 min", 2] },
  { id: "gratitude", label: "Gratitude", hint: "One good thing, written down", win: ["Write one good thing from today", "1 min", 1] }
];
const MOODS = ["Low", "Meh", "Okay", "Good", "Great"];
const TAGS = ["Win", "Gratitude", "Focus", "Worry", "Idea"];
const PROMPT = "What's one thing you did today that past-you would be proud of?";

const I = {
  check: (s = 14, c = "currentColor") => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke=${c} stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>`,
  play: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>`,
  close: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>`,
  back: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>`,
  chev: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style=${{ color: "var(--ink-2)", flexShrink: 0 }}><path d="M9 18l6-6-6-6"/></svg>`,
  sound: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>`,
  mute: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>`,
  clock: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C7C4EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7v5l3 2"/></svg>`,
  sun: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2"/></svg>`,
  book: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>`,
  people: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>`,
  chart: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>`,
  cards: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="13" height="16" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h10"/></svg>`,
  moon: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`
};
const icoWrap = icon => html`<span class="ico" aria-hidden="true"><span style=${{ width: 20, height: 20, display: "grid" }}>${icon}</span></span>`;

function useStored(key, init) {
  const [v, setV] = useState(() => store.get(P + key, init));
  // write storage right away, so a value set just before a screen unmounts is still kept
  const ref = useRef(v);
  const set = nv => { const x = typeof nv === "function" ? nv(store.get(P + key, ref.current)) : nv; ref.current = x; store.set(P + key, x); setV(x); };
  return [v, set];
}

/* ---------- 01 Onboarding ---------- */
function Onboarding({ profile, done }) {
  const [step, setStep] = useState(profile ? 2 : 1);
  const [name, setName] = useState((profile && profile.name) || "");
  const [picked, setPicked] = useState((profile && profile.goals) || []);
  const [choice, setChoice] = useState((profile && profile.wins) || {});
  const flip = id => setPicked(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]);
  const finish = () => done({ name: name.trim(), goals: picked.length ? picked : ["focus", "energy", "confidence"], wins: choice });
  const n = picked.length;
  const steps = html`<div class="steps" aria-label=${"Step " + step + " of 3"}>${[1, 2, 3].map(i => html`<span key=${i} class=${i <= step ? "on" : ""}></span>`)}</div>`;
  return html`<main class="screen">
    <div class="row-between">${steps}<button class="link" onClick=${finish}>Skip</button></div>
    ${step === 1 && html`
      <p class="eyebrow" style=${{ marginTop: 24 }}>Step 1 of 3 — Hello</p>
      <div class="logo" role="img" aria-label="QalamStorys"><span class="lq" aria-hidden="true">Qalam</span><span class="ls" aria-hidden="true">Storys</span></div>
      <h1>What should we call you?</h1>
      <p class="lede">Just a first name. It stays on this phone.</p>
      <label class="sr" for="nm" style=${{ position: "absolute", left: -9999 }}>Your first name</label>
      <input id="nm" class="field" value=${name} onInput=${e => setName(e.target.value)} placeholder="Your first name" autocomplete="given-name" maxlength="24" />`}
    ${step === 2 && html`
      <p class="eyebrow" style=${{ marginTop: 24 }}>Step 2 of 3 — Your why</p>

const ONE = { glasses: "glass", litres: "litre", pieces: "piece", hours: "hour", pages: "page", "hard tasks": "hard task", lines: "line", "slow breaths": "slow breath", worries: "worry", things: "thing", times: "time", "kind lines to yourself": "kind line to yourself", steps: "step", "push-ups": "push-up", squats: "squat", "sit-ups": "sit-up", "good things": "good thing", people: "person", "kind messages": "kind message", "small joys": "small joy" };
const unitFor = (u, n) => n === 1 ? (ONE[u] || u) : u;
const amountText = (n, u) => (u === "steps" ? n.toLocaleString() : n) + " " + unitFor(u, n);
function winFrom(goal, c) {
  const opts = WIN_OPTS[goal.id] || [];

/* ---------- 03 Focus ---------- */
function chime() { try { const C = window.AudioContext || window.webkitAudioContext; const c = new C(); [523.25, 783.99].forEach((f, i) => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; o.connect(g); g.connect(c.destination); const t = c.currentTime + i * .18; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + 1.2); o.start(t); o.stop(t + 1.3); }); } catch (e) {} }
function Focus({ win, idx, total, close, did }) {
  const secs = Math.max(1, win.mins) * 60;
  const [el, setEl] = useState(0);
  const [run, setRun] = useState(true);
  const [sound, setSound] = useStored("sound", true);
  useEffect(() => { if (!run) return; const t = setInterval(() => setEl(e => { const n = e + 1; if (n === secs && store.get(P + "sound", true)) chime(); return n; }), 1000); return () => clearInterval(t); }, [run]);
  const left = Math.max(0, secs - el);
  const show = left > 0 ? left : el - secs;
  const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  return html`<div class="focus-wrap"><main class="screen focus">
    <div class="row-between">
      <button class="round glass" onClick=${close} aria-label="End session">${I.close}</button>
      <button class="glass" onClick=${() => setSound(!sound)} aria-pressed=${sound} style=${{ height: 44, padding: "0 14px", borderRadius: 22, border: 0, fontSize: 14, fontWeight: 600, display: "flex", alignItems: "center", gap: 8 }}>${sound ? I.sound : I.mute}${sound ? "Chime on" : "Chime off"}</button>
    </div>
    <p class="eyebrow" style=${{ marginTop: 36 }}>Win ${idx + 1} of ${total} · ${win.goal}</p>
    <h1 style=${{ marginTop: 8 }}>${win.title}.<br />That's the whole win.</h1>
    <div style=${{ marginTop: 40 }}>
      <p class="timer" role="timer" aria-label=${left > 0 ? fmt(left) + " left" : "Time's up, " + fmt(show) + " extra"}>${left > 0 ? fmt(show) : "+" + fmt(show)}</p>
      <div class="tbar" aria-hidden="true"><i style=${{ width: Math.min(100, el / secs * 100) + "%" }}></i></div>
      <div class="row-between" style=${{ marginTop: 8, fontSize: 13, color: "var(--navy-ink)" }}><span>${fmt(Math.min(el, secs))} in</span><span>${fmt(secs)}</span></div>
    </div>

      <button class="cta" onClick=${() => did(Math.max(1, Math.round(el / 60)), el)}>I did it</button>
    </div></div></div>
  </main></div>`;
}

  const gapKeys = Array.from({ length: Math.min(gap, 2) }, (_, i) => keyOf(i + 1));

  return html`<div class="row-between" style=${{ marginTop: 10 }}><span class="small muted">Invite code <b class="mono" style=${{ color: "var(--ink)" }}>${code}</b>${msg ? " · " + msg : ""}</span><button class="pillbtn" onClick=${share}>Invite friends</button></div>`;
}
function CircleChat({ cloud, isMember }) {
  const { db, user, assets, me } = cloud;
  const [msgs, setMsgs] = useState(null);
  const [names, setNames] = useState({});
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const end = useRef(null);
  useEffect(() => {
    const t = setTimeout(() => setMsgs(m => m || []), 10000);
    const un = db.collection("chat").orderBy("at", "desc").limit(60).onSnapshot(s => { clearTimeout(t); setMsgs(s.docs.map(d => ({ id: d.id, ...d.data() })).reverse()); }, () => { clearTimeout(t); setMsgs(m => m || []); });
    return () => { clearTimeout(t); un(); };
  }, []);
  const ids = msgs ? [...new Set(msgs.map(m => m.by).filter(Boolean))] : [];
  const idKey = ids.join(",");
  useEffect(() => { if (ids.length) user.profiles(ids).then(p => setNames(p || {})).catch(() => {}); }, [idKey]);
  useEffect(() => { end.current && end.current.scrollIntoView({ block: "nearest" }); }, [msgs && msgs.length]);
  const sendText = async () => {
    const t = text.trim().slice(0, 1000); if (!t || busy) return;
    setBusy(true); setErr("");
    try { await db.collection("chat").add({ kind: "text", text: t, by: me.id, at: Date.now() }); setText(""); }
    catch (e) { setErr(cloud.hosted ? "Couldn't send. Check your connection and try again." : "Couldn't send. You may need edit or contributor access to this app."); }
    setBusy(false);
  };
  const sendVoice = async clip => {
    if (!assets) { setErr("Voice uploads aren't available for your access level."); return false; }
    setBusy(true); setErr("");
    try {
      const up = await assets.upload(clip.blob, { type: clip.type });
      await db.collection("chat").add({ kind: "voice", asset: up.id, secs: clip.secs || 0, by: me.id, at: Date.now() });
      setBusy(false); return true;
    } catch (e) { setErr("Couldn't post the voice note (" + ((e && e.code) || "error") + ")."); setBusy(false); return false; }
  };
  const who = id => id === me.id ? "You" : ((names[id] || {}).name || "Someone");
  return html`
    <div class="row-between" style=${{ marginTop: 26 }}><h2>Circle chat</h2><span class="small muted">${msgs ? msgs.length + " messages" : "Loading…"}</span></div>
    <section class="card chat" aria-live="polite">
      ${msgs && !msgs.length && html`<p class="small muted" style=${{ margin: 0 }}>No messages yet. Say hello or post a voice note.</p>`}
      ${(msgs || []).map(m => html`<div key=${m.id} class=${"msg" + (m.by === me.id ? " mine" : "")}>
        <div class="meta"><b>${who(m.by)}</b><span>${m.at ? timeAgo(m.at) : ""}</span></div>
        ${m.kind === "voice" ? html`<div class="vnote"><span class="small muted">Voice${m.secs ? " · " + fmtSecs(m.secs) : ""}</span><${VoiceAudio} cloud=${cloud} asset=${m.asset} /></div>` : html`<p>${String(m.text || "")}</p>`}
      </div>`)}
      <div ref=${end}></div>
    </section>
    ${isMember ? html`
      <div class="composer">
        <input class="chatin" value=${text} maxlength="1000" placeholder="Message your circle" aria-label="Message your circle" onInput=${e => setText(e.target.value)} onKeyDown=${e => { if (e.key === "Enter") sendText(); }} />
        <button class="round iconbtn" aria-label="Send message" disabled=${busy || !text.trim()} onClick=${sendText}>${SEND}</button>
      </div>
      <${VoiceRecorder} onPost=${sendVoice} busy=${busy} />` : html`<p class="small muted" style=${{ marginTop: 10 }}>Join the circle to chat and post voice notes.</p>`}
    ${err && html`<p class="small" role="alert" style=${{ margin: "8px 0 0", color: "var(--ink-2)" }}>${err}</p>`}`;
}

function Circle({ go, profile, log }) {
  const [checked, setChecked] = useStored("circle-" + dayKey(), false);
  const [len, setLen] = useStored("circle-len", 7);
  const midnight = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const [start, setStart] = useStored("circle-start", midnight());
  const pickLen = n => { setLen(n); setStart(midnight()); };
  const elapsed = Math.max(0, Math.round((midnight() - start) / 864e5));
  const day = Math.min(len, elapsed + 1);
  const mine = Array.from({ length: day }, (_, i) => elapsed - i).filter(o => o >= 0 && (((log[keyOf(o)] || {}).w || 0) > 0 || (o === 0 && checked))).length;
  const cloud = useCloud();
  const [members, setMembers] = useState([]);
  const [names, setNames] = useState({});
  const [joinErr, setJoinErr] = useState("");
  useEffect(() => {
    setMembers([]);
    if (!cloud) return;
    return cloud.db.collection("members").onSnapshot(s => setMembers(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0))), () => {});
  }, [cloud]);
  const idKey = members.map(m => m.id).join(",");
  useEffect(() => { if (cloud && members.length) cloud.user.profiles(members.map(m => m.id)).then(p => setNames(p || {})).catch(() => {}); }, [cloud, idKey]);
  const today = dayKey();
  const isMember = !!(cloud && members.some(m => m.id === cloud.me.id));
  const noCircle = !!(cloud && cloud.hosted && !cloud.circle);
  const join = async () => {
    setJoinErr("");
    if (members.length >= MAX_MEMBERS) { setJoinErr("This circle is full (25 of 25)."); return; }
    try { await cloud.db.doc("members/" + cloud.me.id).set({ joinedAt: Date.now(), checkin: checked ? today : "" }); }
    catch (e) { setJoinErr(String((e && e.message) || "").includes("circle_full") ? "This circle is full (25 of 25)." : cloud.hosted ? "Couldn't join. Try again." : "Couldn't join. Ask the owner for contributor access."); }
  };
  const checkIn = async () => {
    setChecked(true);
    if (isMember) { try { await cloud.db.doc("members/" + cloud.me.id).update({ checkin: today }); } catch (e) {} }
  };
  const count = cloud && !noCircle ? members.length : 1;
  const shown = cloud ? members : [];
  const open = Math.max(0, Math.min(2, MAX_MEMBERS - count - (cloud && !isMember ? 0 : 0)));
  return html`<main class="screen">
    <${Brand} />
    <div class="row-between"><button class="round iconbtn" onClick=${() => go("community")} aria-label="Back to community">${I.back}</button><span></span></div>
    <p class="eyebrow" style=${{ marginTop: 20 }}>${len}-day challenge · day ${day} of ${len}</p>
    <h1>Your circle</h1>
    <p class="lede">Win together, not against each other. Up to 25 friends, with text chat and 3-minute voice notes.</p>
    <section class="card acct">
      ${cloud === undefined ? html`<span class="small muted">Checking sign-in…</span>`
        : cloud ? html`<i aria-hidden="true">${initials(cloud.me.name)}</i><div style=${{ minWidth: 0, flexGrow: 1 }}><b>Signed in as ${cloud.me.name || "you"}</b><span class="small muted ell">${cloud.me.email || "Email hidden"}</span></div>${cloud.signOut && html`<button class="link" onClick=${cloud.signOut}>Sign out</button>`}`
        : HOSTED() ? html`<${SignIn} />`
        : html`<div><b>Sign in to join the circle</b><span class="small muted">Open this app in Claude with your email account to chat and post voice notes. You can still check in on this device.</span></div>`}
    </section>
    <p style=${{ margin: "18px 0 8px", fontSize: 15, fontWeight: 600 }}>Challenge length</p>
    <div class="moods" role="radiogroup" aria-label="Challenge length" style=${{ gridTemplateColumns: "repeat(3, minmax(0, 1fr))" }}>${[7, 14, 21].map(n => html`<button key=${n} class="chipb" role="radio" aria-checked=${len === n} aria-pressed=${len === n} onClick=${() => pickLen(n)}>${n} days</button>`)}</div>
    <p class="small muted" style=${{ margin: "6px 0 0" }}>Changing the length restarts the challenge from today.</p>
    <section class="card" style=${{ marginTop: 18, padding: 16 }}>
      <div class="row-between" style=${{ alignItems: "baseline" }}><b style=${{ fontSize: 15 }}>Circle goal</b><span class="small muted">${mine} of ${len} check-ins</span></div>
      <div class="gbar" role="img" aria-label=${mine + " of " + len + " check-ins"}><i style=${{ width: (mine / len * 100) + "%" }}></i></div>
    </section>
    <div class="row-between" style=${{ marginTop: 22 }}><h2>Today</h2><span class="small muted">${count} of ${MAX_MEMBERS} members</span></div>
    <div class="members">
      ${(!cloud || noCircle) && html`<div class="card member"><i aria-hidden="true">${(profile.name || "You").slice(0, 3).toUpperCase()}</i><span>You</span><small>${checked ? "Checked in" : "Not yet"}</small></div>`}
      ${shown.map(m => { const me = m.id === cloud.me.id; const nm = me ? "You" : ((names[m.id] || {}).name || "Someone"); const ok = me ? checked : m.checkin === today; return html`<div key=${m.id} class="card member"><i aria-hidden="true">${initials(me ? (cloud.me.name || "You") : nm)}</i><span class="ell">${nm}</span><small>${ok ? "Checked in" : "Not yet"}</small></div>`; })}
      ${Array.from({ length: Math.max(0, open) }, (_, k) => html`<div key=${"o" + k} class="card member" style=${{ borderStyle: "dashed" }}><i class="add" aria-hidden="true">+</i><span class="muted">Open seat</span><small>Share to invite</small></div>`)}
    </div>
    ${noCircle && html`<${CirclePicker} cloud=${cloud} />`}
    ${cloud && !noCircle && !isMember && html`<button class="cta ghost" style=${{ marginTop: 12 }} onClick=${join}>Join this circle</button>`}
    ${joinErr && html`<p class="small" role="alert" style=${{ margin: "8px 0 0", color: "var(--ink-2)" }}>${joinErr}</p>`}
    ${cloud && !cloud.hosted && html`<p class="small muted" style=${{ margin: "8px 0 0" }}>Invite friends with the Share button at the top of this app.</p>`}
    ${cloud && cloud.hosted && cloud.circle && html`<${InviteRow} code=${cloud.circle} />`}
    ${cloud && cloud.hosted && cloud.circle && html`<button class="link" style=${{ padding: "8px 0" }} onClick=${cloud.leaveCircle}>Switch circle</button>`}
    ${cloud && !noCircle && html`<${CircleChat} key=${cloud.circle || "c"} cloud=${cloud} isMember=${isMember} />`}
    <div class="grow"></div>
    <div class="foot"><div class="cta-wrap"><button class="cta" disabled=${checked} onClick=${checkIn}>${checked ? "Checked in · nice work" : "Check in for today"}</button></div><${Tabs} tab="community" go=${go} /></div>
  </main>`;
}

}, "article": null, "cards": ["img/ml-outlive-you/01.jpg", "img/ml-outlive-you/02.jpg", "img/ml-outlive-you/03.jpg", "img/ml-outlive-you/04.jpg", "img/ml-outlive-you/05.jpg"], "added": 28987}, {"id": "ml-gwc-test", "topic": "Leadership", "title": "The GWC Test", "sub": "Right person? Right seat? Three questions to find out.", "summary": "Many leaders avoid asking whether they have the right people in the right seats. The right person fits your core values; the right seat fits their skills. Before a promotion, run the GWC test: do they Get it, Want it, and have the Capacity for it? Don't tolerate a values mismatch, even in a top performer. Make it about the seat, not the person, and coach the conversation.", "close": "Make it about the seat, not the person. Done with care, they'll thank you.", "safety": "", "lessons": [{"t": "Right Person = Values", "b": "Hire for culture and character. Skills can be trained. Ask the same values questions in every interview.", "tags": [], "k": "Values first."}, {"t": "Right Seat = Skills", "b": "A great person in the wrong role isn't a bad hire. Try a different seat before you let them go.", "tags": [], "k": "Wrong seat, not wrong person."}, {"t": "G: Do They Get It?", "b": "Do they really understand the role and what it takes day to day?", "tags": [], "k": "Get it."}, {"t": "W: Do They Want It?", "b": "Have you even asked? Not everyone wants to be the manager.", "tags": [], "k": "Want it."}, {"t": "C: Do They Have Capacity?", "b": "Mental, physical, emotional and life-stage room to take it on.", "tags": [], "k": "Capacity for it."}, {"t": "What You Tolerate Expands", "b": "A top performer who breaks your values erodes your culture and your credibility.", "tags": [], "k": "If you're justifying it, change it."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>This week:<\/b> run GWC on one person you plan to promote", "<b>Ask:<\/b> 'Do you actually want this role?'", "<b>In hard talks:<\/b> make it about the seat, not the person", "<b>Each change:<\/b> re-check: would I hire them for this role today?"]}, "article": null, "cards": ["img/ml-gwc-test/01.jpg", "img/ml-gwc-test/02.jpg", "img/ml-gwc-test/03.jpg", "img/ml-gwc-test/04.jpg", "img/ml-gwc-test/05.jpg"], "added": 27987}, {"id": "ml-self-awareness-eq", "topic": "Leadership", "title": "Know The Wake You Leave", "sub": "Self-awareness and EQ, your quiet leadership edge.", "summary": "A gifted leader starts having outbursts under pressure. The Maxwell hosts link it to a fixed mindset and low self-awareness. Grow by treating mistakes as lessons and feedback as a gift, praising effort, and adding 'yet'. Build EQ by noticing the wake you leave, pausing to name the emotion, tracking your triggers, and having an honest inner circle.", "close": "The goal isn't to remove emotion. It's to see it in time to choose.", "safety": "", "lessons": [{"t": "Check Your Mindset", "b": "A fixed mindset avoids challenges and hears feedback as an attack. A growth mindset sees a chance to get better.", "tags": [], "k": "Feedback: threat or gift?"}, {"t": "Add The Word 'Yet'", "b": "'I could never do that' becomes 'I can't do that yet.' Fail forward.", "tags": [], "k": "Not yet is not never."}, {"t": "Praise The Effort", "b": "Praise the A, and people avoid hard classes. Praise the work, and they keep stretching.", "tags": [], "k": "Reward the process."}, {"t": "See Your Wake", "b": "Most people think they're self-aware. Few are. Notice how rooms feel after you leave.", "tags": [], "k": "You're not aware of your unaware."}, {"t": "Name It To Tame It", "b": "When you're triggered, pause. Is it anger, shame, embarrassment? Naming it slows it.", "tags": [], "k": "Mind the gap."}, {"t": "Keep An Honest Circle", "b": "Ask someone you trust to tell you if eyes are rolling. Review your triggers each night.", "tags": [], "k": "Others see what you can't."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> add 'yet' to one 'I can't'", "<b>Next trigger:<\/b> pause and name the emotion", "<b>Each night:<\/b> note what set you off and why", "<b>This week:<\/b> ask one person for honest feedback"]}, "article": null, "cards": ["img/ml-self-awareness-eq/01.jpg", "img/ml-self-awareness-eq/02.jpg", "img/ml-self-awareness-eq/03.jpg", "img/ml-self-awareness-eq/04.jpg", "img/ml-self-awareness-eq/05.jpg"], "added": 26987}, {"id": "ml-strong-bench", "topic": "Leadership", "title": "How Strong Is Your Bench?", "sub": "Starters win games. Programs win championships.", "summary": "After a college football coach criticised his reserves, the Maxwell hosts ask leaders how game-ready their own bench is. Headcount isn't depth. Give the next person real game reps, follow exposure with coaching, reward work over status, set clear standards for everyone, give each person a development plan, and name a next person up for every key role.", "close": "Starters win games. Programs win championships.", "safety": "", "lessons": [{"t": "Headcount Isn't Depth", "b": "A full roster doesn't mean anyone is ready to step in when it counts.", "tags": [], "k": "Count readiness, not people."}, {"t": "Give Real Game Reps", "b": "'We could never put Johnny in that room.' Why not? Get them ready and put them in.", "tags": [], "k": "Ask why they're not in the room."}, {"t": "Coach After Exposure", "b": "Being in the game isn't development. Debrief, coach, then send them back in.", "tags": [], "k": "Exposure isn't development."}, {"t": "Effort Over Status", "b": "Five-star talent means nothing in the locker room. The top performers are the ones who work hardest.", "tags": [], "k": "Status won't carry you."}, {"t": "One Standard For All", "b": "Hold starters and backups to the same bar, so feedback feels fair, not personal.", "tags": [], "k": "High challenge, high support."}, {"t": "Name The Next Person Up", "b": "Every key role needs a successor and a development plan, even if it's cross-training.", "tags": [], "k": "Growth doesn't happen by accident ent", "b": "One leader opened with walking into the wrong restroom. The room relaxed and leaned in.", "tags": [], "k": "People like people like them."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Before your next talk:<\/b> swap one statistic for one person's story", "<b>This week:<\/b> collect three stories from your own life", "<b>Every story:<\/b> story, lesson, application", "<b>Skip:<\/b> the template, and tell it from the heart"]}, "article": null, "cards": ["img/ml-business-of-storytelling/01.jpg", "img/ml-business-of-storytelling/02.jpg", "img/ml-business-of-storytelling/03.jpg", "img/ml-business-of-storytelling/04.jpg", "img/ml-business-of-storytelling/05.jpg"], "added": 24987}, {"id": "cm-99-years-wisdom", "topic": "Money & work", "title": "A Few Basic Tricks", "sub": "He said he was no prodigy. He just learned some tricks early.", "summary": "Munger said his success came not from genius but from a few basic tricks learned early. Buy wonderful businesses run by wonderful people. Look for win-win deals. Read constantly. Invert hard problems by asking what would make them fail. Kill your own favourite ideas now and then. Pick easy problems, and treat success and failure the same.", "close": "He lost 50% three times and shrugged. Treat success and failure the same.", "safety": "", "lessons": [{"t": "Great Business, Great Person", "b": "Look for a business so good an idiot could run it, then find a wonderful person to run it anyway.", "tags": [], "k": "Both, if you can get it."}, {"t": "Only Win-Win Lasts", "b": "When both sides trust each other, like a top surgical team, things just work. One-sided deals don't last.", "tags": [], "k": "Win-win is the only formula."}, {"t": "Read Every Day", "b": "Reading lets you learn at your own pace, from the best minds. Lifelong readers have a huge edge.", "tags": [], "k": "Nothing beats reading for self-education."}, {"t": "Invert", "b": "Ask what would make it fail, then avoid that. His grandfather said: swim as long as you like, but stay near the shore.", "tags": [], "k": "Invert, always invert."}, {"t": "Kill Your Pet Ideas", "b": "Go through your best-loved ideas now and then and weed one out.", "tags": [], "k": "Destroy your best-loved ideas."}, {"t": "Pick Easy Problems", "b": "Don't make no-brainers hard. More due diligence often means more insecurity.", "tags": [], "k": "Seek out easy problems."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> invert one problem: how could this fail?", "<b>This week:<\/b> question one belief you love", "<b>Every day:<\/b> read something", "<b>When things go badly:<\/b> treat it like success: stay calm"]}, "article": null, "cards": ["img/cm-99-years-wisdom/01.jpg", "img/cm-99-years-wisdom/02.jpg", "img/cm-99-years-wisdom/03.jpg", "img/cm-99-years-wisdom/04.jpg", "img/cm-99-years-wisdom/05.jpg"], "added": 23987}, {"id": "cm-psychology-of-money", "topic": "Money & work", "title": "Your Brain Is The Real Market", "sub": "Most money is lost to behaviour, not bad picks.", "summary": "Charlie Munger's view: money problems come from bad psychology, not bad investments. Greed, fear and envy never leave, so don't trust yourself too much. Temperament beats IQ. Crowds give comfort, not truth. Doing nothing is often the smartest move, the big money is in the waiting, and envy is the one sin with no fun in it.", "close": "Control your own psychology and you'll rarely need luck.", "safety": "", "lessons": [{"t": "Don't Trust Yourself Too Much", "b": "When you feel rational, check again. You're probably being emotional with better words.", "tags": [], "k": "The monkey is in the mirror."}, {"t": "Temperament Beats IQ", "b": "High IQs blow up funds. Ordinary minds with uncommon discipline win.", "tags": [], "k": "Know where your intelligence stops."}, {"t": "Ignore The Crowd", "b": "Tulips, dotcoms, housing. When everyone agrees, the party is ending.", "tags": [], "k": "'This time is different' never is."}, {"t": "Do Less", "b": "Fewer decisions, fewer mistakes. Avoiding stupidity beats chasing brilliance.", "tags": [], "k": "Don't confuse activity with progress."}, {"t": "Get Paid To Wait", "b": "Don't dig up the tree every week to check the roots. Let compounding work.", "tags": [], "k": "The big money is in the waiting."}, {"t": "Quit Comparing", "b": "Envy is the one sin with no fun in it. It eats your peace, then your portfolio.", "tags": [], "k": "Want to be miserable? Compare."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Before any trade:<\/b> ask 'what is my brain doing?'", "<b>This week:<\/b> write your money plan on a napkin", "<b>This year:<\/b> make fewer, better decisions", "<b>Always:<\/b> stop measuring yourself against neighbours"]}, "article": null, "cards": ["img/cm-psychology-of-money/01.jpg", "img/cm-psychology-of-money/02.jpg", "img/cm-psychology-of-money/03.jpg", "img/cm-psychology-of-money/04.jpg", "img/cm-psychology-of-money/05.jpg"], "added": 22987}, {"id": "jr-twelve-micro-habits", "topic": "Growth & discipline", "title": "12 Micro Habits", "sub": "Small hinges swing big doors. One for every hour on the clock.", "summary": "Lives don't turn on one big moment; they turn on small daily acts nobody sees. Twelve small hinges: rise an hour early, finish the first small task, move daily, write something down, stop eating one bite early, read 30 minutes, keep little promises, don't speak ill of absent people, count your money, review your day, say thanks out loud, and do the hardest thing first.", "close": "None of these is hard. That's why they're easy to skip, and why they work.", "safety": "", "lessons": [{"t": "Rise An Hour Early", "b": "An hour before you must, before the day grabs you.", "tags": [], "k": "Start before the rush."}, {"t": "Finish The First Thing", "b": "Make your bed. Finish one small thing completely.", "tags": [], "k": "Done, then the next."}, {"t": "Move Every Day", "b": "Even a short walk. A still body tells the mind life is over.", "tags": [], "k": "Move the body, lift the mind."}, {"t": "Write It Down", "b": "A worry in your head grows. On paper you can face it.", "tags": [], "k": "Get it out of your head."}, {"t": "Stop One Bite Early", "b": "Leave the table with a little want left. It trains self-control.", "tags": [], "k": "The table trains the will."}, {"t": "Read 30 Minutes", "b": "Your mind is always eating. Choose what you feed it.", "tags": [], "k": "Feed it on purpose."}, {"t": "Keep Small Promises", "b": "Trust is built on the little things nobody would blame you for.", "tags": [], "k": "Small word, kept."}, {"t": "Defend The Absent", "b": "When someone isn't there to defend themselves, don't join in.", "tags": [], "k": "Guard your tongue."}, {"t": "Count Your Money", "b": "A few minutes a day: what came in, what went out.", "tags": [], "k": "Look, and leaks close."}, {"t": "Review The Day", "b": "At night, be a fair witness. Not harsh, just honest.", "tags": [], "k": "An unexamined day repeats."}, {"t": "Say Thanks Out Loud", "b": "Name one thing you're grateful for. Hearing it changes you.", "tags": [], "k": "Speak it, don't just think it."}, {"t": "Hardest Thing First", "b": "Do the task you dread at dawn, while your will is fresh.", "tags": [], "k": "Eat the frog early."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Morning:<\/b> rise early, make the bed, do the hard thing", "<b>Daytime:<\/b> move, read, keep small promises", "<b>Evening:<\/b> count money, review, say thanks", "<b>Always:<\/b> pick one hinge and start tomorrow"]}, "article": null, "cards": ["img/jr-twelve-micro-habits/01.jpg", "img/jr-twelve-micro-habits/02.jpg", "img/jr-twelve-micro-habits/03.jpg", "img/jr-twelve-micro-habits/04.jpg", "img/jr-twelve-micro-habits/05.jpg", "img/jr-twelve-micro-habits/06.jpg", "img/jr-twelve-micro-habits/07.jpg", "img/jr-twelve-micro-habits/08.jpg"], "added": 21987}, {"id": "jr-one-daily-habit", "topic": "Growth & discipline", "title": "Change One Habit", "sub": "Not ten. One. Done daily, it moves everything.", "summary": "Life doesn't change by the pound; it changes by the ounce, done daily. One habit multiplied across a thousand days beats ten habits tried at once. Find the hinge habit that touches the most areas of your life, expect a valley where nothing seems to work, wait for the world to echo the change, and never miss twice.", "close": "Change one thing tomorrow. One day you won't recognise where you started.", "safety": "", "lessons": [{"t": "Judge It Over 1,000 Days", "b": "One page, one mile, one small sum does nothing today. Over a thousand days, it's a library.", "tags": [], "k": "The cost is charged by the decade."}, {"t": "Easy To Do, Easy Not To", "b": "The small good thing and the small bad thing cost the same today. That's the trap.", "tags": [], "k": "What's easy to do is easy not to do."}, {"t": "Pick One, Not Ten", "b": "Ten new habits at once collapse together. Then you blame yourself instead of the plan.", "tags": [], "k": "Humble and daily beats grand and abandoned."}, {"t": "Find The Hinge", "b": "Pick the habit that moves the most other areas, like waking earlier, not an ornament.", "tags": [], "k": "Move the hinge, not the ornament."}, {"t": "Walk Through The Valley", "b": "Weeks in, it feels heavy and useless. Count the days. Feelings lie, the calendar doesn't.", "tags": [], "k": "The valley isn't the destination."}, {"t": "Never Miss Twice", "b": "One skip is life. Two in a row starts to erase who you are becoming.", "tags": [], "k": "Never break the chain twice."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> choose your one hinge habit", "<b>Tomorrow:<\/b> do it, and mark the day", "<b>Week 3:<\/b> keep going through the valley", "<b>Always:<\/b> if you miss a day, never miss the next"]}, "article": null, "cards": ["img/jr-one-daily-habit/01.jpg", "img/jr-one-daily-habit/02.jpg", "img/jr-one-daily-habit/03.jpg", "img/jr-one-daily-habit/04.jpg", "img/jr-one-daily-habit/05.jpg"], "added": 20987}, {"id": "jr-ten-habits-smarter", "topic": "Learning & focus", "title": "10 Habits That Make You Smarter", "sub": "Smart isn't something you're born with. It's a set of habits.", "summary": "Smart is not a fixed trait you're born with. It's a set of habits you practice or neglect. Read to gather, ask better questions, keep a journal, choose your company, teach what you learn, let big decisions ripen, guard your attention, study your failures, think before speaking, and turn knowledge into action the same day.", "close": "Don't try all ten. Pick one and practise it until it's part of you.", "safety": "", "lessons": [{"t": "Read To Gather", "b": "Don't race to the last page. Keep the one idea you can use.", "tags": [], "k": "Keep the idea, not the page count."}, {"t": "Ask Sharper Questions", "b": "A fast answer feels smart. A good question solves problems.", "tags": [], "k": "A good question beats a fast answer."}, {"t": "Keep A Journal", "b": "Write down what you saw, decided and learned. Memory fills up.", "tags": [], "k": "The pen remembers."}, {"t": "Choose Your Company", "b": "People shape your speech and your sense of what's possible.", "tags": [], "k": "Pick people like you pick food."}, {"t": "Teach What You Learn", "b": "That feeling of understanding can fool you. Explain it to a child.", "tags": [], "k": "You own it when you can hand it over."}, {"t": "Let Decisions Ripen", "b": "Decide small things fast. Give the big ones time.", "tags": [], "k": "Don't pick it green."}, {"t": "Guard Your Attention", "b": "Scattered attention buys nothing. Spend it like your wages.", "tags": [], "k": "Attention is your wage."}, {"t": "Study Your Failures", "b": "Don't blame the weather. Look in the mirror and learn.", "tags": [], "k": "The lesson is in the wreck."}, {"t": "Think Before You Speak", "b": "Fast talkers spend years explaining what they didn't mean.", "tags": [], "k": "Weigh it, then say it."}, {"t": "Act The Same Day", "b": "An idea left unused spoils like fruit on the counter.", "tags": [], "k": "Knowledge only works when used."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Tonight:<\/b> pick the one habit that hit hardest", "<b>This week:<\/b> practice it every day", "<b>This month:<\/b> keep going until it's automatic", "<b>Next:<\/b> add one more"]}, "article": null, "cards": ["img/jr-ten-habits-smarter/01.jpg", "img/jr-ten-habits-smarter/02.jpg", "img/jr-ten-habits-smarter/03.jpg", "img/jr-ten-habits-smarter/04.jpg", "img/jr-ten-habits-smarter/05.jpg", "img/jr-ten-habits-smarter/06.jpg", "img/jr-ten-habits-smarter/07.jpg"], "added": 19987}, {"id": "jr-start-late-finish-rich", "topic": "Growth & discipline", "title": "Start Late, Finish Rich", "sub": "It's not too late. Time is a field, not a bank.", "summary": "Most people who say they started too late really just didn't start. Time isn't a bank you can overdraw; it's a field that only asks what you plant today. Late starters bring hard-won judgment, and the thinner margin forces a sharper discipline. Small daily deposits multiply, some company will hold you back, and staying the same has a cost too.", "close": "At a full table, nobody asks what time the planting started.", "safety": "", "lessons": [{"t": "Retire 'It's Too Late'", "b": "Those three words end the race before the first step. You can't get the years back. You can get the person back.", "tags": [], "k": "Age gets blamed for neglect."}, {"t": "Count Forward", "b": "Stop counting the years you lost. Count the ones you have left. Many people have more ahead than behind.", "tags": [], "k": "Time is a field, not a bank."}, {"t": "Cash In Your Scars", "b": "Mistakes left you with judgment, patience and a nose for fakes. Young people still have to pay for that.", "tags": [], "k": "Wisdom is compressed failure."}, {"t": "Use The Thin Margin", "b": "You can't waste a Tuesday any more. That focus often overtakes people who started early and coasted.", "tags": [], "k": "Never let lost time steal more."}, {"t": "A Little, Daily", "b": "A small sum and a small hour, every day. People will laugh at the amount. It multiplies anyway.", "tags": [], "k": "The point was never the amount."}, {"t": "Count Both Bills", "b": "Change costs something. Staying the same costs more, and that bill arrives quietly at the end.", "tags": [], "k": "Choose the ounces now."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> write down the years you have left", "<b>This week:<\/b> start a small daily deposit of money and time", "<b>This month:<\/b> spend less time with people who keep you still", "<b>This year:<\/b> plant something you'll harvest later"]}, "article": null, "cards": ["img/jr-start-late-finish-rich/01.jpg", "img/jr-start-late-finish-rich/02.jpg", "img/jr-start-late-finish-rich/03.jpg", "img/jr-start-late-finish-rich/04.jpg", "img/jr-start-late-finish-rich/05.jpg"], "added": 18987}, {"id": "jr-set-your-sail", "topic": "Mindset & motivation", "title": "Set Your Sail", "sub": "The same wind blows on everyone. The sail is yours.", "summary": "Two people can face the same economy and the same luck and end up in very different places. The wind is the same; the set of the sail is different. Change starts on a single day with a decision, and it grows through small daily disciplines. Wish to be better, not for life to be easier, and fix your thinking before your circumstances.", "close": "It's not what happens that shapes your life. It's what you do about it.", "safety": "", "lessons": [{"t": "Stop Studying The Wind", "b": "The economy, the boss, bad luck: they blow on everyone. Stop being an expert on the weather.", "tags": [], "k": "For things to change, you must change."}, {"t": "Change Starts On A Day", "b": "Turn the next shame or disgust into a promise. The slow part is just the decision working itself out.", "tags": [], "k": "Decide, don't just suffer."}, {"t": "Wish To Be Better", "b": "Don't ask for lighter burdens. Build heavier shoulders. The same load breaks one person and builds another.", "tags": [], "k": "Don't wish it were easier."}, {"t": "Check Your Philosophy", "b": "What you believe about a dollar, a day, and what you're owed writes your life. A new address won't fix it.", "tags": [], "k": "Correct the thinking first."}, {"t": "Mind The Small Leaks", "b": "Failure is a few small errors repeated daily. Ships rarely sink in storms. They sink from ignored cracks.", "tags": [], "k": "Discipline weighs ounces. Regret weighs tons."}, {"t": "Become More", "b": "Better people and chances come to those who have grown into them. Work on yourself, and your world rearranges.", "tags": [], "k": "You attract what you become."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Tonight:<\/b> draw one line you will not cross again", "<b>This week:<\/b> swap one complaint for one skill to learn", "<b>Every day:<\/b> keep one small promise to yourself", "<b>This month:<\/b> find and fix one small leak"]}, "article": null, "cards": ["img/jr-set-your-sail/01.jpg", "img/jr-set-your-sail/02.jpg", "img/jr-set-your-sail/03.jpg", "img/jr-set-your-sail/04.jpg", "img/jr-set-your-sail/05.jpg"], "added": 17987}, {"id": "jr-one-percent-morning", "topic": "Growth & discipline", "title": "14 Minutes That Run Your Day", "sub": "1% of your day is 14 minutes. Own them and the rest follows.", "summary": "You're not short on time. You're short on ownership of the first slice of it. 1% of a day is about 14 minutes, and those first minutes set the tone the rest of the day obeys. Keep the habit small enough to survive your worst morning, fill it with things that build you before the world gets in, and guard it.", "close": "Judge the 14 minutes by who you are in a year, not by how today feels.", "safety": "", "lessons": [{"t": "The Morning Sets The Tone", "b": "The posture you wake up in is the posture you carry all day. Rushed at 6 means frayed at 3.", "tags": [], "k": "You set the thermostat early."}, {"t": "Keep It Small On Purpose", "b": "A 2-hour routine dies on the first bad morning. 14 minutes is too small to argue with.", "tags": [], "k": "Small and kept beats big and quit."}, {"t": "Test 'Not A Morning Person'", "b": "It's a habit wearing the costume of a trait. Try 30 days, small, after a real night's sleep.", "tags": [], "k": "Habits came first. The label came later."}, {"t": "Build Before You React", "b": "Whatever you touch first gets your best energy. Don't hand it to messages and other people's lists.", "tags": [], "k": "Pay yourself first, in attention."}, {"t": "Mind, Body, Aim", "b": "Read a few pages. Move a few minutes. Name the one thing that would make today a win.", "tags": [], "k": "Three things, in that order."}, {"t": "Guard The Spring", "b": "Small favors steal the 14 minutes. Close the door for a week or two. People learn the new rule.", "tags": [], "k": "Protect the source, and the river follows."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Tonight:<\/b> go to bed early enough to rest", "<b>Tomorrow:<\/b> read, move, and set one aim in 14 minutes", "<b>Every day:<\/b> no messages until the 14 minutes are done", "<b>Day 30:<\/b> look back and see who you became"]}, "article": null, "cards": ["img/jr-one-percent-morning/01.jpg", "img/jr-one-percent-morning/02.jpg", "img/jr-one-percent-morning/03.jpg", "img/jr-one-percent-morning/04.jpg", "img/jr-one-percent-morning/05.jpg"], "added": 16987}, {"id": "rg-why-read-books", "topic": "Mindset & motivation", "title": "Why You Should Read Books", "sub": "5 reasons from Robert Greene.", "summary": "Robert Greene says our own thoughts run in narrow circles: the same worries, the same people, the same shows. Books break that loop. They let you travel to ancient Rome or Renaissance Italy, meet ideas that aren't yours, and see that your thinking was inherited from centuries of history. Ignore books and your world keeps shrinking.", "close": "Ignore books and your world keeps getting narrower. Read, and it keeps getting bigger.", "safety": "", "lessons": [{"t": "Your Mind Runs In Circles", "b": "Print a week of your thoughts and you'd find the same worries and resentments on repeat.", "tags": [], "k": "Your world is smaller than you think."}, {"t": "Books Are Travel", "b": "Sit with Marcus Aurelius, walk Renaissance Italy with Leonardo, follow Napoleon across battlefields.", "tags": [], "k": "Leave your apartment without leaving."}, {"t": "Meet Ideas Not Your Own", "b": "Strange ideas from other cultures and eras open your mind and make you more creative.", "tags": [], "k": "New ideas, new you."}, {"t": "You're Not Just From Today", "b": "Your ideas came from your parents, your culture and centuries of history. Know where they come from.", "tags": [], "k": "Ground yourself in the past."}, {"t": "Build The Good Addiction", "b": "Greene would lose his mind going a month without a book. Make reading the habit you can't skip.", "tags": [], "k": "The best addiction you can have."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> pick one book from another century", "<b>Daily:<\/b> read 15 minutes before your phone", "<b>This week:<\/b> write down one idea that isn't yours", "<b>This month:<\/b> finish the book and start the next"]}, "article": null, "cards": ["img/rg-why-read-books/01.jpg", "img/rg-why-read-books/02.jpg", "img/rg-why-read-books/03.jpg", "img/rg-why-read-books/04.jpg", "img/rg-why-read-books/05.jpg"], "added": 15987}, {"id": "rg-three-books", "topic": "Growth & discipline", "title": "3 Books That Shaped Me", "sub": "Robert Greene on the books with the biggest impact on his life.", "summary": "Out of thousands of books, Robert Greene names three that changed him most: Machiavelli's The Prince, read at 15 for its brutal realism; Thucydides' History of the Peloponnesian War, a 2,500-year-old narrator with startling clarity; and Carlos Castaneda's books on Don Juan, about self-mastery and facing mortality. Nietzsche and Dostoevsky are close behind.", "close": "The right book at the right age can shape the rest of your life.", "safety": "", "lessons": [{"t": "The Prince", "b": "He read it at 15 and six or seven times since. It shows people as they really are, without the usual moralizing.", "tags": [], "k": "See people as they are."}, {"t": "History of the Peloponnesian War", "b": "In ancient Greek one paragraph took him three days. A 2,500-year-old narrator who reads like a modern analyst.", "tags": [], "k": "Clear thinking never ages."}, {"t": "Journey to Ixtlan", "b": "About self-control, facing your mortality and living like a warrior. The root of many of Greene's own ideas.", "tags": [], "k": "Master yourself first."}, {"t": "Bonus shelf", "b": "His biggest influences of all, but there are too many great books to pick just one.", "tags": [], "k": "Read the whole author."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>This week:<\/b> pick one of the three and read 10 pages a day", "<b>While reading:<\/b> note one line about human nature per chapter", "<b>This month:<\/b> reread the passage that hit hardest", "<b>Next:<\/b> read a second book by the author you liked"]}, "article": null, "cards": ["img/rg-three-books/01.jpg", "img/rg-three-books/02.jpg", "img/rg-three-books/03.jpg", "img/rg-three-books/04.jpg"], "added": 14987}, {"id": "rg-how-greene-uses-laws", "topic": "Growth & discipline", "title": "How I Use The 48 Laws", "sub": "5 lessons from the author himself.", "summary": "Robert Greene explains why he wrote The 48 Laws of Power as a straight shot of reality: power games happen in every office, and nobody teaches you the rules. He shares the laws he uses most: make yourself irreplaceable, enter action with boldness, ignore petty attacks, and keep changing shape.", "close": "These laws aren't about crushing anyone. They're about not letting anyone crush you.", "safety": "", "lessons": [{"t": "Read It For Defense", "b": "Power games happen in every office. Knowing the rules stops you from talking too much, trusting blindly or hiring the wrong partner.", "tags": [], "k": "Naivety is expensive."}, {"t": "Be Irreplaceable", "b": "If someone cheaper can do your job, you're at risk. Build a mix of skills that only you have.", "tags": [], "k": "Make your work impossible to copy."}, {"t": "Enter With Boldness", "b": "Editors wanted his book softened. He said take it or leave it. That boldness is why it worked.", "tags": [], "k": "Don't apologize for being different."}, {"t": "Ignore The Petty", "b": "When a former collaborator kept attacking him, Greene simply didn't respond. Attention feeds attacks.", "tags": [], "k": "Silence is the best reply."}, {"t": "Stay Formless", "b": "He never writes the same book twice. Keep moving to the next thing instead of repeating a win.", "tags": [], "k": "Don't get stuck in one shape."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> write the one skill mix only you have", "<b>This week:<\/b> stop replying to one petty attack", "<b>Next project:<\/b> do it boldly, no apologies", "<b>After a win:<\/b> move on to something new"]}, "article": null, "cards": ["img/rg-how-greene-uses-laws/01.jpg", "img/rg-how-greene-uses-laws/02.jpg", "img/rg-how-greene-uses-laws/03.jpg", "img/rg-how-greene-uses-laws/04.jpg", "img/rg-how-greene-uses-laws/05.jpg"], "added": 13987}, {"id": "rg-laws-to-protect-you", "topic": "Mindset & motivation", "title": "6 Laws That Protect You", "sub": "Robert Greene's laws, read for defense, not for harm.", "summary": "Robert Greene's 48 Laws describe the power games people play at work and in life. Read as a defense manual, a few laws stand out: don't outshine the people above you, say less than necessary, win with actions instead of arguments, know who you're dealing with, master timing, and never appear too perfect.", "close": "Knowing the game isn't about playing dirty. It's about not getting played.", "safety": "", "lessons": [{"t": "Never Outshine The Master", "b": "Let the people above you feel secure. Showing off can stir their fear and insecurity.", "tags": [], "k": "Shine, but not in their face."}, {"t": "Say Less Than Necessary", "b": "The more you say, the more common you seem, and the likelier you'll say something foolish.", "tags": [], "k": "Less talk, more weight."}, {"t": "Win With Actions", "b": "Winning an argument leaves resentment. Show people instead of arguing with them.", "tags": [], "k": "Demonstrate, don't explain."}, {"t": "Know Who You're Dealing With", "b": "People react differently. Some never forgive a slight, so never offend the wrong person.", "tags": [], "k": "Read people first."}, {"t": "Master Your Timing", "b": "Never look rushed. Hold back when the moment isn't ripe, and move fully when it is.", "tags": [], "k": "Patience is power."}, {"t": "Never Appear Too Perfect", "b": "Flawless people attract envy. Admit harmless flaws and stay human.", "tags": [], "k": "Perfect makes enemies."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> notice who talks most in your next meeting", "<b>This week:<\/b> replace one argument with an action", "<b>Before big moves:<\/b> ask: is the timing ripe?", "<b>Always:<\/b> share a harmless flaw instead of a flawless image"]}, "article": null, "cards": ["img/rg-laws-to-protect-you/01.jpg", "img/rg-laws-to-protect-you/02.jpg", "img/rg-laws-to-protect-you/03.jpg", "img/rg-laws-to-protect-you/04.jpg", "img/rg-laws-to-protect-you/05.jpg"], "added": 12987}, {"id": "rg-find-your-purpose", "topic": "Growth & discipline", "title": "Find Your Life's Task", "sub": "6 steps from Robert Greene, author of Mastery.", "summary": "Robert Greene tells Andrew Huberman that purpose isn't handed to you; you dig for it. You're a one-off, and the clues sit in what fascinated you as a child. Following that emotional pull makes discipline easier and learning faster. Your frustrations point the way back, and a patchwork of real mentors carries you forward.", "close": "When you find your life's task, everything gets a direction, and your energy stops leaking.", "safety": "", "lessons": [{"t": "Start From Your Uniqueness", "b": "Your DNA has never existed before and never will again. That one-off seed is your direction.", "tags": [], "k": "You are a phenomenon."}, {"t": "Dig Up Childhood Clues", "b": "What pulled you in before anyone told you what to like? Einstein had a compass at four; Greene had words.", "tags": [], "k": "Your earliest obsessions are clues."}, {"t": "Follow Emotion, Not Just Money", "b": "When you care about the work, discipline gets easier and you learn faster. Choosing only for money can lead you astray.", "tags": [], "k": "Love makes practice possible."}, {"t": "Read Your Frustration", "b": "Unhappy in your career? Ask why. The answer can lead you back to your childhood pull, even in your 30s.", "tags": [], "k": "Frustration is a signpost."}, {"t": "Collect Many Mentors", "b": "No single mentor has it all. Choose several 'surrogate parents' and absorb the best of each.", "tags": [], "k": "Build your own family of teachers."}, {"t": "Go Beyond Following", "b": "A follow is just a click. A mentor takes courage: go up to them and ask, in person.", "tags": [], "k": "Mentorship takes nerve."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Tonight:<\/b> list 3 things you loved before age 12", "<b>This week:<\/b> ask what frustrates you at work and why", "<b>This month:<\/b> name 3 people whose qualities you want to learn", "<b>Next:<\/b> reach out to one of them in person"]}, "article": null, "cards": ["img/rg-find-your-purpose/01.jpg", "img/rg-find-your-purpose/02.jpg", "img/rg-find-your-purpose/03.jpg", "img/rg-find-your-purpose/04.jpg", "img/rg-find-your-purpose/05.jpg"], "added": 11987}, {"id": "rg-impossible-to-ignore", "topic": "Relationships", "title": "Become Impossible To Ignore", "sub": "6 lessons from the author of The Art of Seduction, on Raj Shamani's podca
