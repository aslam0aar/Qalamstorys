st.", "summary": "Robert Greene says real charm is psychology, not looks. Insecure people struggle because they're stuck in their own heads. Turn your attention to the other person, quiet your inner chatter, drop defensiveness, keep a little mystery, say less than you could, and build confidence step by step instead of trying hard to please.", "close": "People rarely feel seen. Give them that, and the world opens up to you.", "safety": "", "lessons": [{"t": "Focus On Them", "b": "Get out of your own head. Notice what the other person wants and needs. Almost no one feels truly seen.", "tags": [], "k": "Attention is the rarest gift."}, {"t": "Quiet The Chatter", "b": "Practice on someone you see daily, like a shop clerk. Imagine their home, their day, their childhood.", "tags": [], "k": "Listening is a skill you train."}, {"t": "Drop The Defenses", "b": "Confronted, Greene's calmest friend didn't argue or grovel. He stayed open and calm, and the anger melted.", "tags": [], "k": "No ego, no fight."}, {"t": "Leave Some Mystery", "b": "Show a side people don't expect. The goal is that they still think about you after you leave.", "tags": [], "k": "Be remembered when you're gone."}, {"t": "Say Less", "b": "Constant talking looks like a lack of control. Speak less, and when you do speak, people lean in.", "tags": [], "k": "Silence carries weight."}, {"t": "Stop Over-Pleasing", "b": "Trying too hard reads as insecurity. Build real confidence step by step, and be calm and normal around powerful people.", "tags": [], "k": "Confidence is built, not born."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> in one conversation, ask more than you tell", "<b>This week:<\/b> try the shop-clerk exercise twice", "<b>In your next conflict:<\/b> stay calm and listen before you answer", "<b>In meetings:<\/b> say less and make it count"]}, "article": null, "cards": ["img/rg-impossible-to-ignore/01.jpg", "img/rg-impossible-to-ignore/02.jpg", "img/rg-impossible-to-ignore/03.jpg", "img/rg-impossible-to-ignore/04.jpg", "img/rg-impossible-to-ignore/05.jpg"], "added": 10987}, {"id": "sy-digital-dessert", "topic": "Mental peace", "title": "Social Media Is Digital Dessert", "sub": "6 simple lessons you can start this week.", "summary": "Dr. Sahar Yousef says big tech copied the processed-food playbook: raise the stimulation, remove the friction and cut the satiation. Social media gives a mirage of connection that spikes dopamine but never delivers the oxytocin and serotonin of real contact, so you keep scrolling. You can't quit your phone, but you can reverse the formula: fewer notifications and grayscale, longer content, the phone out of sight, portion control, and more real life.", "close": "You can't quit your phone, but you can change the diet. Enjoy the dessert, then go eat the real meal.", "safety": "", "lessons": [{"t": "See The Recipe", "b": "Junk food and apps use the same formula: more stimulation, less friction, less satiation. You keep eating but never feel full.", "tags": ["Bright colors", "Infinite scroll", "Fake connection"], "k": "It's not your fault, it's the design."}, {"t": "Turn Down The Sugar", "b": "Only allow notifications for things more urgent than what you're doing now. Grayscale saved her students about an hour a day.", "tags": ["Cut news alerts", "Batch the rest", "Go grayscale"], "k": "Fewer pings, calmer brain."}, {"t": "Pick Longer Content", "b": "Short videos plus fast switching are linked to shorter attention and worse memory. Choose a full film or long video.", "tags": ["Like long videos", "Skip short ones", "Make movie night real"], "k": "Train your feed, not just your thumb."}, {"t": "Park Your Phone", "b": "In a 2017 study, the closer the phone, the worse people scored, even when it was switched off.", "tags": ["Phone parking spot", "Another room", "Out of sight, out of mind"], "k": "A phone in view drains your mind."}, {"t": "Use Portion Control", "b": "Limit how many sessions you get and how long each lasts. Add a friend so you keep each other honest.", "tags": ["Screen-time limits", "Finite sessions", "Friend accountability"], "k": "Finite sessions beat infinite scroll."}, {"t": "Eat The Real Meal", "b": "A day with friends, learning something new or a big win leaves you full. Real life gives the satisfaction the feed only fakes.", "tags": ["See people in person", "Learn something", "Finish a project"], "k": "Don't mistake dessert for dinner."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> turn off every notification that isn't urgent", "<b>Tonight:<\/b> watch one full film, phone in another room", "<b>This week:<\/b> set screen-time limits with a friend", "<b>This weekend:<\/b> plan real time with people you love"]}, "article": null, "cards": ["img/sy-digital-dessert/01.jpg", "img/sy-digital-dessert/02.jpg", "img/sy-digital-dessert/03.jpg", "img/sy-digital-dessert/04.jpg", "img/sy-digital-dessert/05.jpg"], "added": 9987}, {"id": "sy-focus-memory", "topic": "Mindset & motivation", "title": "10X Your Focus & Memory", "sub": "6 simple lessons you can start this week.", "summary": "Dr. Sahar Yousef shows Raj Shamani that switching tasks more than doubles the time a simple task takes, and that just seeing your phone lowers your thinking scores. High achievers differ mostly in belief: they rewrite the story their brain's default mode network tells, then turn it into concrete when-then plans. Ideas come when you let yourself be bored, and your energy depends on sleep and your natural chronotype.", "close": "Your brain follows laws, just like gravity. Learn them, and focus stops being a fight.", "safety": "", "lessons": [{"t": "Stop Switching", "b": "Write a sentence and 1 to 20, then do both again, alternating letter and number. Raj went from 17.7 to 41.4 seconds.", "tags": ["One task at a time", "Close other tabs", "Batch small jobs"], "k": "Every switch has a price."}, {"t": "Hide Your Phone", "b": "Just having your phone in sight lowers attention and reasoning scores. On the table in a meeting, it also makes you look less trustworthy.", "tags": ["Out of sight", "Not on the desk", "Away 30 min before bed"], "k": "A visible phone steals your IQ."}, {"t": "Rewrite Your Story", "b": "Your brain's storyteller looks for proof of what you already believe. Write the story you want and review it every day.", "tags": ["Spot the victim story", "Redirect your attention", "Main character energy"], "k": "You notice what you believe."}, {"t": "Write 'I'm The Type Who...'", "b": "Stack a value, a fact you know and the payoff, then one line: 'I'm the type of person who sleeps 7 hours because it's my edge.'", "tags": ["Value", "Fact", "Payoff", "New habit"], "k": "Identity first, habits follow."}, {"t": "Plan When-Then", "b": "'Try to sleep earlier' is a wish. 'When my 11 pm alarm rings, I start my wind-down' is a plan. Picture it in detail.", "tags": ["When X happens", "Then I do Y", "See it like a movie"], "k": "A goal without a plan is a prayer."}, {"t": "Make Room To Be Bored", "b": "Shower thoughts are real: ideas come when your mind wanders. Don't grab the phone first thing, and protect 7+ hours of sleep.", "tags": ["No phone on waking", "Walk without input", "Know your chronotype"], "k": "Boredom is where ideas grow."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> do the multitasking test and feel the cost", "<b>Tonight:<\/b> write one 'I'm the type of person who...' line", "<b>This week:<\/b> turn one goal into a when-then plan", "<b>Every morning:<\/b> 10 phone-free minutes to let your mind wander"]}, "article": null, "cards": ["img/sy-focus-memory/01.jpg", "img/sy-focus-memory/02.jpg", "img/sy-focus-memory/03.jpg", "img/sy-focus-memory/04.jpg", "img/sy-focus-memory/05.jpg"], "added": 8987}, {"id": "sy-hour-back-every-day", "topic": "Growth & discipline", "title": "Win Back An Hour A Day", "sub": "6 simple lessons you can start this week.", "summary": "Neuroscientist Dr. Sahar Yousef (UC Berkeley, Becoming Superhuman Lab) tells Steven Bartlett that the brain is a monotasking machine and every switch costs time and energy. Default tech settings are built for engagement, not your productivity. In her lab, a grayscale phone gave people about an hour a day back. Then she lays out the focus sprint: pick your most important tasks, block the time, break the goal into a step-by-step output list, cut the noise and race a timer.", "close": "Your attention is your time, and your time is your life. Take it back from the default settings.", "safety": "", "lessons": [{"t": "Turn Your Phone Gray", "b": "Grayscale makes the phone less stimulating. In her lab, people spent about 1 hour less on it every day.", "tags": ["Settings > grayscale", "Keep it 3 weeks", "Color only for photos"], "k": "That's 7 hours a week back."}, {"t": "Let Only VIPs Knock", "b": "Like a parcel that needs a signature, only your top people and keywords should interrupt you. Everything else waits in the mailbox.", "tags": ["Pick your VIP list", "Mute group chats", "Batch the rest"], "k": "You're better than the default settings."}, {"t": "Pick 1 To 3 MITs", "b": "Each morning choose your Most Important Tasks: the 1 to 3 things that would make today a success.", "tags": ["How much time today?", "What will future me thank me for?", "Max 3"], "k": "Big goals, one step a day."}, {"t": "Block The Sprint", "b": "Put focus time in your calendar in advance. Knowing it's coming gives your brain a boost, and your team can see you're busy.", "tags": ["Book it ahead", "Make it visible", "Start with 1 hour"], "k": "Plan the game before you play it."}, {"t": "Write The Output List", "b": "Not 'work on the deck'. Break it into small pieces you can finish, with a time for each, so you never stop to ask 'what next?'", "tags": ["Output, not input", "Small chunks", "Time each one"], "k": "Finishing feels better than working on."}, {"t": "Cut Noise, Race A Timer", "b": "Phone out of sight, notifications off, one focus playlist. Then set a countdown: work expands to fill the time you give it.", "tags": ["Phone in another room", "One focus playlist", "Countdown timer"], "k": "A ticking clock makes you faster."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> turn on grayscale and set up your VIP notifications", "<b>Each morning:<\/b> pick 1 to 3 MITs", "<b>This week:<\/b> block three 1-hour focus sprints in your calendar", "<b>Every sprint:<\/b> write the output list, hide the phone, start a countdown"]}, "article": null, "cards": ["img/sy-hour-back-every-day/01.jpg", "img/sy-hour-back-every-day/02.jpg", "img/sy-hour-back-every-day/03.jpg", "img/sy-hour-back-every-day/04.jpg", "img/sy-hour-back-every-day/05.jpg"], "added": 7987}, {"id": "sy-why-people-dont-post", "topic": "Mental peace", "title": "Why Some People Never Post", "sub": "5 simple lessons you can start this week.", "summary": "UC Berkeley cognitive neuroscientist Dr. Sahar Yousef explains that how we use social media was mostly trained into us. About 37% of people are 'seldom posters'. Likes work like a slot machine (reward prediction error), so when posts go unrewarded the urge to share fades, a process psychologists call extinction. Watching solo highlight reels lowers self-esteem, while group photos and real connection help. Her fix: know your type, hide like counts, audit your feed, and post for your people, not the numbers.", "close": "Going quiet online was trained into you, so it can be untrained. Post for your people, not the pellet.", "safety": "", "lessons": [{"t": "Know Your Posting Type", "b": "Most people barely post, some post photos, some post memes, a few post everything. Seldom posters actually know their followers.", "tags": ["Scroll your followers", "Do you know them?", "Name your type"], "k": "Bigger crowd, blurrier faces."}, {"t": "See The Slot Machine", "b": "Your brain reacts to the gap between the likes you expected and the likes you got. Unpredictable rewards keep you pulling the lever.", "tags": ["Notice the jolt", "Notice the dip", "Your post didn't change"], "k": "Likes train you like a pigeon."}, {"t": "Cut The Wire", "b": "Hide like counts on your posts and everyone else's, and turn off engagement alerts. Check numbers only when you choose.", "tags": ["Hide like counts", "Mute notifications", "Check on purpose"], "k": "No pellet, no conditioning."}, {"t": "Audit Your Feed", "b": "Solo highlight reels push you to compare. Group moments and real friends make you feel connected.", "tags": ["Compare or connect?", "Mute the comparisons", "Keep the humans"], "k": "What you watch shapes how you feel."}, {"t": "Post For Your Village", "b": "Share what you love on your terms. Decide the number below it doesn't get a vote, and push through the first silence.", "tags": ["Post for your people", "Ignore the count", "Comment, don't just watch"], "k": "Your people can't find a silent you."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> scroll your follower list and name your posting type", "<b>Tonight:<\/b> hide like counts and turn off engagement notifications", "<b>This week:<\/b> mute three accounts that make you compare", "<b>Next post:<\/b> share something you love and ignore the count"]}, "article": null, "cards": ["img/sy-why-people-dont-post/01.jpg", "img/sy-why-people-dont-post/02.jpg", "img/sy-why-people-dont-post/03.jpg", "img/sy-why-people-dont-post/04.jpg", "img/sy-why-people-dont-post/05.jpg"], "added": 6987}, {"id": "hp-emotional-intelligence", "topic": "Mental peace", "title": "Name It To Tame It", "sub": "6 simple lessons you can start this week.", "summary": "Yale's Dr. Marc Brackett explains that emotional intelligence is a skill, not a personality trait. His RULER method (recognize, understand, label, express, regulate) and tools like the Mood Meter help you name feelings precisely, give yourself permission to feel, and reframe instead of suppressing.", "close": "Emotions aren't the problem. Not knowing what they are is. Name them, and you get your choices back.", "safety": "", "lessons": [{"t": "Check Your Mood Meter", "b": "Ask two questions: how much energy do I have, and how pleasant do I feel? That places your mood.", "tags": ["Energy high or low?", "Pleasant or not?", "Check 3x a day"], "k": "Notice before you name."}, {"t": "Find The Exact Word", "b": "Not just 'bad'. Disappointed, anxious, envious? The right word tells you what to do next.", "tags": ["Skip 'fine'", "Pick a precise word", "Name the cause"], "k": "Precise words, clearer choices."}, {"t": "Give Yourself Permission", "b": "Pushing feelings down tends to make them stronger. Let yourself feel them first.", "tags": ["It's okay to feel", "Don't hide it", "Breathe through it"], "k": "Suppressed feelings get louder."}, {"t": "Reframe From Above", "b": "Picture yourself in a hot air balloon looking down at the situation. Distance changes the story.", "tags": ["Zoom out", "See the bigger picture", "Then respond"], "k": "Distance calms the storm."}, {"t": "Express It Well", "b": "Say what you feel calmly and clearly. Texts drop tone, so talk in person for hard things.", "tags": ["'I feel... because...'", "Call, don't text", "Stay calm"], "k": "Feelings deserve a voice."}, {"t": "Use Envy As Fuel", "b": "A flash of envy can show you what you want. Use it, but don't let it linger.", "tags": ["What do I want?", "Make a plan", "Let it go"], "k": "Envy points to your goals."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Three times a day:<\/b> check your mood meter: energy and pleasantness", "<b>When upset:<\/b> find the exact word for the feeling", "<b>In conflict:<\/b> zoom out, then speak in person", "<b>Weekly:<\/b> notice one envy and turn it into a goal"]}, "article": null, "cards": ["img/hp-emotional-intelligence/01.jpg", "img/hp-emotional-intelligence/02.jpg", "img/hp-emotional-intelligence/03.jpg", "img/hp-emotional-intelligence/04.jpg", "img/hp-emotional-intelligence/05.jpg"], "added": 5987}, {"id": "rs-joe-hudson", "topic": "Mindset & motivation", "title": "Drop The 'I Should'", "sub": "5 simple lessons you can start this week.", "summary": "Coach Joe Hudson, founder of The Art of Accomplishment, talks about what makes high performers different: they stop ruminating, act from want instead of 'should', drop guilt and people-pleasing, rewrite their inner story, and learn to feel emotions without being run by them.", "close": "Ambition doesn't have to feel like pressure. When it comes from what you want, it feels like energy.", "safety": "", "lessons": [{"t": "Stop The Replay", "b": "Rumination drains energy. Notice when you're replaying a moment and come back to now.", "tags": ["Catch the loop", "Name it", "Return to now"], "k": "Replays steal today."}, {"t": "Want, Don't Should", "b": "Motivation from 'I should' runs out. Find what you truly want and act from that.", "tags": ["Swap 'should' for 'want'", "Ask why", "Follow the pull"], "k": "Want lasts longer than should."}, {"t": "Quit People-Pleasing", "b": "Guilt keeps you doing what others want. Learn what you really want, then say it.", "tags": ["Pause before yes", "Name your want", "Say it kindly"], "k": "Your wants matter too."}, {"t": "Rewrite Your Inner Story", "b": "Change the story you tell yourself and healthy ambition follows.", "tags": ["Spot the old story", "Write a new one", "Live it"], "k": "New story, new drive."}, {"t": "Feel It, Don't Obey It", "b": "Learn to name anger, sadness, guilt and shame, and feel them without being controlled.", "tags": ["Name the emotion", "Feel it in your body", "Then choose"], "k": "Feel fully, act freely."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> cross out one 'should' on your list and write the 'want' behind it", "<b>When ruminating:<\/b> name it and come back to now", "<b>This week:<\/b> say no to one thing you'd only do from guilt", "<b>Daily:<\/b> name one emotion you felt and where you felt it"]}, "article": null, "cards": ["img/rs-joe-hudson/01.jpg", "img/rs-joe-hudson/02.jpg", "img/rs-joe-hudson/03.jpg", "img/rs-joe-hudson/04.jpg", "img/rs-joe-hudson/05.jpg"], "added": 5986}, {"id": "mx-good-life-image", "topic": "Growth & discipline", "title": "Good Life Or Good Image?", "sub": "5 simple lessons you can start this week.", "summary": "This lesson asks whether you're living a good life or just keeping up a good image. Authenticity is what keeps your image honest, and you lose it when you keep defending beliefs you no longer hold. Keep developing, and let your life match what you show.", "close": "A good image can impress people. A good life changes them.", "safety": "", "lessons": [{"t": "Check The Gap", "b": "Compare what people see with what's really going on. The gap shows where to work.", "tags": ["Public you", "Private you", "Close the gap"], "k": "Image fades, life lasts."}, {"t": "Lead With Authenticity", "b": "Authenticity keeps your image balanced and honest.", "tags": ["Admit mistakes", "Show the real you", "Skip the filter"], "k": "Real beats perfect."}, {"t": "Update Old Beliefs", "b": "You lose authenticity when you defend beliefs you no longer hold. Let them go.", "tags": ["What changed?", "Say it out loud", "Act on it"], "k": "Grow past old opinions."}, {"t": "Keep Developing", "b": "A good life is a growing life. Keep learning and improving.", "tags": ["Read", "Reflect", "Practice"], "k": "Growth is the good life."}, {"t": "Live What You Post", "b": "Before you share, ask: is this true of my life, or only my image?", "tags": ["Pause before posting", "Be honest", "Live it first"], "k": "Be it before you show it."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> write one gap between your image and your real life", "<b>This week:<\/b> drop one belief you no longer hold", "<b>Daily:<\/b> one small act of growth", "<b>Before posting:<\/b> ask if it's true of your life"]}, "article": null, "cards": ["img/mx-good-life-image/01.jpg", "img/mx-good-life-image/02.jpg", "img/mx-good-life-image/03.jpg", "img/mx-good-life-image/04.jpg", "img/mx-good-life-image/05.jpg"], "added": 5985}, {"id": "mx-stay-focused", "topic": "Mental peace", "title": "Stay Focused When Things Fall Apart", "sub": "5 simple lessons you can start this week.", "summary": "When everything seems to fall apart, great leaders focus on what they can control and let go of the rest. Pressure reveals who they are, and when the future is unclear they get certain about the next step.", "close": "You don't need to see the whole road. You need to take the next step well.", "safety": "", "lessons": [{"t": "Control The Controllable", "b": "Focus on what you can control and let go of the rest.", "tags": ["List what you control", "Cross out the rest", "Act"], "k": "Energy goes where focus flows."}, {"t": "Let Pressure Reveal You", "b": "Pressure shows who you really are. Use it to see what to strengthen.", "tags": ["Notice your reaction", "Learn from it", "Grow"], "k": "Pressure is a mirror."}, {"t": "Be Sure Of The Next Step", "b": "When the future is foggy, get certain about the next step only.", "tags": ["One next step", "Do it today", "Then the next"], "k": "Clarity comes from motion."}, {"t": "Stay Calm For Others", "b": "People take their cues from you. Your calm steadies them.", "tags": ["Slow your voice", "Breathe", "Reassure"], "k": "Calm is contagious."}, {"t": "Protect Your Routine", "b": "When life is chaotic, keep a few daily anchors in place.", "tags": ["Sleep", "Move", "Plan your day"], "k": "Routines hold you steady."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Right now:<\/b> write what you can and can't control", "<b>Today:<\/b> take just the next step", "<b>Daily:<\/b> keep three anchors: sleep, movement, planning", "<b>In hard moments:<\/b> slow down and steady the people around you"]}, "article": null, "cards": ["img/mx-stay-focused/01.jpg", "img/mx-stay-focused/02.jpg", "img/mx-stay-focused/03.jpg", "img/mx-stay-focused/04.jpg", "img/mx-stay-focused/05.jpg"], "added": 5984}, {"id": "mx-reproduce", "topic": "Relationships", "title": "People Copy What You Do", "sub": "5 simple lessons you can start this week.", "summary": "This lesson explains that people become what they observe. Leaders reproduce who they are, not what they say, so leading yourself with authenticity and consistency every day, and modeling growth and resilience, shapes everyone close to you.", "close": "Your life is a lesson someone is already learning. Make it a good one.", "safety": "", "lessons": [{"t": "Lead Yourself First", "b": "Leading yourself with authenticity and consistency is a daily challenge, and the first job.", "tags": ["Keep promises", "Same every day", "Own it"], "k": "Lead you before them."}, {"t": "Model The Growth", "b": "Show growth and resilience, and the people around you mirror it.", "tags": ["Learn in public", "Bounce back", "Share lessons"], "k": "Example beats advice."}, {"t": "Mind Who's Watching", "b": "People become what they observe. Kids, teams and friends copy your habits.", "tags": ["Your words", "Your tone", "Your habits"], "k": "Someone is always watching."}, {"t": "Stay Close", "b": "Proximity matters. Spend time near the people you want to grow.", "tags": ["Invite them in", "Work side by side", "Be available"], "k": "Closeness creates change."}, {"t": "Choose Your Circle", "b": "It works both ways. You become like the people you spend time with.", "tags": ["Who inspires you?", "Spend time there", "Learn by watching"], "k": "Choose who you copy."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> notice one habit someone close to you has copied from you", "<b>Daily:<\/b> keep one promise to yourself", "<b>This week:<\/b> work side by side with someone you're helping grow", "<b>Monthly:<\/b> spend time with one person you want to learn from"]}, "article": null, "cards": ["img/mx-reproduce/01.jpg", "img/mx-reproduce/02.jpg", "img/mx-reproduce/03.jpg", "img/mx-reproduce/04.jpg", "img/mx-reproduce/05.jpg"], "added": 5983}, {"id": "hp-conti-mental-health", "topic": "Mental peace", "title": "Ask What's Going Right", "sub": "6 simple lessons you can start this week.", "summary": "Psychiatrist Dr. Paul Conti argues that there is far more going right in most people than going wrong. Mental health improves when you start from your strengths, look at yourself with compassionate curiosity instead of criticism, notice your self-talk, check the story you tell about your life, and balance doing with reflecting.", "close": "Mental health isn't only about fixing what's broken. It's about growing what's already working.", "safety": "If you're struggling, please reach out to a mental health professional.", "lessons": [{"t": "Start With Strengths", "b": "There is far more going right in you than wrong. Begin there, not with your flaws.", "tags": ["List 5 strengths", "Read them daily", "Build from them"], "k": "Strengths first, problems second."}, {"t": "Be Curious, Not Critical", "b": "Look at your moods and patterns with compassionate curiosity, the way a kind friend would.", "tags": ["Ask why, gently", "Spot patterns", "No self-blame"], "k": "Curiosity heals, criticism hurts."}, {"t": "Hear Your Self-Talk", "b": "Notice what you repeat to yourself in quiet moments. Is it true?", "tags": ["Catch the phrase", "Write it down", "Check the facts"], "k": "Your inner voice can be wrong."}, {"t": "Check Your Life Story", "b": "Look at the story you tell about yourself. Does it fit the life you actually have?", "tags": ["Write your story", "Find the gaps", "Rewrite one line"], "k": "You can edit your story."}, {"t": "Balance Doing And Thinking", "b": "Too much reflecting or too much doing both cause problems. Find your mix.", "tags": ["Act on one idea", "Reflect 10 minutes", "Adjust weekly"], "k": "Think, then do, then think."}, {"t": "Think First, Then Ask", "b": "Get outside feedback, but form your own view first so you don't lose yourself.", "tags": ["Decide alone first", "Then ask one person", "Weigh it"], "k": "Your mind first, others second."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> write five things going right in your life", "<b>When upset:<\/b> ask yourself 'why?' with kindness, not blame", "<b>This week:<\/b> catch one repeated self-talk line and check it against the facts", "<b>Monthly:<\/b> rewrite one line of your life story"]}, "article": null, "cards": ["img/hp-conti-mental-health/01.jpg", "img/hp-conti-mental-health/02.jpg", "img/hp-conti-mental-health/03.jpg", "img/hp-conti-mental-health/04.jpg", "img/hp-conti-mental-health/05.jpg"], "added": 4991}, {"id": "rs-micro-improvements", "topic": "Growth & discipline", "title": "Win With Tiny Improvements", "sub": "5 simple lessons you can start this week.", "summary": "Golf champion Bryson DeChambeau talks about curiosity and constant improvement, the power of tiny daily gains, changing perspective to improve your life, using movement to think and feel better, handling criticism with humility, and carrying on through grief and setbacks.", "close": "You don't need a breakthrough. You need a hundred small improvements, one day at a time.", "safety": "", "lessons": [{"t": "Get 1% Better", "b": "Small improvements, stacked daily, add up to big results over time.", "tags": ["One tiny fix", "Every day", "Track it"], "k": "Small gains compound."}, {"t": "Stay Curious", "b": "Keep asking how things work and how you could do them better.", "tags": ["Ask 'why?'", "Test ideas", "Learn from data"], "k": "Curiosity fuels growth."}, {"t": "Change Your Lens", "b": "Shifting how you see a problem can change how your whole life feels.", "tags": ["Reframe it", "See the lesson", "Find the chance"], "k": "New view, new life."}, {"t": "Move To Feel Better", "b": "Movement helps you think more clearly and feel better.", "tags": ["Walk", "Stretch", "Train"], "k": "Move the body, clear the mind."}, {"t": "Take Criticism Humbly", "b": "Use criticism and frustration as fuel. Stay humble and keep improving.", "tags": ["Listen", "Take what's useful", "Drop the rest"], "k": "Humility keeps you learning."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> pick one tiny thing to improve", "<b>Daily:<\/b> track it in one line", "<b>When stuck:<\/b> take a walk, then look at the problem again", "<b>Weekly:<\/b> ask someone for honest feedback"]}, "article": null, "cards": ["img/rs-micro-improvements/01.jpg", "img/rs-micro-improvements/02.jpg", "img/rs-micro-improvements/03.jpg", "img/rs-micro-improvements/04.jpg", "img/rs-micro-improvements/05.jpg"], "added": 4990}, {"id": "mx-self-awareness", "topic": "Relationships", "title": "Know Yourself, Lead Better", "sub": "5 simple lessons you can start this week.", "summary": "This lesson explains why self-awareness and emotional intelligence give leaders an edge. Practical tips include seeking candid feedback and recognizing your emotional triggers through regular reflection.", "close": "You can't lead others well until you know how you lead yourself.", "safety": "", "lessons": [{"t": "Ask For Candid Feedback", "b": "You can't see yourself fully. Ask people you trust what it's like to work with you.", "tags": ["Ask one person", "Listen fully", "Say thank you"], "k": "Feedback is a mirror."}, {"t": "Know Your Triggers", "b": "Notice which situations make you react badly. Awareness gives you a choice.", "tags": ["Name the trigger", "Notice your body", "Pause"], "k": "Spot it before it spins you."}, {"t": "Reflect Every Day", "b": "A few minutes of reflection each day shows patterns you'd otherwise miss.", "tags": ["5 minutes", "What went well?", "What upset me?"], "k": "Reflection builds awareness."}, {"t": "Read The Room", "b": "Emotional intelligence means noticing how others feel, not just what they say.", "tags": ["Watch faces", "Ask how they are", "Adjust your tone"], "k": "Lead people, not tasks."}, {"t": "Respond, Don't React", "b": "Between what happens and what you do, there's a pause. Use it.", "tags": ["Breathe", "Count to five", "Then speak"], "k": "The pause is your power."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>This week:<\/b> ask one trusted person for candid feedback", "<b>Daily:<\/b> five minutes of reflection before bed", "<b>In tense moments:<\/b> pause, breathe, then respond", "<b>Monthly:<\/b> list your top three triggers and how you'll handle them"]}, "article": null, "cards": ["img/mx-self-awareness/01.jpg", "img/mx-self-awareness/02.jpg", "img/mx-self-awareness/03.jpg", "img/mx-self-awareness/04.jpg", "img/mx-self-awareness/05.jpg"], "added": 4989}, {"id": "mx-busy-vs-effective", "topic": "Growth & discipline", "title": "Busy Isn't Effective", "sub": "5 simple lessons you can start this week.", "summary": "This lesson looks at why being busy isn't the same as being effective, and how to turn meetings and collaboration into clear, actionable steps.", "close": "Busy feels productive. Effective actually is. The difference is choosing what matters.", "safety": "", "lessons": [{"t": "Measure Results, Not Hours", "b": "Ask what you finished today, not how busy you were.", "tags": ["3 outcomes", "Not tasks", "Review at night"], "k": "Progress beats busyness."}, {"t": "Cut Useless Meetings", "b": "Every meeting needs a purpose. If it doesn't have one, skip it or shorten it.", "tags": ["Clear goal", "Short agenda", "Fewer people"], "k": "No purpose, no meeting."}, {"t": "End With Next Steps", "b": "Close every meeting or conversation with who does what, by when.", "tags": ["Who?", "What?", "By when?"], "k": "Talk turns into action."}, {"t": "Protect Focus Time", "b": "Block time for your most important work before the day fills up.", "tags": ["Block 2 hours", "Phone away", "Defend it"], "k": "Guard your best hours."}, {"t": "Say No More Often", "b": "Every yes to something small is a no to something important.", "tags": ["Pause before yes", "Check priorities", "Decline kindly"], "k": "No is a productivity tool."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Tonight:<\/b> write tomorrow's three outcomes", "<b>Each meeting:<\/b> end with who, what, by when", "<b>Every morning:<\/b> block two focus hours", "<b>This week:<\/b> say no to one thing that doesn't matter"]}, "article": null, "cards": ["img/mx-busy-vs-effective/01.jpg", "img/mx-busy-vs-effective/02.jpg", "img/mx-busy-vs-effective/03.jpg", "img/mx-busy-vs-effective/04.jpg", "img/mx-busy-vs-effective/05.jpg"], "added": 4988}, {"id": "hp-jocko-resilience", "topic": "Growth & discipline", "title": "Become Unbreakable", "sub": "6 simple lessons you can start this week.", "summary": "Former Navy SEAL commander Jocko Willink explains that who you become is built by daily routines, not moods. He talks about early training, treating today's actions as investments in the next few years, detaching from a situation to see it clearly, and how discomfort on purpose builds mental resilience.", "close": "Discipline isn't about being harsh with yourself. It's about choosing who you'll be, again every morning.", "safety": "", "lessons": [{"t": "Win The Morning", "b": "Daily workouts and early starts are how discipline becomes part of who you are.", "tags": ["Set the alarm", "Train first", "No snooze"], "k": "Routine builds identity."}, {"t": "Invest, Don't Withdraw", "b": "Ask whether what you do now helps the next 2–5 years, not just the next hour.", "tags": ["Skip the junk", "Do the reps", "Think in years"], "k": "Today pays tomorrow."}, {"t": "Step Back And Detach", "b": "When things get heated, mentally step back and look at the situation from above. New options appear.", "tags": ["Pause", "Zoom out", "Then decide"], "k": "Distance brings clarity."}, {"t": "Learn From Wins And Losses", "b": "After a win, review what worked. After a loss, admit it, learn and refocus.", "tags": ["Quick debrief", "Own the mistake", "Next move"], "k": "Every result is a lesson."}, {"t": "Choose Hard On Purpose", "b": "Deliberate discomfort, like cold exposure or tough training, trains your mind to stay calm under stress.", "tags": ["Cold shower", "Hard workout", "Ask a doctor first"], "k": "Discomfort builds resilience."}, {"t": "Restore With People And Play", "b": "When motivation is low, social connection and play help bring it back.", "tags": ["Call a friend", "Play a sport", "Family time"], "k": "Recharge, then go again."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Tomorrow:<\/b> train before anything else", "<b>Each decision:<\/b> ask: investment or withdrawal?", "<b>When stressed:<\/b> step back and look from above", "<b>Weekly:<\/b> one deliberately hard thing, plus time to play"]}, "article": null, "cards": ["img/hp-jocko-resilience/01.jpg", "img/hp-jocko-resilience/02.jpg", "img/hp-jocko-resilience/03.jpg", "img/hp-jocko-resilience/04.jpg", "img/hp-jocko-resilience/05.jpg"], "added": 3996}, {"id": "rs-mel-robbins", "topic": "Mindset & motivation", "title": "Make The Next 10 Years Your Best", "sub": "6 simple lessons you can start this week.", "summary": "Mel Robbins talks about why people feel stuck and how to move forward: stop trying to control other people, picture what you actually want, use the 5-second rule to beat procrastination, and build joy and better habits into ordinary days.", "close": "You don't need a new life to change your life. You need a new way of moving through the one you have.", "safety": "", "lessons": [{"t": "Let Them", "b": "Stop trying to control what other people think or do. Let them, and put your energy into you.", "tags": ["Let them judge", "Let them leave", "Focus on you"], "k": "Your energy is yours to spend."}, {"t": "See What You Want", "b": "Picture the life you want clearly, then take one action toward it.", "tags": ["Write it down", "Picture it daily", "One step today"], "k": "Clarity first, then action."}, {"t": "Count 5-4-3-2-1", "b": "When you hesitate, count down from five and move before your brain talks you out of it.", "tags": ["Get out of bed", "Send the message", "Start the task"], "k": "Move before the doubt wins."}, {"t": "Do The Hard Thing", "b": "Procrastination is about feelings, not laziness. Start the hard thing anyway.", "tags": ["Smallest first step", "5 minutes", "Keep going"], "k": "Action beats motivation."}, {"t": "Find Daily Joy", "b": "Joy and gratitude are habits you can build into ordinary days.", "tags": ["3 good things", "Notice small wins", "Say thank you"], "k": "Joy is practiced, not found."}, {"t": "Mind Your Energy", "b": "The energy you bring shapes your relationships. Bring the energy you want back.", "tags": ["Check your tone", "Listen more", "Lead with warmth"], "k": "Energy is contagious."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> write what you want your life to look like in 10 years", "<b>Every hesitation:<\/b> 5-4-3-2-1 and move", "<b>Nightly:<\/b> write three good things from the day", "<b>When others frustrate you:<\/b> let them, and refocus on you"]}, "article": null, "cards": ["img/rs-mel-robbins/01.jpg", "img/rs-mel-robbins/02.jpg", "img/rs-mel-robbins/03.jpg", "img/rs-mel-robbins/04.jpg", "img/rs-mel-robbins/05.jpg"], "added": 3995}, {"id": "rs-unbreakable-mind", "topic": "Growth & discipline", "title": "Build An Unbreakable Mind", "sub": "5 simple lessons you can start this week.", "summary": "Ultrarunner Ayyoub 'Ello' El Osrouti went from barely running to elite backyard ultras in about four years. He talks about radical self-belief, the mental battle when the body wants to quit, learning from people like David Goggins, and the steady training that makes the impossible possible.", "close": "Limits are often stories we tell ourselves. Change the story, then do the work to prove it.", "safety": "", "lessons": [{"t": "Believe Before It's Real", "b": "He believed he could be elite before there was proof. That belief got him started.", "tags": ["Set the big goal", "Say it to yourself", "Act like it"], "k": "Belief comes before proof."}, {"t": "Win The Mind First", "b": "In long races the body wants to stop long before it has to. The mind decides.", "tags": ["Notice the quit voice", "Answer it", "One more step"], "k": "The mind quits before the body."}, {"t": "Break It Into Loops", "b": "Backyard ultras are run one loop at a time. Big goals work the same way.", "tags": ["Next hour only", "Next rep only", "Then repeat"], "k": "One loop at a time."}, {"t": "Borrow A Model", "b": "Learning from people who did the hard thing first, like David Goggins, changed his path.", "tags": ["Find a role model", "Study them", "Copy the habits"], "k": "Someone already proved it's possible."}, {"t": "Train Every Week", "b": "Elite results come from a steady weekly routine of running and strength work.", "tags": ["Plan the week", "Strength too", "Rest days count"], "k": "Consistency builds limits you can break."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> write one goal that scares you", "<b>When it gets hard:<\/b> focus only on the next loop", "<b>This week:<\/b> plan your training or practice days", "<b>Monthly:<\/b> study one person who did what you want to do"]}, "article": null, "cards": ["img/rs-unbreakable-mind/01.jpg", "img/rs-unbreakable-mind/02.jpg", "img/rs-unbreakable-mind/03.jpg", "img/rs-unbreakable-mind/04.jpg", "img/rs-unbreakable-mind/05.jpg"], "added": 3994}, {"id": "mx-resilience", "topic": "Growth & discipline", "title": "Hard Times Make Strong People", "sub": "5 simple lessons you can start this week.", "summary": "Mark Cole and Traci Morrow unpack the teaching on resilience. Great achievements come out of struggle. Hard times won't get easier, but pushing through is worth it. And if you don't create the future you want, you'll have to live with the future you get.", "close": "Resilience isn't about never falling. It's about deciding, every time, that the fall is not the end of the story.", "safety": "", "lessons": [{"t": "Expect The Struggle", "b": "Great successes come out of struggle. The hard part is part of the path, not a detour.", "tags": ["Name the struggle", "Don't panic", "Keep moving"], "k": "Struggle comes before success."}, {"t": "It Won't Get Easier", "b": "Hardship rarely gets easier, but pushing through it is worth it.", "tags": ["Accept it", "Stop waiting", "Start anyway"], "k": "Hard, but worth it."}, {"t": "Create Your Future", "b": "If you don't create the future you want, you'll have to endure the future you get.", "tags": ["Write your future", "Plan this week", "Act today"], "k": "Build it or live with it."}, {"t": "Lean On Your Team", "b": "Resilient leaders don't carry it alone. They share the load and lift others up.", "tags": ["Ask for help", "Check on others", "Share the win"], "k": "Strong together."}, {"t": "Bounce Forward", "b": "After a setback, ask what it taught you and what you'll do next.", "tags": ["What happened?", "What did I learn?", "What's next?"], "k": "Setbacks set up comebacks."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> name the struggle you're in and what it could teach you", "<b>This week:<\/b> write the future you want and one step toward it", "<b>After any setback:<\/b> answer: what happened, what did I learn, what's next", "<b>Weekly:<\/b> check in on one person on your team"]}, "article": null, "cards": ["img/mx-resilience/01.jpg", "img/mx-resilience/02.jpg", "img/mx-resilience/03.jpg", "img/mx-resilience/04.jpg", "img/mx-resilience/05.jpg"], "added": 3993}, {"id": "mx-character", "topic": "Growth & discipline", "title": "Talent Is A Gift. Character Is A Choice", "sub": "5 simple lessons you can start this week.", "summary": "Mark Cole and Chris Goede discuss the idea that talent is a gift, but character is a choice. Real growth starts on the inside and shows up on the outside, and clear values give you stability when life gets shaky.", "close": "Talent might open the door. Character is what keeps you in the room.", "safety": "", "lessons": [{"t": "Grow On The Inside", "b": "Improve who you are inside, and it will show up in what you do outside.", "tags": ["Read daily", "Reflect", "Be honest"], "k": "Inside growth, outside results."}, {"t": "Name Your Values", "b": "Clear values give you stability when life gets shaky.", "tags": ["Pick 3 values", "Write them down", "Decide with them"], "k": "Values keep you steady."}, {"t": "Choose Character Daily", "b": "Talent is given. Character is chosen in small moments every day.", "tags": ["Keep promises", "Tell the truth", "Do the right thing"], "k": "Small choices build character."}, {"t": "Be The Same Everywhere", "b": "A winner's character is the same in private as in public.", "tags": ["At home", "At work", "When no one's watching"], "k": "Consistency is credibility."}, {"t": "Review Your Week", "b": "Look back each week at where you lived your values and where you slipped.", "tags": ["Sunday review", "One win", "One fix"], "k": "What gets reviewed gets better."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> write your three core values", "<b>Every decision:<\/b> check it against your values", "<b>Daily:<\/b> keep one small promise to yourself", "<b>Sunday:<\/b> one value you lived, one you'll fix"]}, "article": null, "cards": ["img/mx-character/01.jpg", "img/mx-character/02.jpg", "img/mx-character/03.jpg", "img/mx-character/04.jpg", "img/mx-character/05.jpg"], "added": 3992}, {"id": "hp-dopamine", "topic": "Mindset & motivation", "title": "Fix Your Dopamine", "sub": "6 simple lessons you can start this week.", "summary": "Dopamine sets your drive. What matters is not only how high it spikes but where your baseline sits. Stack too many highs and the baseline drops, so ordinary life feels flat. The fix is to protect the baseline and learn to enjoy effort itself.", "close": "Motivation isn't a mystery chemical you either have or don't. It follows rules, and once you know them you can work with them.", "safety": "", "lessons": [{"t": "Watch Your Baseline", "b": "Every spike is measured against your baseline. Too many spikes and the baseline sinks.", "tags": ["Notice the crash", "Fewer highs", "Steadier days"], "k": "Peaks cost you later."}, {"t": "Stop Stacking Highs", "b": "Music, phone, caffeine and snacks all at once? Strip it back to one at a time.", "tags": ["Train without music sometimes", "One booster max", "Not every day"], "k": "Less stacking, more lasting drive."}, {"t": "Make Rewards Unpredictable", "b": "Rewarding yourself every time weakens the effect. Random rewards keep motivation strong.", "tags": ["Flip a coin", "Skip some treats", "Surprise yourself"], "k": "Random beats routine for rewards."}, {"t": "Learn To Love The Effort", "b": "Tell yourself the struggle is the good part. Effort itself can become the reward.", "tags": ["Say it out loud", "Notice the strain", "Stay with it"], "k": "Effort is the reward."}, {"t": "Phone Away While You Work", "b": "Checking your phone during work or workouts drains the dopamine meant for the task.", "tags": ["Another room", "Do not disturb", "Check after"], "k": "One source of dopamine at a time."}, {"t": "Use Cold Water, Early", "b": "Cold water exposure can raise dopamine for hours. Do it early in the day and carefully.", "tags": ["Cool shower", "Start short", "Ask a doctor first"], "k": "Hard on purpose, lifted after."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> work with your phone in another room", "<b>This week:<\/b> drop one stacked booster from workouts or study", "<b>Every session:<\/b> tell yourself the effort is the good part", "<b>Optional:<\/b> a short cool shower in the morning, if your doctor says it's fine"]}, "article": null, "cards": ["img/hp-dopamine/01.jpg", "img/hp-dopamine/02.jpg", "img/hp-dopamine/03.jpg", "img/hp-dopamine/04.jpg", "img/hp-dopamine/05.jpg"], "added": 3000}, {"id": "hp-habits", "topic": "Growth & discipline", "title": "Build Habits That Stick", "sub": "6 simple lessons you can start this week.", "summary": "Habits are built by the brain's wiring for repeated actions, not by willpower alone. Here is a simple system: picture the steps, place hard habits early in the day, test new habits for 21 days and replace bad habits instead of just stopping them.", "close": "Habits aren't about being a different person. They're about setting things up so the right action is the easy one.", "safety": "", "lessons": [{"t": "Rehearse It In Your Head", "b": "Before you start, mentally walk through every step of the habit. It makes starting easier.", "tags": ["Close your eyes", "Every step", "Then do it"], "k": "See it, then do it."}, {"t": "Hard Habits Go First", "b": "In the first hours after waking, energy is high. Put the hardest habits there.", "tags": ["Exercise", "Deep work", "Cold shower"], "k": "Morning for the hard stuff."}, {"t": "Easy Habits Go Later", "b": "Later in the day, schedule lower-effort habits. At night, protect sleep.", "tags": ["Journaling", "Reading", "Lights down"], "k": "Match the habit to your energy."}, {"t": "Mark The Start And End", "b": "Bracket each habit with a clear start and finish. Your brain links the steps together.", "tags": ["Same cue", "Same order", "Clear finish"], "k": "Brackets make habits automatic."}, {"t": "Run A 21-Day Test", "b": "List up to six new habits. Aim to hit four or five a day, then keep the ones that stuck.", "tags": ["Write 6 habits", "Hit 4–5 daily", "Review on day 21"], "k": "Test, don't force."}, {"t": "Replace, Don't Just Quit", "b": "Right after a bad habit slips in, do a good one. You rewire the chain.", "tags": ["Spot the slip", "Do 10 push-ups", "Or a deep breath"], "k": "Swap the habit, keep the cue."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Day 1:<\/b> write six habits you want and when each belongs", "<b>Days 1–21:<\/b> hit four or five a day; don't chase perfect", "<b>After a slip:<\/b> do one small good action right away", "<b>Day 21:<\/b> keep what stuck, adjust what didn't"]}, "article": null, "cards": ["img/hp-habits/01.jpg", "img/hp-habits/02.jpg", "img/hp-habits/03.jpg", "img/hp-habits/04.jpg", "img/hp-habits/05.jpg"], "added": 2999}, {"id": "hp-goals", "topic": "Growth & discipline", "title": "Hit Your Big Goals", "sub": "6 simple lessons you can start this week.", "summary": "Big goals work when they're specific, measurable and run in short cycles. The toolkit: pick one priority, define it with action verbs, work in 12-week blocks, keep it mostly private, and use tricks like visual focus and time chunks to get through the hard middle.", "close": "Goals don't need more hype. They need clearer definitions, shorter cycles and a plan for the boring middle.", "safety": "", "lessons": [{"t": "Pick One Priority", "b": "One goal at the top. Everything else comes second.", "tags": ["Write it down", "Just one", "Make it big"], "k": "One goal gets your full brain."}, {"t": "Use Action Verbs", "b": "Make the goal specific and measurable. What exactly will you do, and how much?", "tags": ["Run 3x a week", "Write 500 words", "Not just 'get fit'"], "k": "Vague goals stay dreams."}, {"t": "Work In 12-Week Cycles", "b": "Set weekly and daily hour targets inside a 12-week block, then review.", "tags": ["12 weeks", "Weekly hours", "Review at the end"], "k": "Short cycles, steady wins."}, {"t": "Keep It Private", "b": "Telling the world can feel like you already did it. Share only what others need to know.", "tags": ["Tell a coach", "Not social media", "Let results talk"], "k": "Talk less, do more."}, {"t": "Lock Your Eyes On A Target", "b": "Before working, hold your gaze on one point for 30–90 seconds to switch on focus.", "tags": ["Pick a spot", "Hold your gaze", "Then start"], "k": "Focused eyes, focused mind."}, {"t": "Chunk The Middle", "b": "Motivation dips in the middle of any goal. Break it into small time chunks.", "tags": ["25-minute blocks", "Next block only", "Tick it off"], "k": "The middle is where goals die. Chunk it."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Today:<\/b> choose one priority goal and rewrite it with an action verb and a number", "<b>This week:<\/b> set your weekly hour target for a 12-week cycle", "<b>Each session:<\/b> 30–90 seconds of visual focus, then a 25-minute block", "<b>Week 12:<\/b> review, celebrate, set the next cycle"]}, "article": null, "cards": ["img/hp-goals/01.jpg", "img/hp-goals/02.jpg", "img/hp-goals/03.jpg", "img/hp-goals/04.jpg", "img/hp-goals/05.jpg"], "added": 2998}, {"id": "hp-learn-faster", "topic": "Growth & discipline", "title": "Fail Your Way To Learning Faster", "sub": "5 simple lessons you can start this week.", "summary": "Your brain changes most when you make mistakes, not when everything flows. Frustration is a signal that learning is happening. Short, error-heavy practice, done alert but calm, speeds up learning at any age.", "close": "Learning feels bad in the moment and good in hindsight. Once you know frustration is the signal, it gets easier to stay.", "safety": "", "lessons": [{"t": "Welcome Your Errors", "b": "Mistakes tell your brain something needs to change. That's when it rewires.", "tags": ["Practice the hard part", "Count your errors", "Don't avoid them"], "k": "Errors open the door to change."}, {"t": "Follow The Frustration", "b": "Frustration isn't a sign to quit. It's the feeling of learning in progress.", "tags": ["Stay 2 more minutes", "Breathe", "Try again"], "k": "Frustration means it's working."}, {"t": "Practice In Short Bursts", "b": "Short, focused sessions full of attempts beat long, comfortable ones.", "tags": ["7–30 minutes", "1–3 times a day", "Many reps"], "k": "Short and hard beats long and easy."}, {"t": "Be Alert But Calm", "b": "Anxious? Use a physiological sigh. Tired? Rest or take a nap first.", "tags": ["Two inhales, long exhale", "Short nap", "Then practice"], "k": "Calm focus learns fastest."}, {"t": "Add Something New", "b": "Novelty and a little instability, like balance work, help the brain stay ready to change.", "tags": ["Balance on one foot", "New route", "New skill"], "k": "New input, new wiring."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Pick:<\/b> one skill you want to get better at", "<b>Daily:<\/b> one to three short sessions of 7–30 minutes aimed at the hard parts", "<b>Before each:<\/b> a physiological sigh if you're anxious, rest if you're tired", "<b>Weekly:<\/b> add one new challenge or balance drill"]}, "article": null, "cards": ["img/hp-learn-faster/01.jpg", "img/hp-learn-faster/02.jpg", "img/hp-learn-faster/03.jpg", "img/hp-learn-faster/04.jpg", "img/hp-learn-faster/05.jpg"], "added": 2997}, {"id": "hp-happiness-brooks", "topic": "Mental peace", "title": "Happiness Has 3 Ingredients", "sub": "6 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Check Your 3 Macros", "b": "Happiness is built from enjoyment, satisfaction and meaning. When you feel off, one is usually missing.", "tags": ["Rate each 1–10", "Every Sunday", "Fix the lowest"], "k": "Diagnose before you fix."}, {"t": "Turn Pleasure Into Enjoyment", "b": "Pleasure alone fades fast. Add people and memory, and it becomes enjoyment.", "tags": ["Share the meal", "No phone", "Talk about it after"], "k": "Pleasure + people + memory."}, {"t": "Earn Your Satisfaction", "b": "Satisfaction is the joy that comes after effort. No struggle, no satisfaction.", "tags": ["Pick one hard goal", "Work on it daily", "Celebrate the finish"], "k": "The struggle is the point."}, {"t": "Name Your Idol", "b": "Money, power, pleasure and fame are the four idols. Chasing them leaves you always wanting more.", "tags": ["Which one pulls you?", "Write it down", "Notice the pull"], "k": "Seen idols lose their grip."}, {"t": "Use Leisure Well", "b": "Real leisure reflects your values. Endless scrolling is not rest.", "tags": ["Walk", "Read", "Time with people"], "k": "Rest that refills you, not numbs you."}, {"t": "Ask The Meaning Questions", "b": "Meaning comes from coherence, purpose and significance in your life.", "tags": ["Why does this happen?", "Where am I going?", "Why does it matter?"], "k": "Answer them on paper, once a month."}], "plan": {"title": "Your one-week plan", "items": ["<b>Sunday:<\/b> rate your three macros.", "<b>Monday to Saturday:<\/b> one shared, phone-free meal; 20 minutes on your hard goal.", "<b>Saturday:<\/b> notice which idol pulled at you this week.", "<b>End of month:<\/b> answer the three meaning questions."]}, "article": {"title": "Happiness Has 3 Ingredients", "sub": "6 lessons, made practical", "html": "<p>Most of us treat happiness like the weather. Some days it shows up, some days it doesn't, and we hope for sunshine. Harvard and Vanderbilt professor Arthur Brooks offers a more useful idea: happiness is less a feeling you wait for and more a diet you manage.<\/p>\n<h3>The three \"macronutrients\"<\/h3>\n<p>Brooks breaks happiness into three parts: <b>enjoyment<\/b>, <b>satisfaction<\/b> and <b>meaning<\/b>. Like protein, fat and carbs, you need all three. When life feels flat, it is usually because one of them has dropped to near zero.<\/p>\n<p><b>Step 1: Check your macros.<\/b> Every Sunday, rate each one from 1 to 10. Don't try to fix everything. Fix the lowest number first.<\/p>\n<h3>Enjoyment is pleasure, upgraded<\/h3>\n<p>Pleasure on its own fades fast, and chasing it alone tends to leave us emptier. Enjoyment is pleasure plus two things: other people and memory.<\/p>\n<p><b>Step 2: Turn pleasure into enjoyment.<\/b> Share the meal instead of eating at your desk. Put the phone away. Afterwards, talk about it. The memory is part of the reward.<\/p>\n<h3>Satisfaction needs struggle<\/h3>\n<p>Satisfaction is the joy that comes <i>after<\/i> effort. That means you can't get it by avoiding hard things.<\/p>\n<p><b>Step 3: Earn it.<\/b> Pick one goal that is genuinely difficult for you, work on it a little every day, and mark the finish when you get there.<\/p>\n<h3>Watch out for the four idols<\/h3>\n<p>Brooks names four things people chase that never deliver lasting happiness: <b>money, power, pleasure and fame<\/b>. They are not evil, but they are bottomless. There is always more to want.<\/p>\n<p><b>Step 4: Name your idol.<\/b> Ask which one pulls hardest on you. Write it down. Just seeing the pull clearly weakens it.<\/p>\n<h3>Leisure is not the same as numbness<\/h3>\n<p>Real leisure reflects what you value. Hours of scrolling feel like rest, but rarely refill you.<\/p>\n<p><b>Step 5: Use leisure well.<\/b> Swap one scroll session a day for a walk, a book or time with someone you love.<\/p>\n<h3>Meaning comes from three questions<\/h3>\n<p>Meaning grows when your life has coherence (it makes sense), purpose (it points somewhere) and significance (it matters).<\/p>\n<p><b>Step 6: Ask the meaning questions once a month, on paper.<\/b> Why are things happening the way they are? Where am I going? Why does it matter?<\/p>\n<h3>Your one-week plan<\/h3>\n<ul>\n<li><b>Sunday:<\/b> rate your three macros.<\/li>\n<li><b>Monday to Saturday:<\/b> one shared, phone-free meal; 20 minutes on your hard goal.<\/li>\n<li><b>Saturday:<\/b> notice which idol pulled at you this week.<\/li>\n<li><b>End of month:<\/b> answer the three meaning questions.<\/li>\n<\/ul>\n<p>Happiness won't arrive all at once. But managed like a diet, it gets steadier week by week.<\/p>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/hp-happiness-brooks/01.jpg", "img/hp-happiness-brooks/02.jpg", "img/hp-happiness-brooks/03.jpg", "img/hp-happiness-brooks/04.jpg", "img/hp-happiness-brooks/05.jpg"], "added": 1982}, {"id": "hp-slowness-greene", "topic": "Growth & discipline", "title": "Slow Down To Live Fully", "sub": "6 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Practice Self-Remembering", "b": "Several times a day, stop and notice that you are here, noticing. It pulls you out of autopilot.", "tags": ["Set 3 alarms", "Pause 30 seconds", "Feel your feet"], "k": "Wake up inside your own day."}, {"t": "Choose Slowness", "b": "Your phone trains your mind to rush. Slowness is the tool that wins your attention back.", "tags": ["One slow task daily", "Phone out of reach", "No multitasking"], "k": "Slow is how depth happens."}, {"t": "Write By Hand", "b": "Handwriting slows your thinking down, so ideas get clearer and stick longer.", "tags": ["Paper notebook", "One page a day", "Thoughts, not tasks"], "k": "Your hand thinks slower and deeper."}, {"t": "Think Musically", "b": "Notice rhythm and patterns in nature and the world, not just the social noise of people.", "tags": ["Listen closely", "Notice patterns", "Get outside"], "k": "There is more than the human world."}, {"t": "Find Your Life's Task", "b": "Look back at what pulled you in as a child. Your deepest work grows from those inclinations.", "tags": ["List childhood loves", "Spot the pattern", "Do one thing with it"], "k": "Your past points to your purpose."}, {"t": "Feed Your Senses", "b": "Creativity and the sublime come through the senses. Observe before you judge.", "tags": ["Observation walk", "Describe 5 things", "No headphones"], "k": "Look longer than feels normal."}], "plan": {"title": "A simple daily rhythm", "items": ["<b>Morning:<\/b> one page by hand.", "<b>Midday:<\/b> a 30-second self-remembering pause, three times.", "<b>Evening:<\/b> one slow, single-task activity."]}, "article": {"title": "Slow Down To Live Fully", "sub": "6 lessons, made practical", "html": "<p>Robert Greene, author of <i>Mastery<\/i> and <i>The Laws of Human Nature<\/i>, talks about something unexpected: the sublime. That feeling of awe and depth when you are fully present. His argument is that modern life, and especially our phones, trains us out of it. The good news is that it can be trained back in.<\/p>\n<h3>1. Practice self-remembering<\/h3>\n<p>Several times a day, stop and simply notice that you are here, noticing. It sounds small. It is the opposite of autopilot.<\/p>\n<p><b>How:<\/b> set three gentle alarms. When one goes off, pause for 30 seconds and feel your feet on the ground.<\/p>\n<h3>2. Choose slowness on purpose<\/h3>\n<p>Greene names slowness as a tool against the attention loss that comes from constant phone use. Depth needs time.<\/p>\n<p><b>How:<\/b> do one task a day slowly and alone: cooking, reading, a walk. Phone in another room.<\/p>\n<h3>3. Write by hand<\/h3>\n<p>Handwriting slows your thinking, so ideas become clearer and stick longer.<\/p>\n<p><b>How:<\/b> keep a paper notebook. Write one page a day of thoughts, not tasks.<\/p>\n<h3>4. Think musically<\/h3>\n<p>Notice rhythm and pattern in nature and the world around you, not just the social noise of other people's opinions.<\/p>\n<p><b>How:<\/b> go outside without headphones and listen. What repeats? What changes?<\/p>\n<h3>5. Find your life's task<\/h3>\n<p>A core idea from Greene's work: your deepest work grows from what pulled you in as a child, before others told you what to want.<\/p>\n<p><b>How:<\/b> list five things you loved before age 12. Look for the pattern. Do one small thing with it this week.<\/p>\n<h3>6. Feed your senses<\/h3>\n<p>Creativity and the sublime arrive through the senses. Observe before you judge.<\/p>\n<p><b>How:<\/b> take a 10-minute observation walk and describe five things in detail.<\/p>\n<h3>A simple daily rhythm<\/h3>\n<ul>\n<li><b>Morning:<\/b> one page by hand.<\/li>\n<li><b>Midday:<\/b> a 30-second self-remembering pause, three times.<\/li>\n<li><b>Evening:<\/b> one slow, single-task activity.<\/li>\n<\/ul>\n<p>None of this is dramatic. That's the point. A slower day is a deeper day.<\/p>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/hp-slowness-greene/01.jpg", "img/hp-slowness-greene/02.jpg", "img/hp-slowness-greene/03.jpg", "img/hp-slowness-greene/04.jpg", "img/hp-slowness-greene/05.jpg"], "added": 1981}, {"id": "hp-addiction-lembke", "topic": "Mental peace", "title": "Break Free From Any Obsession", "sub": "6 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Know The Seesaw", "b": "Every big hit of pleasure is followed by a dip. Chase the high and the low gets deeper.", "tags": ["Phone", "Sugar", "Shopping", "Porn"], "k": "More pleasure, more pain after."}, {"t": "Take 30 Days Off", "b": "Pause your go-to habit for about a month so your brain can reset its baseline.", "tags": ["Pick one habit", "Mark day 1", "Expect weeks 1–2 to be hard"], "k": "It gets easier after the hard part."}, {"t": "Bind Yourself", "b": "Put space between you and the habit before the craving shows up.", "tags": ["Delete the app", "Lock it away", "Set time limits"], "k": "Make the easy choice the right one."}, {"t": "Tell The Whole Truth", "b": "Radical honesty with yourself and others weakens the secret loop that addiction needs.", "tags": ["No small lies", "Tell one person", "Write it down"], "k": "Secrets feed cravings."}, {"t": "Let Go Of Control", "b": "Trying to control everything can be its own addiction. Surrender what isn't yours to hold.", "tags": ["Name what you can't control", "Breathe", "Release it"], "k": "Surrender is a strength."}, {"t": "Don't Do It Alone", "b": "Support groups, friends and professionals make recovery far more likely.", "tags": ["Find a group", "Call a friend", "See a doctor"], "k": "Connection is the antidote."}], "plan": {"title": "The 30-day plan", "items": ["<b>Week 1:<\/b> remove access, tell one person.", "<b>Week 2:<\/b> ride out the cravings; they peak and pass.", "<b>Weeks 3–4:<\/b> notice what feels better. Decide what role, if any, the habit gets afterward."]}, "article": {"title": "Break Free From Any Obsession", "sub": "6 lessons, made practical", "html": "<p>Dr. Anna Lembke, an addiction psychiatrist at Stanford, talks about addictions of every kind: substances, screens, food, shopping and even something less obvious, the need to control everything. Here is her thinking turned into six steps.<\/p>\n<p>&gt; <b>Safety first:<\/b> if the habit is alcohol, benzodiazepines or other drugs, stopping suddenly can be dangerous. Talk to a doctor before you change anything.<\/p>\n<h3>1. Know the seesaw<\/h3>\n<p>Lembke's best-known idea is that pleasure and pain sit on a seesaw in the brain. Every big hit of pleasure is followed by a dip, and the more we chase the high, the deeper the low becomes.<\/p>\n<p><b>Try:<\/b> name the one habit you reach for when you feel low.<\/p>\n<h3>2. Take about 30 days off<\/h3>\n<p>Lembke often suggests a month-long break from the \"drug of choice\" to let the brain's baseline reset. The first one to two weeks are usually the hardest, and many people feel better after that.<\/p>\n<p><b>Try:<\/b> pick one habit, mark day 1 on a calendar, and expect the early days to be tough.<\/p>\n<h3>3. Bind yourself<\/h3>\n<p>Don't rely on willpower in the moment. Put barriers between you and the habit beforehand.<\/p>\n<p><b>Try:<\/b> delete the app, lock the item away, or set strict time limits.<\/p>\n<h3>4. Tell the whole truth<\/h3>\n<p>Addiction thrives on secrets and small lies. Radical honesty, with yourself and with someone else, breaks the loop.<\/p>\n<p><b>Try:<\/b> tell one trusted person exactly what you're working on.<\/p>\n<h3>5. Let go of control<\/h3>\n<p>Lembke names control itself as a common addiction and discusses surrender: releasing what isn't yours to hold. Spiritual practices such as prayer come up as one way people do this.<\/p>\n<p><b>Try:<\/b> write down three things you can't control this week, and consciously let them go.<\/p>\n<h3>6. Don't do it alone<\/h3>\n<p>Recovery is far more likely with support. Support groups include Al-Anon, Alcoholics Anonymous and Co-Dependents Anonymous.<\/p>\n<p><b>Try:<\/b> find one group, one friend or one professional to check in with weekly.<\/p>\n<h3>The 30-day plan<\/h3>\n<ul>\n<li><b>Week 1:<\/b> remove access, tell one person.<\/li>\n<li><b>Week 2:<\/b> ride out the cravings; they peak and pass.<\/li>\n<li><b>Weeks 3–4:<\/b> notice what feels better. Decide what role, if any, the habit gets afterward.<\/li>\n<\/ul>\n<hr>\n<p><i>For education, not medical advice. Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/hp-addiction-lembke/01.jpg", "img/hp-addiction-lembke/02.jpg", "img/hp-addiction-lembke/03.jpg", "img/hp-addiction-lembke/04.jpg", "img/hp-addiction-lembke/05.jpg"], "added": 1980}, {"id": "hp-extraordinary-diamond", "topic": "Growth & discipline", "title": "Live An Extraordinary Life", "sub": "5 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Follow Your Odd Interests", "b": "Build a career and life around what truly fascinates you, even if it looks unusual.", "tags": ["List 3 obsessions", "Spend 1 hour weekly", "Ignore the script"], "k": "Curiosity is a compass."}, {"t": "Keep Learning Forever", "b": "Learning new things, like a new language, keeps the mind young and sharp.", "tags": ["10 minutes a day", "New words", "New places"], "k": "A learning mind stays young."}, {"t": "Move Your Body Daily", "b": "Staying physically active keeps both mind and body vigorous into old age.", "tags": ["Walk daily", "Take stairs", "Stay outdoors"], "k": "A vigorous body, a vigorous mind."}, {"t": "Find Your Supporters", "b": "Success in any career comes faster with mentors and people who believe in you.", "tags": ["Ask for advice", "Thank a mentor", "Help someone younger"], "k": "No one does it alone."}, {"t": "Judge Yourself Honestly", "b": "Great leaders and nations get through crises by honestly seeing what works and what must change.", "tags": ["What's working?", "What isn't?", "What will I change?"], "k": "Honest review beats blind pride."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Follow Your Odd Interests:<\/b> list your three biggest curiosities. Give one of them an hour this week.", "<b>Keep Learning Forever:<\/b> ten minutes a day on something new: words, a skill, a place.", "<b>Move Your Body Daily:<\/b> a daily walk, stairs instead of lifts, more time outdoors.", "<b>Find Your Supporters:<\/b> ask one person for advice, thank one past mentor, and help one person younger than you.", "<b>Judge Yourself Honestly:<\/b> once a month, write three lines: what's working, what isn't, what I will change."]}, "article": {"title": "Live An Extraordinary Life", "sub": "5 lessons, made practical", "html": "<p>Jared Diamond, the UCLA geographer and author of <i>Guns, Germs, and Steel<\/i>, has had a career that crosses birds, languages, history and whole civilizations. He talks about great leaders, but also about how an ordinary person can build an extraordinary life. Five lessons stand out.<\/p>\n<h3>1. Follow your odd interests<\/h3>\n<p>Diamond's advice is to build a career and life around what truly fascinates you, even if it looks unusual to others.<\/p>\n<p><b>Try:<\/b> list your three biggest curiosities. Give one of them an hour this week.<\/p>\n<h3>2. Keep learning forever<\/h3>\n<p>He talks about learning languages, a lifelong habit of his. New learning keeps the mind young.<\/p>\n<p><b>Try:<\/b> ten minutes a day on something new: words, a skill, a place.<\/p>\n<h3>3. Move your body daily<\/h3>\n<p>Physical activity is part of how he keeps body and mind vigorous.<\/p>\n<p><b>Try:<\/b> a daily walk, stairs instead of lifts, more time outdoors.<\/p>\n<h3>4. Find your supporters<\/h3>\n<p>Success in any career comes faster with mentors and people who believe in you.<\/p>\n<p><b>Try:<\/b> ask one person for advice, thank one past mentor, and help one person younger than you.<\/p>\n<h3>5. Judge yourself honestly<\/h3>\n<p>In his book <i>Upheaval<\/i>, Diamond argues that nations recover from crises when they take an honest look at what works and what must change. The same holds for people.<\/p>\n<p><b>Try:<\/b> once a month, write three lines: what's working, what isn't, what I will change.<\/p>\n<h3>Putting it together<\/h3>\n<p>An extraordinary life rarely comes from one big leap. It comes from curiosity followed for decades, a body kept moving, good people around you and the honesty to change course.<\/p>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/hp-extraordinary-diamond/01.jpg", "img/hp-extraordinary-diamond/02.jpg", "img/hp-extraordinary-diamond/03.jpg", "img/hp-extraordinary-diamond/04.jpg", "img/hp-extraordinary-diamond/05.jpg"], "added": 1979}, {"id": "hp-cravings-kanoski", "topic": "Health & body", "title": "Your Food Shapes Your Mind", "sub": "5 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Remember Your Meals", "b": "Your brain uses the memory of your last meal to decide when to eat again. Distracted eating weakens it.", "tags": ["No screens", "Eat slowly", "Notice the taste"], "k": "Mindful meals, fewer cravings."}, {"t": "Cut Ultra-Processed Snacks", "b": "Research discussed links high-sugar, highly processed diets to weaker memory.", "tags": ["Read labels", "Swap one snack", "Keep fruit nearby"], "k": "Protect your memory with your fork."}, {"t": "Feed Your Gut", "b": "Your gut microbes talk to your brain. Feed the good ones.", "tags": ["Fiber", "Fermented foods", "Plants daily"], "k": "A happy gut, a clearer mind."}, {"t": "Retrain Your Cravings", "b": "Cravings are learned through dopamine and cues. Change the cue, change the craving.", "tags": ["Spot your trigger", "Change the routine", "Wait 10 minutes"], "k": "Cravings are learned, so unlearn them."}, {"t": "Handle Stress Without Food", "b": "Stress pushes you toward comfort food. Have another calming tool ready.", "tags": ["Breathe", "Walk", "Call someone"], "k": "Feel it, don't feed it."}], "plan": {"title": "Your step-by-step plan", "items": ["<b>Remember Your Meals:<\/b> at least one meal a day with no screens. Eat slowly and notice the taste.", "<b>Cut Ultra-Processed Snacks:<\/b> read labels and swap one processed snack a day for fruit or nuts.", "<b>Feed Your Gut:<\/b> fiber, fermented foods like yogurt or kefir, and plants every day.", "<b>Retrain Your Cravings:<\/b> spot the trigger, change the routine around it, and wait ten minutes before acting on a craving.", "<b>Handle Stress Without Food:<\/b> five slow breaths, a short walk, or a call to a friend."]}, "article": {"title": "Your Food Shapes Your Mind", "sub": "5 lessons, made practical", "html": "<p>We usually think of food in terms of weight. Dr. Scott Kanoski, a USC neuroscientist who studies how eating affects the brain, focuses on something else: how what and how we eat shapes memory, focus and cravings.<\/p>\n<h3>1. Remember your meals<\/h3>\n<p>The brain uses the memory of your last meal to help decide when to eat again. Distracted eating, in front of a screen, weakens that memory.<\/p>\n<p><b>Try:<\/b> at least one meal a day with no screens. Eat slowly and notice the taste.<\/p>\n<h3>2. Cut ultra-processed snacks<\/h3>\n<p>Research links high-sugar, highly processed diets to weaker memory (much of it in animal studies).<\/p>\n<p><b>Try:<\/b> read labels and swap one processed snack a day for fruit or nuts.<\/p>\n<h3>3. Feed your gut<\/h3>\n<p>Gut microbes and the brain are in constant conversation.<\/p>\n<p><b>Try:<\/b> fiber, fermented foods like yogurt or kefir, and plants every day.<\/p>\n<h3>4. Retrain your cravings<\/h3>\n<p>Cravings are learned through dopamine and cues: a time, a place, a feeling.<\/p>\n<p><b>Try:<\/b> spot the trigger, change the routine around it, and wait ten minutes before acting on a craving.<\/p>\n<h3>5. Handle stress without food<\/h3>\n<p>Stress pulls us toward comfort food. Have a different calming tool ready.<\/p>\n<p><b>Try:<\/b> five slow breaths, a short walk, or a call to a friend.<\/p>\n<h3>A gentle start<\/h3>\n<p>Don't overhaul everything. This week, pick one screen-free meal a day and one snack swap. Small changes, repeated, shape both body and mind.<\/p>\n<hr>\n<p><i>For education, not medical or nutrition advice. Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/hp-cravings-kanoski/01.jpg", "img/hp-cravings-kanoski/02.jpg", "img/hp-cravings-kanoski/03.jpg", "img/hp-cravings-kanoski/04.jpg", "img/hp-cravings-kanoski/05.jpg"], "added": 1978}, {"id": "mx-gratitude", "topic": "Mental peace", "title": "Success and Gratitude: Why Great Leaders Revisit Where They Came From", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Balance Entitlement With Gratitude", "b": "To balance an entitlement mindset, put gratitude beside it.", "tags": ["Notice entitlement", "Name a blessing", "Say thanks"], "k": "Gratitude cancels entitlement."}, {"t": "Revisit Your Roots", "b": "You always need to go back and visit where you came from.", "tags": ["Old neighbourhood", "Old photos", "Old friends"], "k": "Remembering keeps you grounded."}, {"t": "Remember Who Helped You", "b": "Never forget the people and places that made you who you are today.", "tags": ["List them", "Thank one", "Pay it forward"], "k": "No one gets there alone."}], "plan": {"title": "Your one-week plan", "items": ["<b>Balance Entitlement With Gratitude:<\/b> Each night this week, write three things you're grateful for.", "<b>Revisit Your Roots:<\/b> Visit, call or look back at one place from your past.", "<b>Remember Who Helped You:<\/b> Send a thank-you message to someone who helped shape you."]}, "article": {"title": "Success and Gratitude: Why Great Leaders Revisit Where They Came From", "sub": "3 lessons, made practical", "html": "<p>Why great leaders keep going back to where they came from.<\/p>\n<h3>1. Balance Entitlement With Gratitude<\/h3>\n<p>To balance an entitlement mindset, put gratitude beside it.<\/p>\n<p><b>Try:<\/b> Each night this week, write three things you're grateful for.<\/p>\n<h3>2. Revisit Your Roots<\/h3>\n<p>You always need to go back and visit where you came from.<\/p>\n<p><b>Try:<\/b> Visit, call or look back at one place from your past.<\/p>\n<h3>3. Remember Who Helped You<\/h3>\n<p>Never forget the people and places that made you who you are today.<\/p>\n<p><b>Try:<\/b> Send a thank-you message to someone who helped shape you.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Balance Entitlement With Gratitude:<\/b> Each night this week, write three things you're grateful for.<\/li><li><b>Revisit Your Roots:<\/b> Visit, call or look back at one place from your past.<\/li><li><b>Remember Who Helped You:<\/b> Send a thank-you message to someone who helped shape you.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-gratitude/01.jpg", "img/mx-gratitude/02.jpg", "img/mx-gratitude/03.jpg", "img/mx-gratitude/04.jpg", "img/mx-gratitude/05.jpg"], "added": 977}, {"id": "mx-lead-to-give", "topic": "Mental peace", "title": "Lead to Give, Not to Get", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Focus On Seeds", "b": "Success is determined by the seeds you sow, not the harvest you reap.", "tags": ["Invest in people", "Daily", "Be patient"], "k": "Sow first. The harvest follows."}, {"t": "Practise Gratitude", "b": "Gratitude is the antidote to entitlement.", "tags": ["Say thanks", "Write it down", "Notice the good"], "k": "Thankful people stay humble."}, {"t": "Be The First To Help", "b": "Be the first to help. Leaders go first in serving others.", "tags": ["Offer help", "Go first", "No strings"], "k": "Leaders serve first."}], "plan": {"title": "Your one-week plan", "items": ["<b>Focus On Seeds:<\/b> Invest time in one person's growth this week.", "<b>Practise Gratitude:<\/b> Thank three people this week for specific things.", "<b>Be The First To Help:<\/b> Be the first to offer help in your next team or family moment."]}, "article": {"title": "Lead to Give, Not to Get", "sub": "3 lessons, made practical", "html": "<p>Lead to give, not to get.<\/p>\n<h3>1. Focus On Seeds<\/h3>\n<p>Success is determined by the seeds you sow, not the harvest you reap.<\/p>\n<p><b>Try:<\/b> Invest time in one person's growth this week.<\/p>\n<h3>2. Practise Gratitude<\/h3>\n<p>Gratitude is the antidote to entitlement.<\/p>\n<p><b>Try:<\/b> Thank three people this week for specific things.<\/p>\n<h3>3. Be The First To Help<\/h3>\n<p>Be the first to help. Leaders go first in serving others.<\/p>\n<p><b>Try:<\/b> Be the first to offer help in your next team or family moment.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Focus On Seeds:<\/b> Invest time in one person's growth this week.<\/li><li><b>Practise Gratitude:<\/b> Thank three people this week for specific things.<\/li><li><b>Be The First To Help:<\/b> Be the first to offer help in your next team or family moment.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-lead-to-give/01.jpg", "img/mx-lead-to-give/02.jpg", "img/mx-lead-to-give/03.jpg", "img/mx-lead-to-give/04.jpg", "img/mx-lead-to-give/05.jpg"], "added": 976}, {"id": "hl-stress-epel", "topic": "Mental peace", "title": "Manage Stress & Build Resilience", "sub": "5 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "See It As A Challenge", "b": "Reframe stress as a challenge instead of a threat.", "tags": ["What can I learn?", "My body is preparing me", "I can handle this"], "k": "Same stress, different story."}, {"t": "Accept What Is", "b": "Practice radical acceptance of what is.", "tags": ["Name it", "Stop figh
