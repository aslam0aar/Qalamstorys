ting it", "Then choose"], "k": "Acceptance comes before change."}, {"t": "Drop The Rope", "b": "“Drop the rope” on stressors you can't control.", "tags": ["Can I control this?", "If not, let go", "Repeat"], "k": "Stop the tug of war you can't win."}, {"t": "Calm Your Body First", "b": "Use your posture and slow breathing to calm your body.", "tags": ["Sit tall", "Slow exhale", "Relax your jaw"], "k": "Calm the body and the mind follows."}, {"t": "Stop The Replay", "b": "Tools to reduce rumination help build resilience.", "tags": ["Write it down", "Move", "Talk to someone"], "k": "Replaying the problem isn't solving it."}], "plan": {"title": "Your one-week plan", "items": ["<b>See It As A Challenge:<\/b> Next time you feel pressure, say: this is a challenge I can meet.", "<b>Accept What Is:<\/b> Name one situation you've been resisting and simply accept that it is so.", "<b>Drop The Rope:<\/b> List one stressor you can't control and choose to drop it today.", "<b>Calm Your Body First:<\/b> Three times today, sit tall and take five slow breaths.", "<b>Stop The Replay:<\/b> When a thought loops, write it down and take a short walk."]}, "article": {"title": "Manage Stress & Build Resilience", "sub": "5 lessons, made practical", "html": "<p>Stress is not the enemy. How you relate to it is what matters. These tools help you recover faster.<\/p>\n<h3>1. See It As A Challenge<\/h3>\n<p>Reframe stress as a challenge instead of a threat.<\/p>\n<p><b>Try:<\/b> Next time you feel pressure, say: this is a challenge I can meet.<\/p>\n<h3>2. Accept What Is<\/h3>\n<p>Practice radical acceptance of what is.<\/p>\n<p><b>Try:<\/b> Name one situation you've been resisting and simply accept that it is so.<\/p>\n<h3>3. Drop The Rope<\/h3>\n<p>“Drop the rope” on stressors you can't control.<\/p>\n<p><b>Try:<\/b> List one stressor you can't control and choose to drop it today.<\/p>\n<h3>4. Calm Your Body First<\/h3>\n<p>Use your posture and slow breathing to calm your body.<\/p>\n<p><b>Try:<\/b> Three times today, sit tall and take five slow breaths.<\/p>\n<h3>5. Stop The Replay<\/h3>\n<p>Tools to reduce rumination help build resilience.<\/p>\n<p><b>Try:<\/b> When a thought loops, write it down and take a short walk.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>See It As A Challenge:<\/b> Next time you feel pressure, say: this is a challenge I can meet.<\/li><li><b>Accept What Is:<\/b> Name one situation you've been resisting and simply accept that it is so.<\/li><li><b>Drop The Rope:<\/b> List one stressor you can't control and choose to drop it today.<\/li><li><b>Calm Your Body First:<\/b> Three times today, sit tall and take five slow breaths.<\/li><li><b>Stop The Replay:<\/b> When a thought loops, write it down and take a short walk.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/hl-stress-epel/01.jpg", "img/hl-stress-epel/02.jpg", "img/hl-stress-epel/03.jpg", "img/hl-stress-epel/04.jpg", "img/hl-stress-epel/05.jpg", "img/hl-stress-epel/06.jpg", "img/hl-stress-epel/07.jpg"], "added": 975}, {"id": "hl-breathe", "topic": "Mental peace", "title": "How to Breathe Correctly for Optimal Health, Mood, Learning & Performance", "sub": "4 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Use The Physiological Sigh", "b": "Two deep inhales through the nose, then a long exhale through the mouth.", "tags": ["Inhale, inhale again", "Long exhale", "1 to 3 rounds"], "k": "The quickest way to calm down in real time."}, {"t": "Lengthen Your Exhale", "b": "Long exhales slow your heart rate. Long inhales speed it up.", "tags": ["Exhale longer than inhale", "Use it before sleep", "Flip it for energy"], "k": "Exhale to calm, inhale to wake up."}, {"t": "Practice Cyclic Sighing", "b": "Cyclic sighing for about five minutes a day is a simple stress-reduction practice.", "tags": ["5 minutes", "Same time daily", "Sit or lie down"], "k": "Five minutes a day lowers your baseline stress."}, {"t": "Breathe Through Your Nose", "b": "Breathe through your nose when you can.", "tags": ["At rest", "On walks", "While working"], "k": "Your nose is built for breathing. Use it."}], "plan": {"title": "Your one-week plan", "items": ["<b>Use The Physiological Sigh:<\/b> When stress spikes today, do one to three physiological sighs.", "<b>Lengthen Your Exhale:<\/b> Before bed, breathe with exhales twice as long as inhales for two minutes.", "<b>Practice Cyclic Sighing:<\/b> Set a daily five-minute cyclic sighing session.", "<b>Breathe Through Your Nose:<\/b> Check three times today: are you breathing through your nose?"]}, "article": {"title": "How to Breathe Correctly for Optimal Health, Mood, Learning & Performance", "sub": "4 lessons, made practical", "html": "<p>Your breath is the fastest remote control you have for your nervous system. These tools take seconds and work anywhere.<\/p>\n<h3>1. Use The Physiological Sigh<\/h3>\n<p>Two deep inhales through the nose, then a long exhale through the mouth.<\/p>\n<p><b>Try:<\/b> When stress spikes today, do one to three physiological sighs.<\/p>\n<h3>2. Lengthen Your Exhale<\/h3>\n<p>Long exhales slow your heart rate. Long inhales speed it up.<\/p>\n<p><b>Try:<\/b> Before bed, breathe with exhales twice as long as inhales for two minutes.<\/p>\n<h3>3. Practice Cyclic Sighing<\/h3>\n<p>Cyclic sighing for about five minutes a day is a simple stress-reduction practice.<\/p>\n<p><b>Try:<\/b> Set a daily five-minute cyclic sighing session.<\/p>\n<h3>4. Breathe Through Your Nose<\/h3>\n<p>Breathe through your nose when you can.<\/p>\n<p><b>Try:<\/b> Check three times today: are you breathing through your nose?<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Use The Physiological Sigh:<\/b> When stress spikes today, do one to three physiological sighs.<\/li><li><b>Lengthen Your Exhale:<\/b> Before bed, breathe with exhales twice as long as inhales for two minutes.<\/li><li><b>Practice Cyclic Sighing:<\/b> Set a daily five-minute cyclic sighing session.<\/li><li><b>Breathe Through Your Nose:<\/b> Check three times today: are you breathing through your nose?<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/hl-breathe/01.jpg", "img/hl-breathe/02.jpg", "img/hl-breathe/03.jpg", "img/hl-breathe/04.jpg", "img/hl-breathe/05.jpg", "img/hl-breathe/06.jpg"], "added": 974}, {"id": "mx-give-most", "topic": "Relationships", "title": "Leaders Who Get the Most Give the Most", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Open Your Hands", "b": "A clenched fist gives nothing but is also unable to receive anything.", "tags": ["Share", "Help", "Let go"], "k": "Giving keeps you open to receive."}, {"t": "Sow Plenty Of Seeds", "b": "If you sow a lot of seeds, the harvest takes care of itself.", "tags": ["Small kindnesses", "Daily", "Don't keep score"], "k": "Focus on sowing, not reaping."}, {"t": "Give Now", "b": "If you don't give away what you've got now, you won't give away what you're going to get later.", "tags": ["Start small", "Start today", "Build the habit"], "k": "Generosity is a habit, not a future plan."}], "plan": {"title": "Your one-week plan", "items": ["<b>Open Your Hands:<\/b> Give something useful away this week: time, advice or help.", "<b>Sow Plenty Of Seeds:<\/b> Do one small act of generosity every day this week.", "<b>Give Now:<\/b> Give something today instead of waiting until you have more."]}, "article": {"title": "Leaders Who Get the Most Give the Most", "sub": "3 lessons, made practical", "html": "<p>A counterintuitive truth: the people who give the most usually get the most.<\/p>\n<h3>1. Open Your Hands<\/h3>\n<p>A clenched fist gives nothing but is also unable to receive anything.<\/p>\n<p><b>Try:<\/b> Give something useful away this week: time, advice or help.<\/p>\n<h3>2. Sow Plenty Of Seeds<\/h3>\n<p>If you sow a lot of seeds, the harvest takes care of itself.<\/p>\n<p><b>Try:<\/b> Do one small act of generosity every day this week.<\/p>\n<h3>3. Give Now<\/h3>\n<p>If you don't give away what you've got now, you won't give away what you're going to get later.<\/p>\n<p><b>Try:<\/b> Give something today instead of waiting until you have more.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Open Your Hands:<\/b> Give something useful away this week: time, advice or help.<\/li><li><b>Sow Plenty Of Seeds:<\/b> Do one small act of generosity every day this week.<\/li><li><b>Give Now:<\/b> Give something today instead of waiting until you have more.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-give-most/01.jpg", "img/mx-give-most/02.jpg", "img/mx-give-most/03.jpg", "img/mx-give-most/04.jpg", "img/mx-give-most/05.jpg"], "added": 973}, {"id": "mx-friends-not-fans", "topic": "Relationships", "title": "Good Leaders Make Friends, Not Fans", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Connect To Beat Isolation", "b": "Success can isolate, but connection is the cure.", "tags": ["Call a friend", "Eat with people", "Stay reachable"], "k": "Don't let success make you lonely."}, {"t": "Serve Before You're Served", "b": "Service trumps titles.", "tags": ["Help first", "Do small tasks", "Skip the status"], "k": "Titles fade. Service lasts."}, {"t": "Be Authentic", "b": "Shrink the gap with authenticity: practice humility, seek honest feedback, and be present with your people.", "tags": ["Be humble", "Ask for feedback", "Be present"], "k": "Real beats impressive."}], "plan": {"title": "Your one-week plan", "items": ["<b>Connect To Beat Isolation:<\/b> Reach out to one friend you haven't spoken to in a while.", "<b>Serve Before You're Served:<\/b> Do one helpful task this week that isn't in your job description.", "<b>Be Authentic:<\/b> Ask someone for honest feedback and listen without defending."]}, "article": {"title": "Good Leaders Make Friends, Not Fans", "sub": "3 lessons, made practical", "html": "<p>Great leaders build real relationships instead of an audience.<\/p>\n<h3>1. Connect To Beat Isolation<\/h3>\n<p>Success can isolate, but connection is the cure.<\/p>\n<p><b>Try:<\/b> Reach out to one friend you haven't spoken to in a while.<\/p>\n<h3>2. Serve Before You're Served<\/h3>\n<p>Service trumps titles.<\/p>\n<p><b>Try:<\/b> Do one helpful task this week that isn't in your job description.<\/p>\n<h3>3. Be Authentic<\/h3>\n<p>Shrink the gap with authenticity: practice humility, seek honest feedback, and be present with your people.<\/p>\n<p><b>Try:<\/b> Ask someone for honest feedback and listen without defending.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Connect To Beat Isolation:<\/b> Reach out to one friend you haven't spoken to in a while.<\/li><li><b>Serve Before You're Served:<\/b> Do one helpful task this week that isn't in your job description.<\/li><li><b>Be Authentic:<\/b> Ask someone for honest feedback and listen without defending.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-friends-not-fans/01.jpg", "img/mx-friends-not-fans/02.jpg", "img/mx-friends-not-fans/03.jpg", "img/mx-friends-not-fans/04.jpg", "img/mx-friends-not-fans/05.jpg"], "added": 972}, {"id": "mx-not-about-you", "topic": "Relationships", "title": "It’s Not About You: Leadership, Communication, and Putting Others First", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Add Value First", "b": "The more you focus on adding value to others, the more you'll receive value in return.", "tags": ["Help", "Teach", "Encourage"], "k": "Value given comes back."}, {"t": "Make It About Them", "b": "Make your message all about your audience, not yourself.", "tags": ["Know your audience", "Their needs first", "Less 'I'"], "k": "Talk to their needs, not your ego."}, {"t": "Answer The Three Questions", "b": "Every follower asks: Do you care about me? Can you help me? Can I trust you?", "tags": ["Show care", "Be useful", "Be reliable"], "k": "Care, help, trust."}], "plan": {"title": "Your one-week plan", "items": ["<b>Add Value First:<\/b> Add value to one person every day this week.", "<b>Make It About Them:<\/b> Before your next talk or message, ask: what does this person need?", "<b>Answer The Three Questions:<\/b> Ask yourself the three questions about one relationship and improve one answer."]}, "article": {"title": "It’s Not About You: Leadership, Communication, and Putting Others First", "sub": "3 lessons, made practical", "html": "<p>Great communicators make it about the other person.<\/p>\n<h3>1. Add Value First<\/h3>\n<p>The more you focus on adding value to others, the more you'll receive value in return.<\/p>\n<p><b>Try:<\/b> Add value to one person every day this week.<\/p>\n<h3>2. Make It About Them<\/h3>\n<p>Make your message all about your audience, not yourself.<\/p>\n<p><b>Try:<\/b> Before your next talk or message, ask: what does this person need?<\/p>\n<h3>3. Answer The Three Questions<\/h3>\n<p>Every follower asks: Do you care about me? Can you help me? Can I trust you?<\/p>\n<p><b>Try:<\/b> Ask yourself the three questions about one relationship and improve one answer.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Add Value First:<\/b> Add value to one person every day this week.<\/li><li><b>Make It About Them:<\/b> Before your next talk or message, ask: what does this person need?<\/li><li><b>Answer The Three Questions:<\/b> Ask yourself the three questions about one relationship and improve one answer.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-not-about-you/01.jpg", "img/mx-not-about-you/02.jpg", "img/mx-not-about-you/03.jpg", "img/mx-not-about-you/04.jpg", "img/mx-not-about-you/05.jpg"], "added": 971}, {"id": "rs-dr-k", "topic": "Relationships", "title": "Psychology Behind Cheating & Choosing the Wrong Partner", "sub": "4 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Question Instant Attraction", "b": "Attraction can be a trauma signal, not a compatibility signal.", "tags": ["Notice the pull", "Ask why", "Go slow"], "k": "Strong chemistry isn't always a good sign."}, {"t": "Watch The Red Flags", "b": "Red flags predict relationship outcomes better than green flags.", "tags": ["List deal-breakers", "Believe behaviour", "Don't explain them away"], "k": "Red flags speak louder."}, {"t": "Break The Pattern", "b": "Learn the pattern behind falling for the wrong person, then break it.", "tags": ["Look at past partners", "Find the pattern", "Choose differently"], "k": "Patterns repeat until you see them."}, {"t": "Know The Bridge Effect", "b": "Shared fear and excitement can be mistaken for romantic attraction (the Bridge Study).", "tags": ["Notice the setting", "Wait for calm", "Check again"], "k": "Adrenaline can feel like love."}], "plan": {"title": "Your one-week plan", "items": ["<b>Question Instant Attraction:<\/b> When you feel an intense pull, slow down and ask what it reminds you of.", "<b>Watch The Red Flags:<\/b> Write down your three relationship deal-breakers.", "<b>Break The Pattern:<\/b> Write what your past difficult relationships had in common.", "<b>Know The Bridge Effect:<\/b> Check your feelings again in a calm setting before deciding."]}, "article": {"title": "Psychology Behind Cheating & Choosing the Wrong Partner", "sub": "4 lessons, made practical", "html": "<p>Why we fall for the wrong partners, and how to stop.<\/p>\n<h3>1. Question Instant Attraction<\/h3>\n<p>Attraction can be a trauma signal, not a compatibility signal.<\/p>\n<p><b>Try:<\/b> When you feel an intense pull, slow down and ask what it reminds you of.<\/p>\n<h3>2. Watch The Red Flags<\/h3>\n<p>Red flags predict relationship outcomes better than green flags.<\/p>\n<p><b>Try:<\/b> Write down your three relationship deal-breakers.<\/p>\n<h3>3. Break The Pattern<\/h3>\n<p>Learn the pattern behind falling for the wrong person, then break it.<\/p>\n<p><b>Try:<\/b> Write what your past difficult relationships had in common.<\/p>\n<h3>4. Know The Bridge Effect<\/h3>\n<p>Shared fear and excitement can be mistaken for romantic attraction (the Bridge Study).<\/p>\n<p><b>Try:<\/b> Check your feelings again in a calm setting before deciding.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Question Instant Attraction:<\/b> When you feel an intense pull, slow down and ask what it reminds you of.<\/li><li><b>Watch The Red Flags:<\/b> Write down your three relationship deal-breakers.<\/li><li><b>Break The Pattern:<\/b> Write what your past difficult relationships had in common.<\/li><li><b>Know The Bridge Effect:<\/b> Check your feelings again in a calm setting before deciding.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/rs-dr-k/01.jpg", "img/rs-dr-k/02.jpg", "img/rs-dr-k/03.jpg", "img/rs-dr-k/04.jpg", "img/rs-dr-k/05.jpg", "img/rs-dr-k/06.jpg"], "added": 970}, {"id": "rs-adam-grant", "topic": "Relationships", "title": "How to Read People, Build Trust & Choose Better Friends", "sub": "4 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Slow Your Verdicts", "b": "We're often bad at judging people's character, so slow down your verdicts.", "tags": ["Watch over time", "Ask questions", "Hold first impressions loosely"], "k": "First impressions are often wrong."}, {"t": "Disagree Without Damage", "b": "You can handle conflict without damaging the relationship.", "tags": ["Attack ideas, not people", "Stay curious", "Find common ground"], "k": "Conflict can make you closer."}, {"t": "Build Community", "b": "Making friends and building community is how you beat loneliness.", "tags": ["Join a group", "Invite someone", "Show up regularly"], "k": "Connection is built, not found."}, {"t": "Mind The Liking Gap", "b": "The liking gap: people like you more than you think.", "tags": ["Reach out", "Assume warmth", "Start the chat"], "k": "They probably like you more than you think."}], "plan": {"title": "Your one-week plan", "items": ["<b>Slow Your Verdicts:<\/b> Hold off on judging someone new until you've seen them a few times.", "<b>Disagree Without Damage:<\/b> In your next disagreement, ask one curious question before you argue.", "<b>Build Community:<\/b> Invite one person to do something with you this week.", "<b>Mind The Liking Gap:<\/b> Message someone you'd like to know better, and assume they'll be glad."]}, "article": {"title": "How to Read People, Build Trust & Choose Better Friends", "sub": "4 lessons, made practical", "html": "<p>How to read people, build trust and choose better friends.<\/p>\n<h3>1. Slow Your Verdicts<\/h3>\n<p>We're often bad at judging people's character, so slow down your verdicts.<\/p>\n<p><b>Try:<\/b> Hold off on judging someone new until you've seen them a few times.<\/p>\n<h3>2. Disagree Without Damage<\/h3>\n<p>You can handle conflict without damaging the relationship.<\/p>\n<p><b>Try:<\/b> In your next disagreement, ask one curious question before you argue.<\/p>\n<h3>3. Build Community<\/h3>\n<p>Making friends and building community is how you beat loneliness.<\/p>\n<p><b>Try:<\/b> Invite one person to do something with you this week.<\/p>\n<h3>4. Mind The Liking Gap<\/h3>\n<p>The liking gap: people like you more than you think.<\/p>\n<p><b>Try:<\/b> Message someone you'd like to know better, and assume they'll be glad.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Slow Your Verdicts:<\/b> Hold off on judging someone new until you've seen them a few times.<\/li><li><b>Disagree Without Damage:<\/b> In your next disagreement, ask one curious question before you argue.<\/li><li><b>Build Community:<\/b> Invite one person to do something with you this week.<\/li><li><b>Mind The Liking Gap:<\/b> Message someone you'd like to know better, and assume they'll be glad.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/rs-adam-grant/01.jpg", "img/rs-adam-grant/02.jpg", "img/rs-adam-grant/03.jpg", "img/rs-adam-grant/04.jpg", "img/rs-adam-grant/05.jpg", "img/rs-adam-grant/06.jpg"], "added": 969}, {"id": "mx-successful-1", "topic": "Mindset & motivation", "title": "What Successful People Know and Do (Part 1)", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Start Now", "b": "Goals are nothing without action. Don't be afraid to get started now.", "tags": ["Smallest step", "Today", "Imperfect is fine"], "k": "Action turns goals into results."}, {"t": "Never Stop Learning", "b": "Never stop learning.", "tags": ["Read", "Listen", "Ask"], "k": "Learners keep winning."}, {"t": "Think Before You Talk", "b": "A minute of thought is worth more than an hour of talk.", "tags": ["Pause", "Think it through", "Then speak"], "k": "Think first, talk less."}], "plan": {"title": "Your one-week plan", "items": ["<b>Start Now:<\/b> Take the smallest possible step on one goal today.", "<b>Never Stop Learning:<\/b> Spend 15 minutes a day this week learning something useful.", "<b>Think Before You Talk:<\/b> Before your next big conversation, take a minute to think it through."]}, "article": {"title": "What Successful People Know and Do (Part 1)", "sub": "3 lessons, made practical", "html": "<p>What successful people know and do, part 1: act, learn and think first.<\/p>\n<h3>1. Start Now<\/h3>\n<p>Goals are nothing without action. Don't be afraid to get started now.<\/p>\n<p><b>Try:<\/b> Take the smallest possible step on one goal today.<\/p>\n<h3>2. Never Stop Learning<\/h3>\n<p>Never stop learning.<\/p>\n<p><b>Try:<\/b> Spend 15 minutes a day this week learning something useful.<\/p>\n<h3>3. Think Before You Talk<\/h3>\n<p>A minute of thought is worth more than an hour of talk.<\/p>\n<p><b>Try:<\/b> Before your next big conversation, take a minute to think it through.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Start Now:<\/b> Take the smallest possible step on one goal today.<\/li><li><b>Never Stop Learning:<\/b> Spend 15 minutes a day this week learning something useful.<\/li><li><b>Think Before You Talk:<\/b> Before your next big conversation, take a minute to think it through.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-successful-1/01.jpg", "img/mx-successful-1/02.jpg", "img/mx-successful-1/03.jpg", "img/mx-successful-1/04.jpg", "img/mx-successful-1/05.jpg"], "added": 968}, {"id": "mx-blind-spots-2", "topic": "Mindset & motivation", "title": "Be Aware of Your Blind Spots (Part 2)", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Watch For Insecurity", "b": "Insecurity causes a leader to think only of themselves, and the very essence of leadership is others.", "tags": ["Notice self-focus", "Turn it outward", "Celebrate others"], "k": "Secure leaders make room for others."}, {"t": "Choose What's Right", "b": "Pride is concerned about who's right. Humility is concerned about what's right.", "tags": ["Drop the need to win", "Seek the truth", "Admit mistakes"], "k": "Being right matters less than doing right."}, {"t": "Protect Your Character", "b": "Character doesn't make you a leader, but it protects you as a leader.", "tags": ["Keep small promises", "Same in private", "Tell the truth"], "k": "Character is your safety net."}], "plan": {"title": "Your one-week plan", "items": ["<b>Watch For Insecurity:<\/b> Publicly credit someone else's work this week.", "<b>Choose What's Right:<\/b> In your next disagreement, ask: what is right here, not who.", "<b>Protect Your Character:<\/b> Keep every small promise you make this week."]}, "article": {"title": "Be Aware of Your Blind Spots (Part 2)", "sub": "3 lessons, made practical", "html": "<p>More blind spots to watch for: insecurity, pride and character.<\/p>\n<h3>1. Watch For Insecurity<\/h3>\n<p>Insecurity causes a leader to think only of themselves, and the very essence of leadership is others.<\/p>\n<p><b>Try:<\/b> Publicly credit someone else's work this week.<\/p>\n<h3>2. Choose What's Right<\/h3>\n<p>Pride is concerned about who's right. Humility is concerned about what's right.<\/p>\n<p><b>Try:<\/b> In your next disagreement, ask: what is right here, not who.<\/p>\n<h3>3. Protect Your Character<\/h3>\n<p>Character doesn't make you a leader, but it protects you as a leader.<\/p>\n<p><b>Try:<\/b> Keep every small promise you make this week.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Watch For Insecurity:<\/b> Publicly credit someone else's work this week.<\/li><li><b>Choose What's Right:<\/b> In your next disagreement, ask: what is right here, not who.<\/li><li><b>Protect Your Character:<\/b> Keep every small promise you make this week.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-blind-spots-2/01.jpg", "img/mx-blind-spots-2/02.jpg", "img/mx-blind-spots-2/03.jpg", "img/mx-blind-spots-2/04.jpg", "img/mx-blind-spots-2/05.jpg"], "added": 967}, {"id": "mx-blind-spots-1", "topic": "Mindset & motivation", "title": "Be Aware of Your Blind Spots (Part 1)", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Check Your Lens", "b": "We don't see others as they are; we see others as we are.", "tags": ["Pause before judging", "What am I projecting?", "Ask, don't assume"], "k": "Your view says as much about you as them."}, {"t": "Examine Yourself First", "b": "The first person we must examine is ourselves.", "tags": ["Weekly review", "Ask for feedback", "Own your part"], "k": "Self-awareness comes before leadership."}, {"t": "Look Outward", "b": "Followers are inward focused; leaders are outward focused.", "tags": ["Who needs help?", "Notice others", "Serve first"], "k": "Leaders look out, not in."}], "plan": {"title": "Your one-week plan", "items": ["<b>Check Your Lens:<\/b> Before judging someone today, ask what you might be bringing to it.", "<b>Examine Yourself First:<\/b> Ask one person: what's one thing I could do better?", "<b>Look Outward:<\/b> Start one conversation today by asking how you can help."]}, "article": {"title": "Be Aware of Your Blind Spots (Part 1)", "sub": "3 lessons, made practical", "html": "<p>We all have blind spots. The first place to look is in the mirror.<\/p>\n<h3>1. Check Your Lens<\/h3>\n<p>We don't see others as they are; we see others as we are.<\/p>\n<p><b>Try:<\/b> Before judging someone today, ask what you might be bringing to it.<\/p>\n<h3>2. Examine Yourself First<\/h3>\n<p>The first person we must examine is ourselves.<\/p>\n<p><b>Try:<\/b> Ask one person: what's one thing I could do better?<\/p>\n<h3>3. Look Outward<\/h3>\n<p>Followers are inward focused; leaders are outward focused.<\/p>\n<p><b>Try:<\/b> Start one conversation today by asking how you can help.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Check Your Lens:<\/b> Before judging someone today, ask what you might be bringing to it.<\/li><li><b>Examine Yourself First:<\/b> Ask one person: what's one thing I could do better?<\/li><li><b>Look Outward:<\/b> Start one conversation today by asking how you can help.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-blind-spots-1/01.jpg", "img/mx-blind-spots-1/02.jpg", "img/mx-blind-spots-1/03.jpg", "img/mx-blind-spots-1/04.jpg", "img/mx-blind-spots-1/05.jpg"], "added": 966}, {"id": "mx-expect", "topic": "Mindset & motivation", "title": "What You Expect is What You Experience", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Raise Your Expectations", "b": "Successful leaders set higher, self-driven expectations and upgrade them over time.", "tags": ["Set your own bar", "Raise it slowly", "Review monthly"], "k": "Your standards shape your results."}, {"t": "Think In Possibilities", "b": "Possibility thinking lets you see problems as opportunities and persevere through adversity.", "tags": ["What could go right?", "Find the opportunity", "Keep going"], "k": "Problems hide opportunities."}, {"t": "Believe In Your Potential", "b": "When you genuinely believe in your potential, you inspire those around you to do the same.", "tags": ["Speak kindly to yourself", "Act like it", "Share belief"], "k": "Belief is contagious."}], "plan": {"title": "Your one-week plan", "items": ["<b>Raise Your Expectations:<\/b> Raise one personal standard slightly this week.", "<b>Think In Possibilities:<\/b> For one problem today, list three possible upsides.", "<b>Believe In Your Potential:<\/b> Write one sentence about who you're becoming and read it each morning."]}, "article": {"title": "What You Expect is What You Experience", "sub": "3 lessons, made practical", "html": "<p>A simple idea: what you expect shapes what you experience.<\/p>\n<h3>1. Raise Your Expectations<\/h3>\n<p>Successful leaders set higher, self-driven expectations and upgrade them over time.<\/p>\n<p><b>Try:<\/b> Raise one personal standard slightly this week.<\/p>\n<h3>2. Think In Possibilities<\/h3>\n<p>Possibility thinking lets you see problems as opportunities and persevere through adversity.<\/p>\n<p><b>Try:<\/b> For one problem today, list three possible upsides.<\/p>\n<h3>3. Believe In Your Potential<\/h3>\n<p>When you genuinely believe in your potential, you inspire those around you to do the same.<\/p>\n<p><b>Try:<\/b> Write one sentence about who you're becoming and read it each morning.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Raise Your Expectations:<\/b> Raise one personal standard slightly this week.<\/li><li><b>Think In Possibilities:<\/b> For one problem today, list three possible upsides.<\/li><li><b>Believe In Your Potential:<\/b> Write one sentence about who you're becoming and read it each morning.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-expect/01.jpg", "img/mx-expect/02.jpg", "img/mx-expect/03.jpg", "img/mx-expect/04.jpg", "img/mx-expect/05.jpg"], "added": 965}, {"id": "hl-edgley", "topic": "Mindset & motivation", "title": "Unlocking Persistent Motivation & Extreme Resilience", "sub": "5 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Keep Updating Your Why", "b": "Dynamically update your sense of purpose, emotions, philosophy and personal narratives.", "tags": ["Rewrite your why", "Monthly", "Keep it honest"], "k": "Your reasons can grow with you."}, {"t": "Don't Stay Down Too Long", "b": "“As long as no side touches the ground for too long, you persist.”", "tags": ["Bad day? Fine", "Bad week? Reset", "Get back up"], "k": "Falling is allowed. Staying down is the risk."}, {"t": "Make Your Reasons Bigger", "b": "Your reasons to continue need to be bigger than your reasons to stop.", "tags": ["List reasons to stop", "List reasons to go", "Grow the second list"], "k": "Outweigh the urge to quit."}, {"t": "Rotate Your Motivators", "b": "When one motivator stops working, rotate to another.", "tags": ["Pride", "People", "Purpose", "Fun"], "k": "Have more than one engine."}, {"t": "Manage Your Energy", "b": "Manage your energy, not just your motivation.", "tags": ["Sleep", "Food", "Recovery"], "k": "Tired bodies make weak decisions."}], "plan": {"title": "Your one-week plan", "items": ["<b>Keep Updating Your Why:<\/b> Write one sentence on why your biggest goal matters to you today.", "<b>Don't Stay Down Too Long:<\/b> After your next slip, restart within 24 hours.", "<b>Make Your Reasons Bigger:<\/b> Write your reasons to keep going and put them where you'll see them.", "<b>Rotate Your Motivators:<\/b> Name three different things that drive you, and switch when one runs dry.", "<b>Manage Your Energy:<\/b> Protect one energy basic this week: sleep, food or rest."]}, "article": {"title": "Unlocking Persistent Motivation & Extreme Resilience", "sub": "5 lessons, made practical", "html": "<p>Ross Edgley swam around Great Britain. His lesson for the rest of us: motivation is not a feeling you wait for, it is a system you keep updating.<\/p>\n<h3>1. Keep Updating Your Why<\/h3>\n<p>Dynamically update your sense of purpose, emotions, philosophy and personal narratives.<\/p>\n<p><b>Try:<\/b> Write one sentence on why your biggest goal matters to you today.<\/p>\n<h3>2. Don't Stay Down Too Long<\/h3>\n<p>“As long as no side touches the ground for too long, you persist.”<\/p>\n<p><b>Try:<\/b> After your next slip, restart within 24 hours.<\/p>\n<h3>3. Make Your Reasons Bigger<\/h3>\n<p>Your reasons to continue need to be bigger than your reasons to stop.<\/p>\n<p><b>Try:<\/b> Write your reasons to keep going and put them where you'll see them.<\/p>\n<h3>4. Rotate Your Motivators<\/h3>\n<p>When one motivator stops working, rotate to another.<\/p>\n<p><b>Try:<\/b> Name three different things that drive you, and switch when one runs dry.<\/p>\n<h3>5. Manage Your Energy<\/h3>\n<p>Manage your energy, not just your motivation.<\/p>\n<p><b>Try:<\/b> Protect one energy basic this week: sleep, food or rest.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Keep Updating Your Why:<\/b> Write one sentence on why your biggest goal matters to you today.<\/li><li><b>Don't Stay Down Too Long:<\/b> After your next slip, restart within 24 hours.<\/li><li><b>Make Your Reasons Bigger:<\/b> Write your reasons to keep going and put them where you'll see them.<\/li><li><b>Rotate Your Motivators:<\/b> Name three different things that drive you, and switch when one runs dry.<\/li><li><b>Manage Your Energy:<\/b> Protect one energy basic this week: sleep, food or rest.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/hl-edgley/01.jpg", "img/hl-edgley/02.jpg", "img/hl-edgley/03.jpg", "img/hl-edgley/04.jpg", "img/hl-edgley/05.jpg", "img/hl-edgley/06.jpg", "img/hl-edgley/07.jpg"], "added": 964}, {"id": "mx-successful-2", "topic": "Growth & discipline", "title": "What Successful People Know and Do (Part 2)", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Play To Your Strengths", "b": "Invest 80% of your energy where you are strongest, and let your values direct your time and your money.", "tags": ["Know your strengths", "80% there", "Values guide spending"], "k": "Strengths and values point the way."}, {"t": "Challenge Old Assumptions", "b": "True innovation means challenging old assumptions and seeking new perspectives.", "tags": ["Why do we do this?", "Ask outsiders", "Try new ways"], "k": "Question the usual."}, {"t": "Build On Integrity", "b": "Your integrity forms the foundation that ensures all other leadership skills truly matter.", "tags": ["Tell the truth", "Keep your word", "Be consistent"], "k": "Integrity makes every skill count."}], "plan": {"title": "Your one-week plan", "items": ["<b>Play To Your Strengths:<\/b> List your top two strengths and move more time toward them.", "<b>Challenge Old Assumptions:<\/b> Question one 'we've always done it this way' habit this week.", "<b>Build On Integrity:<\/b> Keep every promise you make this week, however small."]}, "article": {"title": "What Successful People Know and Do (Part 2)", "sub": "3 lessons, made practical", "html": "<p>What successful people know and do, part 2: strengths, fresh thinking and integrity.<\/p>\n<h3>1. Play To Your Strengths<\/h3>\n<p>Invest 80% of your energy where you are strongest, and let your values direct your time and your money.<\/p>\n<p><b>Try:<\/b> List your top two strengths and move more time toward them.<\/p>\n<h3>2. Challenge Old Assumptions<\/h3>\n<p>True innovation means challenging old assumptions and seeking new perspectives.<\/p>\n<p><b>Try:<\/b> Question one 'we've always done it this way' habit this week.<\/p>\n<h3>3. Build On Integrity<\/h3>\n<p>Your integrity forms the foundation that ensures all other leadership skills truly matter.<\/p>\n<p><b>Try:<\/b> Keep every promise you make this week, however small.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Play To Your Strengths:<\/b> List your top two strengths and move more time toward them.<\/li><li><b>Challenge Old Assumptions:<\/b> Question one 'we've always done it this way' habit this week.<\/li><li><b>Build On Integrity:<\/b> Keep every promise you make this week, however small.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-successful-2/01.jpg", "img/mx-successful-2/02.jpg", "img/mx-successful-2/03.jpg", "img/mx-successful-2/04.jpg", "img/mx-successful-2/05.jpg"], "added": 963}, {"id": "mx-more-done", "topic": "Growth & discipline", "title": "How to Get More Done in Less Time", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Plan On Paper First", "b": "Never begin the day until it is finished on paper.", "tags": ["Night before", "Top 3 tasks", "Time blocks"], "k": "Plan the day before it starts."}, {"t": "Get Clear", "b": "Clarity is the most important concept in personal productivity.", "tags": ["What's the goal?", "What's done look like?", "What's next?"], "k": "Clear goals, faster work."}, {"t": "Build Self-Discipline", "b": "“Self-discipline is the ability to make yourself do what you should do, when you should do it, whether you feel like it or not.” (Elbert Hubbard)", "tags": ["Do it anyway", "Start small", "Keep the promise"], "k": "Feelings follow action."}], "plan": {"title": "Your one-week plan", "items": ["<b>Plan On Paper First:<\/b> Each evening this week, write tomorrow's top three tasks.", "<b>Get Clear:<\/b> Write what 'done' looks like for your most important task.", "<b>Build Self-Discipline:<\/b> Do your hardest task first, before you feel ready."]}, "article": {"title": "How to Get More Done in Less Time", "sub": "3 lessons, made practical", "html": "<p>Simple tools for getting more done in less time.<\/p>\n<h3>1. Plan On Paper First<\/h3>\n<p>Never begin the day until it is finished on paper.<\/p>\n<p><b>Try:<\/b> Each evening this week, write tomorrow's top three tasks.<\/p>\n<h3>2. Get Clear<\/h3>\n<p>Clarity is the most important concept in personal productivity.<\/p>\n<p><b>Try:<\/b> Write what 'done' looks like for your most important task.<\/p>\n<h3>3. Build Self-Discipline<\/h3>\n<p>“Self-discipline is the ability to make yourself do what you should do, when you should do it, whether you feel like it or not.” (Elbert Hubbard)<\/p>\n<p><b>Try:<\/b> Do your hardest task first, before you feel ready.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Plan On Paper First:<\/b> Each evening this week, write tomorrow's top three tasks.<\/li><li><b>Get Clear:<\/b> Write what 'done' looks like for your most important task.<\/li><li><b>Build Self-Discipline:<\/b> Do your hardest task first, before you feel ready.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-more-done/01.jpg", "img/mx-more-done/02.jpg", "img/mx-more-done/03.jpg", "img/mx-more-done/04.jpg", "img/mx-more-done/05.jpg"], "added": 962}, {"id": "mx-growth-2", "topic": "Growth & discipline", "title": "The Growth Guarantee (Part 2)", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Be A Learn-It-All", "b": "Don't be a know-it-all. Be a learn-it-all.", "tags": ["Stay curious", "Ask questions", "Admit gaps"], "k": "Curiosity beats certainty."}, {"t": "Don't Coast", "b": "You don't coast to greatness.", "tags": ["Keep effort steady", "Small daily wins", "No autopilot"], "k": "Greatness is built daily."}, {"t": "Step Outside Comfort", "b": "Everything you want but don't have is outside your comfort zone.", "tags": ["One scary step", "Weekly", "Notice growth"], "k": "Comfort keeps you where you are."}], "plan": {"title": "Your one-week plan", "items": ["<b>Be A Learn-It-All:<\/b> Learn one new thing from someone today and tell them so.", "<b>Don't Coast:<\/b> Pick one area where you've been coasting and add effort this week.", "<b>Step Outside Comfort:<\/b> Do one thing this week that feels a little uncomfortable."]}, "article": {"title": "The Growth Guarantee (Part 2)", "sub": "3 lessons, made practical", "html": "<p>Keep learning and keep stretching.<\/p>\n<h3>1. Be A Learn-It-All<\/h3>\n<p>Don't be a know-it-all. Be a learn-it-all.<\/p>\n<p><b>Try:<\/b> Learn one new thing from someone today and tell them so.<\/p>\n<h3>2. Don't Coast<\/h3>\n<p>You don't coast to greatness.<\/p>\n<p><b>Try:<\/b> Pick one area where you've been coasting and add effort this week.<\/p>\n<h3>3. Step Outside Comfort<\/h3>\n<p>Everything you want but don't have is outside your comfort zone.<\/p>\n<p><b>Try:<\/b> Do one thing this week that feels a little uncomfortable.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Be A Learn-It-All:<\/b> Learn one new thing from someone today and tell them so.<\/li><li><b>Don't Coast:<\/b> Pick one area where you've been coasting and add effort this week.<\/li><li><b>Step Outside Comfort:<\/b> Do one thing this week that feels a little uncomfortable.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-growth-2/01.jpg", "img/mx-growth-2/02.jpg", "img/mx-growth-2/03.jpg", "img/mx-growth-2/04.jpg", "img/mx-growth-2/05.jpg"], "added": 961}, {"id": "mx-growth-1", "topic": "Growth & discipline", "title": "The Growth Guarantee (Part 1)", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Listen To Learn", "b": "You can't learn anything while you're talking.", "tags": ["Ask more", "Talk less", "Take notes"], "k": "Listening is where learning starts."}, {"t": "Make Time To Think", "b": "Sustained thinking will change your life.", "tags": ["Quiet time", "Pen and paper", "One question"], "k": "Good thinking leads to good living."}, {"t": "Grow On Purpose", "b": "Your growth must be intentional.", "tags": ["Pick one area", "Make a plan", "Daily habit"], "k": "Growth needs a plan."}], "plan": {"title": "Your one-week plan", "items": ["<b>Listen To Learn:<\/b> In your next conversation, ask one more question than you answer.", "<b>Make Time To Think:<\/b> Block 20 minutes this week just to think about one question.", "<b>Grow On Purpose:<\/b> Choose one area to grow and one daily habit for it."]}, "article": {"title": "The Growth Guarantee (Part 1)", "sub": "3 lessons, made practical", "html": "<p>Growth doesn't happen by accident. It starts with listening, thinking and intention.<\/p>\n<h3>1. Listen To Learn<\/h3>\n<p>You can't learn anything while you're talking.<\/p>\n<p><b>Try:<\/b> In your next conversation, ask one more question than you answer.<\/p>\n<h3>2. Make Time To Think<\/h3>\n<p>Sustained thinking will change your life.<\/p>\n<p><b>Try:<\/b> Block 20 minutes this week just to think about one question.<\/p>\n<h3>3. Grow On Purpose<\/h3>\n<p>Your growth must be intentional.<\/p>\n<p><b>Try:<\/b> Choose one area to grow and one daily habit for it.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Listen To Learn:<\/b> In your next conversation, ask one more question than you answer.<\/li><li><b>Make Time To Think:<\/b> Block 20 minutes this week just to think about one question.<\/li><li><b>Grow On Purpose:<\/b> Choose one area to grow and one daily habit for it.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-growth-1/01.jpg", "img/mx-growth-1/02.jpg", "img/mx-growth-1/03.jpg", "img/mx-growth-1/04.jpg", "img/mx-growth-1/05.jpg"], "added": 960}, {"id": "mx-stop-growing", "topic": "Growth & discipline", "title": "Why So Many Leaders Stop Growing", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Refresh Your Thinking", "b": "Growth requires continual refreshment of your thinking, materials and approach.", "tags": ["New books", "New people", "New methods"], "k": "Fresh input, fresh growth."}, {"t": "Don't Rest On Past Wins", "b": "Anticipate new challenges and resist resting on past achievements.", "tags": ["What's next?", "Plan ahead", "Stay hungry"], "k": "Yesterday's win won't carry tomorrow."}, {"t": "Pour Into Others", "b": "True legacy is built by pouring into others.", "tags": ["Mentor", "Share lessons", "Encourage"], "k": "Legacy is people, not trophies."}], "plan": {"title": "Your one-week plan", "items": ["<b>Refresh Your Thinking:<\/b> Swap one old habit or source for a new one this week.", "<b>Don't Rest On Past Wins:<\/b> Write down the next challenge you need to prepare for.", "<b>Pour Into Others:<\/b> Share one lesson you've learned with someone younger or newer."]}, "article": {"title": "Why So Many Leaders Stop Growing", "sub": "3 lessons, made practical", "html": "<p>Why so many leaders stop growing, and how to keep going.<\/p>\n<h3>1. Refresh Your Thinking<\/h3>\n<p>Growth requires continual refreshment of your thinking, materials and approach.<\/p>\n<p><b>Try:<\/b> Swap one old habit or source for a new one this week.<\/p>\n<h3>2. Don't Rest On Past Wins<\/h3>\n<p>Anticipate new challenges and resist resting on past achievements.<\/p>\n<p><b>Try:<\/b> Write down the next challenge you need to prepare for.<\/p>\n<h3>3. Pour Into Others<\/h3>\n<p>True legacy is built by pouring into others.<\/p>\n<p><b>Try:<\/b> Share one lesson you've learned with someone younger or newer.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Refresh Your Thinking:<\/b> Swap one old habit or source for a new one this week.<\/li><li><b>Don't Rest On Past Wins:<\/b> Write down the next challenge you need to prepare for.<\/li><li><b>Pour Into Others:<\/b> Share one lesson you've learned with someone younger or newer.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-stop-growing/01.jpg", "img/mx-stop-growing/02.jpg", "img/mx-stop-growing/03.jpg", "img/mx-stop-growing/04.jpg", "img/mx-stop-growing/05.jpg"], "added": 959}, {"id": "hl-focus", "topic": "Growth & discipline", "title": "Tools to Improve Your Focus & Concentration", "sub": "5 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Work In 90-Minute Blocks", "b": "Work in focused blocks of about 90 minutes, matching your ultradian cycles.", "tags": ["One task", "Timer on", "Phone away"], "k": "Work with your brain's rhythm, not against it."}, {"t": "Meditate 13 Minutes", "b": "A 13-minute daily meditation is one tool discussed for focus.", "tags": ["13 minutes", "Daily", "Eyes closed"], "k": "Short daily practice, sharper attention."}, {"t": "Train Your Visual Focus", "b": "Visual focus exercises can train concentration.", "tags": ["Pick a point", "Hold your gaze", "30–60 seconds"], "k": "Where your eyes go, your mind follows."}, {"t": "Try Deliberate Cold", "b": "Deliberate cold exposure is another tool covered.", "tags": ["Cold shower end", "Start small", "Ask a doctor first"], "k": "A safe, short challenge can sharpen alertness."}, {"t": "Defocus On Purpose", "b": "Taking time to deliberately defocus supports concentrated work.", "tags": ["Walk", "Look far away", "No phone"], "k": "Rest is part of focus."}], "plan": {"title": "Your one-week plan", "items": ["<b>Work In 90-Minute Blocks:<\/b> Do one 90-minute focus block tomorrow morning.", "<b>Meditate 13 Minutes:<\/b> Try a 13-minute meditation each day this week.", "<b>Train Your Visual Focus:<\/b> Before work, fix your gaze on one spot for 60 seconds.", "<b>Try Deliberate Cold:<\/b> If it's safe for you, end one shower with 30 seconds of cold.", "<b>Defocus On Purpose:<\/b> After each focus block, take ten minutes to fully switch off."]}, "article": {"title": "Tools to Improve Your Focus & Concentration", "sub": "5 lessons, made practical", "html": "<p>Focus is a skill, not a personality trait. These tools help you train it.<\/p>\n<h3>1. Work In 90-Minute Blocks<\/h3>\n<p>Work in focused blocks of about 90 minutes, matching your ultradian cycles.<\/p>\n<p><b>Try:<\/b> Do one 90-minute focus block tomorrow morning.<\/p>\n<h3>2. Meditate 13 Minutes<\/h3>\n<p>A 13-minute daily meditation is one tool discussed for focus.<\/p>\n<p><b>Try:<\/b> Try a 13-minute meditation each day this week.<\/p>\n<h3>3. Train Your Visual Focus<\/h3>\n<p>Visual focus exercises can train concentration.<\/p>\n<p><b>Try:<\/b> Before work, fix your gaze on one spot for 60 seconds.<\/p>\n<h3>4. Try Deliberate Cold<\/h3>\n<p>Deliberate cold exposure is another tool covered.<\/p>\n<p><b>Try:<\/b> If it's safe for you, end one shower with 30 seconds of cold.<\/p>\n<h3>5. Defocus On Purpose<\/h3>\n<p>Taking time to deliberately defocus supports concentrated work.<\/p>\n<p><b>Try:<\/b> After each focus block, take ten minutes to fully switch off.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Work In 90-Minute Blocks:<\/b> Do one 90-minute focus block tomorrow morning.<\/li><li><b>Meditate 13 Minutes:<\/b> Try a 13-minute meditation each day this week.<\/li><li><b>Train Your Visual Focus:<\/b> Before work, fix your gaze on one spot for 60 seconds.<\/li><li><b>Try Deliberate Cold:<\/b> If it's safe for you, end one shower with 30 seconds of cold.<\/li><li><b>Defocus On Purpose:<\/b> After each focus block, take ten minutes to fully switch off.<\/li><\/ul>\n<hr>\n<p><i>For education, not medical advice. Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/hl-focus/01.jpg", "img/hl-focus/02.jpg", "img/hl-focus/03.jpg", "img/hl-focus/04.jpg", "img/hl-focus/05.jpg", "img/hl-focus/06.jpg", "img/hl-focus/07.jpg"], "added": 958}, {"id": "mx-great-decisions", "topic": "Leadership", "title": "Making Great Decisions (Part 1)", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Manage Every Decision", "b": "Good decision-making isn't always about making the right decision, but managing and implementing the decision every day.", "tags": ["Decide", "Follow up", "Adjust daily"], "k": "Decisions are made right after they're made."}, {"t": "Prioritize Wisely", "b": "Prioritize decisions based on payoff, alignment with your goals, and effective delegation.", "tags": ["Biggest payoff?", "Fits my goals?", "Can someone else do it?"], "k": "Not every decision deserves your time."}, {"t": "Own The Follow-Through", "b": "Activity doesn't equal accomplishment; ownership and follow-through turn choices into outcomes.", "tags": ["Own it", "Finish it", "Review it"], "k": "Busy isn't the same as done."}], "plan": {"title": "Your one-week plan", "items": ["<b>Manage Every Decision:<\/b> Pick one recent decision and take one step to carry it out today.", "<b>Prioritize Wisely:<\/b> Sort today's to-dos by payoff and delegate one.", "<b>Own The Follow-Through:<\/b> Finish one task you've left half done."]}, "article": {"title": "Making Great Decisions (Part 1)", "sub": "3 lessons, made practical", "html": "<p>Making a decision is only the start. Managing it is the real work.<\/p>\n<h3>1. Manage Every Decision<\/h3>\n<p>Good decision-making isn't always about making the right decision, but managing and implementing the decision every day.<\/p>\n<p><b>Try:<\/b> Pick one recent decision and take one step to carry it out today.<\/p>\n<h3>2. Prioritize Wisely<\/h3>\n<p>Prioritize decisions based on payoff, alignment with your goals, and effective delegation.<\/p>\n<p><b>Try:<\/b> Sort today's to-dos by payoff and delegate one.<\/p>\n<h3>3. Own The Follow-Through<\/h3>\n<p>Activity doesn't equal accomplishment; ownership and follow-through turn choices into outcomes.<\/p>\n<p><b>Try:<\/b> Finish one task you've left half done.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Manage Every Decision:<\/b> Pick one recent decision and take one step to carry it out today.<\/li><li><b>Prioritize Wisely:<\/b> Sort today's to-dos by payoff and delegate one.<\/li><li><b>Own The Follow-Through:<\/b> Finish one task you've left half done.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-great-decisions/01.jpg", "img/mx-great-decisions/02.jpg", "img/mx-great-decisions/03.jpg", "img/mx-great-decisions/04.jpg", "img/mx-great-decisions/05.jpg"], "added": 957}, {"id": "mx-coach-playbook", "topic": "Leadership", "title": "How to Lead Like a Coach", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Call Out Hidden Potential", "b": "Great leaders consistently look for and call out hidden potential in those they lead.", "tags": ["Notice strengths", "Say it out loud", "Be specific"], "k": "People rise to what you see in them."}, {"t": "Make Space For Others", "b": "Creating space for others to lead requires intentional training and entrusting responsibility.", "tags": ["Teach", "Hand over", "Support"], "k": "Leaders create leaders."}, {"t": "Celebrate Often", "b": "A culture of celebration forges stronger teams and keeps everyone focused on the mission.", "tags": ["Small wins", "Public praise", "Make it regular"], "k": "Celebration builds momentum."}], "plan": {"title": "Your one-week plan", "items": ["<b>Call Out Hidden Potential:<\/b> Tell one person a specific strength you see in them.", "<b>Make Space For Others:<\/b> Hand one real responsibility to someone this week, and coach them through it.", "<b>Celebrate Often:<\/b> Celebrate one team or family win this week."]}, "article": {"title": "How to Lead Like a Coach", "sub": "3 lessons, made practical", "html": "<p>Great coaches lead by spotting potential, building others up and celebrating wins.<\/p>\n<h3>1. Call Out Hidden Potential<\/h3>\n<p>Great leaders consistently look for and call out hidden potential in those they lead.<\/p>\n<p><b>Try:<\/b> Tell one person a specific strength you see in them.<\/p>\n<h3>2. Make Space For Others<\/h3>\n<p>Creating space for others to lead requires intentional training and entrusting responsibility.<\/p>\n<p><b>Try:<\/b> Hand one real responsibility to someone this week, and coach them through it.<\/p>\n<h3>3. Celebrate Often<\/h3>\n<p>A culture of celebration forges stronger teams and keeps everyone focused on the mission.<\/p>\n<p><b>Try:<\/b> Celebrate one team or family win this week.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Call Out Hidden Potential:<\/b> Tell one person a specific strength you see in them.<\/li><li><b>Make Space For Others:<\/b> Hand one real responsibility to someone this week, and coach them through it.<\/li><li><b>Celebrate Often:<\/b> Celebrate one team or family win this week.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-coach-playbook/01.jpg", "img/mx-coach-playbook/02.jpg", "img/mx-coach-playbook/03.jpg", "img/mx-coach-playbook/04.jpg", "img/mx-coach-playbook/05.jpg"], "added": 956}, {"id": "mx-timeless", "topic": "Leadership", "title": "Timeless Leadership in a Data-Driven Age", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Keep The Human Things Human", "b": "Relationship, trust, discernment and values can never be outsourced.", "tags": ["Talk in person", "Build trust", "Use judgment"], "k": "Tools help. People lead."}, {"t": "Face Problems Head-On", "b": "Strong teams are built by leaders who confront problems head-on instead of avoiding them.", "tags": ["Name it", "Address it early", "Stay kind"], "k": "Avoided problems grow."}, {"t": "Lead Through Influence", "b": "Leadership is measured by influence, not position.", "tags": ["Earn trust", "Help others", "Lead without a title"], "k": "Influence is the real title."}], "plan": {"title": "Your one-week plan", "items": ["<b>Keep The Human Things Human:<\/b> Have one important conversation face to face this week.", "<b>Face Problems Head-On:<\/b> Address one problem you've been avoiding, kindly and directly.", "<b>Lead Through Influence:<\/b> Help someone succeed this week without being asked."]}, "article": {"title": "Timeless Leadership in a Data-Driven Age", "sub": "3 lessons, made practical", "html": "<p>Leadership that stays true in a data-driven age.<\/p>\n<h3>1. Keep The Human Things Human<\/h3>\n<p>Relationship, trust, discernment and values can never be outsourced.<\/p>\n<p><b>Try:<\/b> Have one important conversation face to face this week.<\/p>\n<h3>2. Face Problems Head-On<\/h3>\n<p>Strong teams are built by leaders who confront problems head-on instead of avoiding them.<\/p>\n<p><b>Try:<\/b> Address one problem you've been avoiding, kindly and directly.<\/p>\n<h3>3. Lead Through Influence<\/h3>\n<p>Leadership is measured by influence, not position.<\/p>\n<p><b>Try:<\/b> Help someone succeed this week without being asked.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Keep The Human Things Human:<\/b> Have one important conversation face to face this week.<\/li><li><b>Face Problems Head-On:<\/b> Address one problem you've been avoiding, kindly and directly.<\/li><li><b>Lead Through Influence:<\/b> Help someone succeed this week without being asked.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-timeless/01.jpg", "img/mx-timeless/02.jpg", "img/mx-timeless/03.jpg", "img/mx-timeless/04.jpg", "img/mx-timeless/05.jpg"], "added": 955}, {"id": "mx-memorable", "topic": "Leadership", "title": "Learn These Skills to Become a Memorable Leader", "sub": "3 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Empower Others", "b": "Empowering others doesn't diminish your influence. It multiplies it.", "tags": ["Share credit", "Delegate", "Trust people"], "k": "Give power away to grow influence."}, {"t": "Live Your Message", "b": "Live the message before you teach it.", "tags": ["Walk the talk", "Be consistent", "Lead by example"], "k": "People follow what you do."}, {"t": "Choose Progress Over Comfort", "b": "True leaders trade comfort for progress and excuses for action.", "tags": ["Drop one excuse", "Take action", "Accept discomfort"], "k": "Action beats excuses."}], "plan": {"title": "Your one-week plan", "items": ["<b>Empower Others:<\/b> Let someone else lead one task you'd usually do.", "<b>Live Your Message:<\/b> Pick one thing you tell others to do and do it yourself this week.", "<b>Choose Progress Over Comfort:<\/b> Replace one excuse with one action today."]}, "article": {"title": "Learn These Skills to Become a Memorable Leader", "sub": "3 lessons, made practical", "html": "<p>The skills that make a leader worth remembering.<\/p>\n<h3>1. Empower Others<\/h3>\n<p>Empowering others doesn't diminish your influence. It multiplies it.<\/p>\n<p><b>Try:<\/b> Let someone else lead one task you'd usually do.<\/p>\n<h3>2. Live Your Message<\/h3>\n<p>Live the message before you teach it.<\/p>\n<p><b>Try:<\/b> Pick one thing you tell others to do and do it yourself this week.<\/p>\n<h3>3. Choose Progress Over Comfort<\/h3>\n<p>True leaders trade comfort for progress and excuses for action.<\/p>\n<p><b>Try:<\/b> Replace one excuse with one action today.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Empower Others:<\/b> Let someone else lead one task you'd usually do.<\/li><li><b>Live Your Message:<\/b> Pick one thing you tell others to do and do it yourself this week.<\/li><li><b>Choose Progress Over Comfort:<\/b> Replace one excuse with one action today.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/mx-memorable/01.jpg", "img/mx-memorable/02.jpg", "img/mx-memorable/03.jpg", "img/mx-memorable/04.jpg", "img/mx-memorable/05.jpg"], "added": 954}, {"id": "hl-sleep", "topic": "Sleep & energy", "title": "Master Your Sleep & Be More Alert When Awake", "sub": "4 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Get Morning Light", "b": "Get light in your eyes as close to waking as you can. Through a window is far weaker.", "tags": ["Step outside", "5–10 minutes", "Soon after waking"], "k": "Morning light sets tonight's sleep."}, {"t": "Find Your Caffeine Cut-Off", "b": "Caffeine blocks adenosine, and tolerance varies, so find what works for you.", "tags": ["Note your last coffee", "Track your sleep", "Adjust"], "k": "Your cut-off time is personal."}, {"t": "Know What Melatonin Does", "b": "Melatonin may help you fall asleep but won't help you stay asleep.", "tags": ["Fix light first", "Fix timing", "Ask a doctor"], "k": "Habits before pills."}, {"t": "Keep Nights Dark", "b": "Avoid bright light late at night.", "tags": ["Dim lights", "Fewer screens", "Dark bedroom"], "k": "Bright mornings, dark nights."}], "plan": {"title": "Your one-week plan", "items": ["<b>Get Morning Light:<\/b> Go outside for 5–10 minutes within an hour of waking.", "<b>Find Your Caffeine Cut-Off:<\/b> Note when you have your last coffee, and move it earlier if sleep suffers.", "<b>Know What Melatonin Does:<\/b> Fix light and timing before trying supplements, and talk to a doctor first.", "<b>Keep Nights Dark:<\/b> Dim your lights and screens in the last two hours before bed."]}, "article": {"title": "Master Your Sleep & Be More Alert When Awake", "sub": "4 lessons, made practical", "html": "<p>Better sleep starts in the morning. These are the basics that matter most.<\/p>\n<h3>1. Get Morning Light<\/h3>\n<p>Get light in your eyes as close to waking as you can. Through a window is far weaker.<\/p>\n<p><b>Try:<\/b> Go outside for 5–10 minutes within an hour of waking.<\/p>\n<h3>2. Find Your Caffeine Cut-Off<\/h3>\n<p>Caffeine blocks adenosine, and tolerance varies, so find what works for you.<\/p>\n<p><b>Try:<\/b> Note when you have your last coffee, and move it earlier if sleep suffers.<\/p>\n<h3>3. Know What Melatonin Does<\/h3>\n<p>Melatonin may help you fall asleep but won't help you stay asleep.<\/p>\n<p><b>Try:<\/b> Fix light and timing before trying supplements, and talk to a doctor first.<\/p>\n<h3>4. Keep Nights Dark<\/h3>\n<p>Avoid bright light late at night.<\/p>\n<p><b>Try:<\/b> Dim your lights and screens in the last two hours before bed.<\/p>\n<h3>Your one-week plan<\/h3>\n<ul><li><b>Get Morning Light:<\/b> Go outside for 5–10 minutes within an hour of waking.<\/li><li><b>Find Your Caffeine Cut-Off:<\/b> Note when you have your last coffee, and move it earlier if sleep suffers.<\/li><li><b>Know What Melatonin Does:<\/b> Fix light and timing before trying supplements, and talk to a doctor first.<\/li><li><b>Keep Nights Dark:<\/b> Dim your lights and screens in the last two hours before bed.<\/li><\/ul>\n<hr>\n<p><i>Follow @explainit.simply for one simple life lesson a day.<\/i><\/p>"}, "cards": ["img/hl-sleep/01.jpg", "img/hl-sleep/02.jpg", "img/hl-sleep/03.jpg", "img/hl-sleep/04.jpg", "img/hl-sleep/05.jpg", "img/hl-sleep/06.jpg"], "added": 953}, {"id": "hl-light", "topic": "Sleep & energy", "title": "Using Light to Optimize Health", "sub": "4 simple lessons you can start this week.", "summary": null, "close": null, "safety": null, "lessons": [{"t": "Get Sunlight Often", "b": "Get sunlight exposure a few times a week.", "tags": ["Outdoors", "No sungl /* sync: pages live on the device (localStorage) and, when signed in on the hosted site, in Supabase table "pages" */
function usePageSync(setPages) {
  const [st, setSt] = useState({ mode: HOSTED() ? "checking" : "local", email: "" });

  const synced = useRef(store.get(P + "pages-synced", { uid: "", map: {} }));

    const sb = sbClient(), id = user.current; if (!sb || !id) return;
    const m = synced.current.map, all = store.get(P + "pages", []);
    const dirty = all.filter(p => (p.at || 0) > (m[p.id] || 0)); if (!dirty.length) return;
    setSt(s => ({ ...s, mode: "syncing" }));
    const { error } = await sb.from("pages").upsert(dirty.map(p => ({ user_id: id, id: p.id, data: p, updated_at: p.at || 0 })));
    if (error) { setSt(s => ({ ...s, mode: "error" })); return; }

    setSt(s => ({ ...s, mode: "synced" }));

    const sb = sbClient(); if (!sb || !HOSTED()) { setSt({ mode: "local", email: "" }); return; }

      const { data: rows, error } = await sb.from("pages").select("id,data,updated_at");
      if (error) throw error;
      const m = synced.current.map;
      setPages(local => {
        const by = new Map(local.map(p => [p.id, p]));
        (rows || []).forEach(r => { const l = by.get(r.id); if (!l || r.updated_at > (l.at || 0)) by.set(r.id, { ...r.data, at: r.updated_at }); m[r.id] = r.updated_at; });
        return [...by.values()];

      setSt(s => s.mode === "error" ? s : { ...s, mode: "synced" });
    } catch (e) { setSt(s => ({ ...s, mode: "error" })); }
  };
  useEffect(() => {
    pull();
    const sb = sbClient(); let sub = null;
    if (sb && HOSTED()) { const r = sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_IN" || ev === "SIGNED_OUT") pull(); }); sub = r && r.data && r.data.subscription; }
    const vis = () => { if (document.visibilityState === "visible" && user.current) pull(); };
    const on = () => push();
    document.addEventListener("visibilitychange", vis); window.addEventListener("online", on);
    return () => { if (sub) sub.unsubscribe(); document.removeEventListener("visibilitychange", vis); window.removeEventListener("online", on); };
  }, []);
  const changed = () => { if (!user.current) return; clearTimeout(timer.current); timer.current = setTimeout(push, 1200); };
  return [st, changed];
}

/* drag to reorder with pointer (mouse + touch); arrow keys on the handle also move */
function useDragSort(onMove) {
  const [drag, setDrag] = useState(null);
  const box = useRef(null);
  const start = (e, i) => {
    if (e.button > 0) return;
    e.preventDefault();
    const items = [...box.current.querySelectorAll(":scope > [data-sort]")];
    const rects = items.map(n => n.getBoundingClientRect());
    const el = e.currentTarget; try { el.setPointerCapture(e.pointerId); } catch (x) {}
    let to = i; setDrag({ from: i, to: i });
    const mv = ev => { const y = ev.clientY; let t = rects.findIndex(r => y < r.top + r.height / 2); if (t < 0) t = rects.length; to = t; setDrag({ from: i, to: t }); };
    const up = () => { el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up); setDrag(null); const dest = to > i ? to - 1 : to; if (dest !== i) onMove(i, dest); };
    el.addEventListener("pointermove", mv); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  };
  const key = (e, i, n) => { if (e.key === "ArrowUp" && i > 0) { e.preventDefault(); onMove(i, i - 1); } if (e.key === "ArrowDown" && i < n - 1) { e.preventDefault(); onMove(i, i + 1); } };
  const cls = (i, n) => !drag ? "" : (drag.from === i ? " dragging" : "") + (drag.to === i && drag.to !== drag.from && drag.to !== drag.from + 1 ? " drop" : "") + (i === n - 1 && drag.to === n && drag.from !== n - 1 ? " dropend" : "");
  return { box, start, key, cls };
}
const move = (arr, a, b) => { const x = arr.slice(); const [it] = x.splice(a, 1); x.splice(b, 0, it); return x; };
const GRIP = html`<svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3" r="1.5"/><circle cx="9" cy="3" r="1.5"/><circle cx="3" cy="8" r="1.5"/><circle cx="9" cy="8" r="1.5"/><circle cx="3" cy="13" r="1.5"/><circle cx="9" cy="13" r="1.5"/></svg>`;
const CARET = html`<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 4l10 8-10 8z"/></svg>`;
const SEARCH = html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>`;
const TRASH = html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>`;

function AutoText({ value, onChange, onKeyDown, onFocus, placeholder, cls, focus, label }) {
  const r = useRef(null);
  React.useLayoutEffect(() => { const el = r.current; if (el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; } }, [value]);
  useEffect(() => { if (focus && r.current) { const el = r.current; el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch (x) {} } }, [focus]);
  return html`<textarea ref=${r} rows="1" class=${"btext " + (cls || "")} value=${value || ""} placeholder=${placeholder} aria-label=${label || placeholder}
    onInput=${e => onChange(e.target.value)} onKeyDown=${onKeyDown} onFocus=${onFocus}></textarea>`;
}

/* ---- Pages home (inside Journal) ---- */
function PageTree({ pages, setPages, parent, depth, openPage, openSet, toggleOpen }) {
  const list = kids(pages, parent);
  const reorder = (a, b) => { const ids = move(list, a, b).map(p => p.id); const now = Date.now(); setPages(all => all.map(p => ids.includes(p.id) ? { ...p, order: ids.indexOf(p.id), at: now } : p)); };
  const ds = useDragSort(reorder);
  if (!list.length) return null;
  return html`<div class=${depth ? "pg-sub" : ""} ref=${ds.box}>${list.map((p, i) => {
    const sub = kids(pages, p.id), open = openSet.includes(p.id);
    return html`<${React.Fragment} key=${p.id}>
      <div class=${"pg-row" + ds.cls(i, list.length)} data-sort="1" style=${{ paddingLeft: 6 + depth * 22 }}>
        ${sub.length ? html`<button class="pg-car" aria-expanded=${open} aria-label=${(open ? "Hide" : "Show") + " sub-pages of " + (p.title || "Untitled")} onClick=${() => toggleOpen(p.id)}>${CARET}</button>` : html`<span class="pg-car" aria-hidden="true"></span>`}
        <button class="pg-open" onClick=${() => openPage(p.id)}><span class="e" aria-hidden="true">${p.icon || "📝"}</span><b>${p.title || "Untitled"}</b>
          <small>${sub.length ? sub.length + (sub.length === 1 ? " sub-page" : " sub-pages") : p.blog ? "Blog" : ago(p.at || Date.now())}</small></button>
        <button class="pg-grip" aria-label=${"Reorder " + (p.title || "Untitled") + ": drag, or use arrow keys"} onPointerDown=${e => ds.start(e, i)} onKeyDown=${e => ds.key(e, i, list.length)}>${GRIP}</button>
      </div>
      ${open && html`<${PageTree} pages=${pages} setPages=${setPages} parent=${p.id} depth=${depth + 1} openPage=${openPage} openSet=${openSet} toggleOpen=${toggleOpen} />`}
    </${React.Fragment}>`;
  })}</div>`;
}

function SyncLine({ sync }) {

}

function PagesHome({ pages, setPages, openPage, sync, trashView, setTrashView, toast }) {
  const [q, setQ] = useStored("pages-q", "");
  const [openSet, setOpenSet] = useStored("pages-open", []);
  const toggleOpen = id => setOpenSet(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const live = liveIn(pages);
  const alive = pages.filter(live);
  const favs = alive.filter(p => p.fav);
  const trash = pages.filter(p => p.trashed && !p.deleted);
  if (trashView) return html`<div>
    <div class="row-between" style=${{ marginTop: 16 }}><h2>Trash</h2><button class="link" onClick=${() => setTrashView(false)}>Back to pages</button></div>
    <p class="small muted" style=${{ margin: "4px 0 0" }}>Restore a page, or delete it for good. Sub-pages go with it.</p>
    ${trash.length ? html`<div class="card pg-list" style=${{ marginTop: 12 }}>${trash.map(p => html`<div key=${p.id} class="pg-row">
        <span class="pg-open" style=${{ paddingLeft: 8 }}><span class="e" aria-hidden="true">${p.icon || "📝"}</span><b>${p.title || "Untitled"}</b></span>
        <button class="pillbtn" onClick=${() => setPages(all => all.map(x => x.id === p.id ? { ...x, trashed: false, at: Date.now() } : x))}>Restore</button>
        <button class="pg-x" aria-label=${"Delete " + (p.title || "Untitled") + " for good"} onClick=${() => { const gone = new Set([p.id]); let grew = true; while (grew) { grew = false; pages.forEach(x => { if (x.parent && gone.has(x.parent) && !gone.has(x.id)) { gone.add(x.id); grew = true; } }); }
          setPages(all => all.map(x => gone.has(x.id) ? { id: x.id, parent: x.parent, deleted: true, at: Date.now() } : x)); toast("Deleted for good"); }}>${I.close}</button></div>`)}</div>`
      : html`<div class="card empty" style=${{ marginTop: 12 }}><b>Trash is empty</b>Pages you remove land here first.</div>`}
  </div>`;
  const ql = q.trim().toLowerCase();
  const hits = ql ? alive.filter(p => pageText(p).includes(ql)).sort((a, b) => (b.at || 0) - (a.at || 0)) : [];
  const row = p => html`<div key=${p.id} class="pg-row"><span class="pg-car" aria-hidden="true"></span>
    <button class="pg-open" onClick=${() => openPage(p.id)}><span class="e" aria-hidden="true">${p.icon || "📝"}</span><b>${p.title || "Untitled"}</b><small>${ago(p.at || Date.now())}</small></button></div>`;
  return html`<div>

      : html`
        ${favs.length > 0 && html`<p class="pg-lbl">★ Favourites</p><div class="card pg-list">${favs.map(row)}</div>`}
        <p class="pg-lbl">All pages</p>
        ${kids(pages, null).length ? html`<div class="card pg-list"><${PageTree} pages=${pages} setPages=${setPages} parent=${null} depth=${0} openPage=${openPage} openSet=${openSet} toggleOpen=${toggleOpen} /></div>`
          : html`<div class="card empty"><b>No pages yet</b>Start one for goals, habits, or notes on a blog you loved.</div>`}`}
    <${SyncLine} sync=${sync} />
    ${trash.length > 0 && html`<button class="pg-trashlink" onClick=${() => setTrashView(true)}>${TRASH}Trash (${trash.length})</button>`}
  </div>`;
}

    </div>`)}

function PageView({ id, pages, setPages, openPage, back, openBlog, trash, go }) {
  const page = pages.find(p => p.id === id);
  const [focus, setFocus] = useState({ id: null, n: 0 });
  const [active, setActive] = useState(null);
  const [hi, setHi] = useState(0);
  const [emoji, setEmoji] = useState(false);
  const [more, setMore] = useState(false);
  const titleRef = useRef(null);
  useEffect(() => { if (page && !page.title && titleRef.current) titleRef.current.focus(); }, [id]);
  React.useLayoutEffect(() => { const el = titleRef.current; if (el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; } });
  const ds = useDragSort((a, c) => upd(p => ({ blocks: move(p.blocks || [], a, c) })));
  if (!page || page.deleted) return html`<main class="screen"><${Brand} /><button class="round iconbtn" onClick=${back} aria-label="Back">${I.back}</button><div class="card empty" style=${{ marginTop: 20 }}><b>Page not found</b>It may have been deleted.</div></main>`;
  const upd = f => setPages(all => all.map(p => p.id === id ? { ...p, ...(typeof f === "function" ? f(p) : f), at: Date.now() } : p));
  const blocks = page.blocks || [];
  const setBlocks = f => upd(p => ({ blocks: f(p.blocks || []) }));
  const setB = (bid, v) => setBlocks(bs => bs.map(b => b.id === bid ? { ...b, ...v } : b));
  const focusOn = bid => setFocus(f => ({ id: bid, n: f.n + 1 }));
  const insertAfter = (bid, nb) => { setBlocks(bs => { const i = bs.findIndex(b => b.id === bid); const x = bs.slice(); x.splice(i < 0 ? x.length : i + 1, 0, nb); return x; }); focusOn(nb.id); };
  const remove = bid => { const i = blocks.findIndex(b => b.id === bid); const prev = blocks.slice(0, i).reverse().find(b => TEXTY.includes(b.type)); setBlocks(bs => bs.filter(b => b.id !== bid)); if (prev) focusOn(prev.id); };
  const subPage = (bid, replace) => { const np = newPage(id); const blk = B("page", "", { page: np.id }); setPages(all => [...all.map(p => p.id === id ? { ...p, at: Date.now(), blocks: (() => { const bs = (p.blocks || []).slice(); const i = bs.findIndex(b => b.id === bid); if (i >= 0 && (replace || !bs[i].text)) bs.splice(i, 1, blk); else bs.splice(i < 0 ? bs.length : i + 1, 0, blk); return bs; })() } : p), np]); openPage(np.id); };
  const choose = (b, type) => {
    setActive(null); setHi(0);
    if (type === "page") return subPage(b.id, true);
    const extra = type === "habits" ? { week: weekStart(), rows: [habitRow(), habitRow()] } : type === "toggle" ? { body: "", open: true } : {};
    setB(b.id, { type, text: "", checked: false, ...extra });
    if (type === "divider" || type === "habits") insertAfter(b.id, B("p")); else focusOn(b.id);
  };
  const menuFor = b => { const t = b.text || ""; if (active !== b.id || !t.startsWith("/") || t.length > 14) return null; const f = t.slice(1).toLowerCase(); return BLOCK_TYPES.filter(x => !f || x[1].toLowerCase().includes(f) || x[0].startsWith(f)); };

    const m = menuFor(b);

      if (e.key === "ArrowUp") { e.preventDefault(); setHi(h => (h - 1 + m.length) % m.length); return; }
      if (e.key === "Enter") { e.preventDefault(); choose(b, m[Math.min(hi, m.length - 1)][0]); return; }
      if (e.key === "Escape") { e.preventDefault(); setB(b.id, { text: "" }); return; }

  };

    if (b.type === "callout") return html`<div class="pg-callout"><span aria-hidden="true">💡</span>${txt(b)}</div>`;

    return txt(b);
  };
  return html`<main class="screen" onClick=${() => { if (more) setMore(false); }}>
    <${Brand} />
    <div class="row-between" style=${{ position: "relative" }}>
      <button class="round iconbtn" onClick=${back} aria-label="Back">${I.back}</button>
      <span class="pg-crumb">${["Pages", ...crumbs.map(x => x.title || "Untitled")].join(" › ")}</span>

        <button class="pg-mi" role="menuitem" onClick=${() => { upd({ fav: !page.fav }); setMore(false); }}><i>★</i>${page.fav ? "Remove from favourites" : "Add to favourites"}</button>
        <button class="pg-mi" role="menuitem" onClick=${() => { setMore(false); subPage(null); }}><i>📄</i>Add a sub-page</button>
        <button class="pg-mi" role="menuitem" onClick=${() => { setMore(false); trash(id); }}><i>${TRASH}</i>Move to trash</button></div>`}
    </div>

    <textarea ref=${titleRef} class="pg-title" rows="1" placeholder="Untitled" aria-label="Page title" value=${page.title}
      onInput=${e => upd({ title: e.target.value.replace(/\n/g, "") })} onKeyDown=${e => { if (e.key === "Enter") { e.preventDefault(); const f = blocks.find(b => TEXTY.includes(b.type)); if (f) focusOn(f.id); else { const nb = B("p"); setBlocks(bs => [nb, ...bs]); focusOn(nb.id); } } }}></textarea>
    ${page.blog && html`<div><button class="pg-bloglink" onClick=${() => openBlog(page.blog.id)}>${I.cards}Linked blog: <b>${page.blog.title}</b></button></div>`}
    <div class="pg-blocks" ref=${ds.box}>${blocks.map((b, i) => { const m = menuFor(b); return html`<div key=${b.id} data-sort="1">
